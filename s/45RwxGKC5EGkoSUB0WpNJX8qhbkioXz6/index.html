    if (showOxy) { var mins = st.flags[METER.flag]; els.oxyfill.style.width = Math.max(0, Math.min(100, mins / (METER.max || 60) * 100)) + "%"; els.oxymin.textContent = mins + " min"; }
    els.backTop.style.visibility = st.history.length ? "visible" : "hidden";
    els.toptitle.textContent = isPhoto ? "You were really there" : ("Page " + page.page);
    els.scroller.scrollTop = 0;
    buildSegments(); setReadBtn("idle");
    save();
    document.body.dataset.page = id;
    if (autoRead && userTapped) { var myGen = gen; setTimeout(function () { if (myGen === gen && pageId === id && !rd.on) startReading(0, 0); }, 450); }
  }

  // ---------------- read to me ----------------
  // Recorded narration plays clip by clip (one clip per story part, so extra lines and variants play in order).
  // The browser's built-in voice is used only for a part whose recording is missing or fails to load.
  var PREFERRED = ["samantha", "google us english", "natural", "aria", "jenny", "ava", "allison", "susan", "karen", "serena", "daniel", "moira", "google uk english female"];
  var rd = { on: false, paused: false, resume: null, seg: 0, mode: null, p: 0, w: 0, speed: 1, voice: null, voices: [] };
  try { var r0 = parseFloat(localStorage.getItem(KEY + "speed")); if (r0 >= 0.5 && r0 <= 1.5) rd.speed = r0; } catch (e) {}

  try { if (localStorage.getItem(KEY + "auto") === "0") autoRead = false; } catch (e) {}

  function buildSegments() {

  }
  function setReadBtn(state) {

    if (els.big) {

  }
  function highlight(pi, wi) {

  }
  function clearHl() { if (hlEl) hlEl.classList.remove("cur"); hlEl = null; }
  function loadVoices() {
    if (!synth) return;
    var all = synth.getVoices() || []; if (!all.length) return;
    var en = all.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    rd.voices = en.concat(all.filter(function (v) { return en.indexOf(v) < 0; }));
    var saved = null; try { saved = localStorage.getItem(KEY + "voice"); } catch (e) {}
    var pick = saved ? rd.voices.filter(function (v) { return v.voiceURI === saved; })[0] : null;
    for (var i = 0; i < PREFERRED.length && !pick; i++) pick = en.filter(function (v) { return v.name.toLowerCase().indexOf(PREFERRED[i]) >= 0; })[0] || null;
    if (!pick) pick = en.filter(function (v) { return /en[-_]us/i.test(v.lang); })[0] || en[0] || all[0];
    rd.voice = pick;
    var sel = $("voice"); sel.innerHTML = "";
    rd.voices.forEach(function (v, i) { var o = document.createElement("option"); o.value = i; o.textContent = v.name + " (" + v.lang + ")"; if (v === pick) o.selected = true; sel.appendChild(o); });
  }
  if (synth) { loadVoices(); if ("onvoiceschanged" in synth) synth.onvoiceschanged = loadVoices; setTimeout(loadVoices, 600); setTimeout(loadVoices, 1600); }
  $("voice").onchange = function () { rd.voice = rd.voices[+this.value] || null; try { localStorage.setItem(KEY + "voice", rd.voice ? rd.voice.voiceURI : ""); } catch (e) {} };
  function showSpeed() { $("speed").value = rd.speed; $("speedVal").textContent = rd.speed.toFixed(2).replace(/0$/, "") + "\u00D7"; }
  showSpeed();
  $("speed").oninput = function () {
    rd.speed = +this.value; showSpeed();
    if (audioEl) audioEl.playbackRate = rd.speed;
    try { localStorage.setItem(KEY + "speed", rd.speed); } catch (e) {}
  };
  $("auto").checked = autoRead;
  $("auto").onchange = function () { autoRead = this.checked; try { localStorage.setItem(KEY + "auto", autoRead ? "1" : "0"); } catch (e) {} };

  function chunkEnd(text, from) {
    var re = /[.!?]+["'\u201d\u2019)]*\s+/g, end = -1, m; re.lastIndex = from;
    while ((m = re.exec(text))) { var e = m.index + m[0].length; if (end < 0 || e - from <= 180) end = e; if (e - from > 180) break; }
    return end < 0 ? text.length : end;
  }
  function stopTimers() { if (timer) clearTimeout(timer); timer = null; if (startWatch) clearTimeout(startWatch); startWatch = null; if (raf) cancelAnimationFrame(raf); raf = 0; }
  function stopReading(keepHl) {
    gen++; stopTimers(); if (synth) synth.cancel(); current = null;
    if (audioEl) { audioEl.onended = audioEl.onerror = audioEl.ontimeupdate = null; audioEl.pause(); audioEl = null; }
    rd.on = false; rd.paused = false; rd.resume = null; rd.mode = null; setReadBtn("idle"); if (!keepHl) clearHl();
  }
  function doneReading() { stopReading(); rd.p = 0; rd.w = 0; rd.seg = 0; }

  // Built-in voice for paragraphs pi..lastPi, then done()
  function speakFrom(pi, wi, lastPi, done) {
    var para = paras[pi] && paras[pi].t, list = words[pi];
    if (para == null || pi > lastPi) return done();
    if (!list || !list.length || wi >= list.length) return speakFrom(pi + 1, 0, lastPi, done);
    var my = gen, from = list[wi].start, to = chunkEnd(para, from), text = para.slice(from, to);
    var u = new SpeechSynthesisUtterance(text);
    u.lang = (rd.voice && rd.voice.lang) || "en-US"; if (rd.voice) { try { u.voice = rd.voice; } catch (e) {} }

    var got = false, cw = [];
    for (var k = wi; k < list.length && list[k].start < to; k++) cw.push(k);
    function wordAt(ci) { var abs = from + ci, best = cw[0]; for (var j = 0; j < cw.length; j++) { if (list[cw[j]].start <= abs + 1) best = cw[j]; else break; } return best; }
    u.onboundary = function (e) { if (my !== gen) return; if (e.name && e.name !== "word") return; got = true; boundaryWorks = true; if (timer) { clearTimeout(timer); timer = null; } highlight(pi, wordAt(e.charIndex || 0)); };
    function runTimer(idx) {
      if (my !== gen || got || idx >= cw.length) return;
      highlight(pi, cw[idx]);
      var w = list[cw[idx]], tok = para.slice(w.start, w.end).replace(/["'\u201d\u2019]+$/, "");
      var ms = (tok.length + 1) * 62 / rate + 90 / rate;
      if (/[,;:]$/.test(tok)) ms += 220 / rate; if (/[.!?]$/.test(tok)) ms += 420 / rate;
      timer = setTimeout(function () { runTimer(idx + 1); }, ms);
    }
    u.onstart = function () { if (my !== gen) return; if (startWatch) { clearTimeout(startWatch); startWatch = null; } highlight(pi, wi); if (!boundaryWorks) timer = setTimeout(function () { if (!got) runTimer(0); }, 250); };
    u.onend = function () { if (my !== gen) return; stopTimers(); if (to >= para.length) speakFrom(pi + 1, 0, lastPi, done); else { var nw = wi; while (nw < list.length && list[nw].start < to) nw++; speakFrom(pi, nw, lastPi, done); } };
    u.onerror = function (e) { if (my !== gen) return; if (e && (e.error === "interrupted" || e.error === "canceled")) return; stopTimers(); doneReading(); els.note.textContent = (synth.getVoices() || []).length ? "The voice stopped. Tap Read to me to try again." : "No reading voice was found on this device. You can still read it yourself."; };
    highlight(pi, wi); synth.speak(u); if (synth.paused) synth.resume();
    startWatch = setTimeout(function () { if (my !== gen || !rd.on) return; if (!synth.speaking) { synth.cancel(); synth.speak(u); } }, 4000);
  }

  // Recorded clip with word timings
  function playAudioSeg(si, local, at) {
    var g = segs[si], W = g.a.words, my = gen, el = new Audio();
    audioEl = el; rd.mode = "audio"; rd.seg = si;
    el.preload = "auto";
    try { el.preservesPitch = true; el.mozPreservesPitch = true; el.webkitPreservesPitch = true; } catch (e) {}
    var t0 = at != null ? at : (local > 0 && W[local] ? Math.max(0, W[local][0] - 0.05) : 0), last = -1;
    function sync() {
      if (my !== gen || audioEl !== el) return;
      var t = el.currentTime + 0.03, i = last < 0 ? 0 : last;
      if (i > 0 && W[i][0] > t) i = 0;
      while (i < W.length - 1 && W[i + 1][0] <= t) i++;

    }

      el.playbackRate = rd.speed;
      var pr = el.play();

        if (err && err.name === "NotAllowedError") { rd.resume = { seg: si, t: t0 }; stopTimers(); audioEl = null; rd.on = false; rd.paused = true; setReadBtn("paused"); els.note.textContent = "Tap \u25B6 to hear the story."; }

    el.onended = function () { if (my !== gen) return; stopTimers(); playSeg(si + 1, 0); };

    highlight(g.map[local] ? g.map[local][0] : g.map[0][0], g.map[local] ? g.map[local][1] : g.map[0][1]);
  }
  function playSeg(si, local) {
    if (!rd.on) return;
    stopTimers(); audioEl = null;
    if (si >= segs.length) return doneReading();
    var g = segs[si]; rd.seg = si;
    if (!g.n) return playSeg(si + 1, 0);
    if (g.a && !g.failed) return playAudioSeg(si, local || 0);

    }
    playSeg(si + 1, 0);
  }
  function begin() { els.note.textContent = ""; rd.on = true; rd.paused = false; setReadBtn("playing"); }
  function startReading(pi, wi) {
    stopReading(); begin();
    var sl = segOf(pi, wi); playSeg(sl[0], sl[1]);
  }
  function pauseReading() {
    if (!rd.on) return;
    var r = { seg: rd.seg, p: rd.p, w: rd.w };

  }

  }

  if (els.big) els.big.onclick = togglePlay;
  document.addEventListener("keydown", function (e) {

    var tg = e.target && e.target.tagName; if (tg === "INPUT" || tg === "SELECT" || tg === "TEXTAREA" || tg === "BUTTON") return;

  });
  els.text.addEventListener("click", function (e) { var t = e.target; if (!t || !t.classList || !t.classList.contains("w")) return; userTapped = true; startReading(+t.dataset.p, +t.dataset.w); });

  // ---------------- menu ----------------
  function openMenu() {
    var f = found(), ids = Object.keys(S.endings).sort(function (a, b) { return S.endings[a].page - S.endings[b].page; });
    var g = f.filter(function (x) { return S.endings[x] && S.endings[x].type === "GOOD"; }).length;
    $("foundSum").textContent = "Endings found: " + f.length + " of " + ids.length + " (" + g + " good, " + (f.length - g) + " bad)";
    var ul = $("foundList"); ul.innerHTML = "";
    ids.forEach(function (id) { var e = S.endings[id], li = document.createElement("li"), has = f.indexOf(id) >= 0;
      li.className = has ? "yes" : "no"; li.textContent = (has ? "\u2714 " : "\u25CB ") + e.title + (e.type === "GOOD" ? " \u2B50" : ""); ul.appendChild(li); });
    $("modal").classList.add("show");
  }
  $("menuBtn").onclick = openMenu;
  $("mClose").onclick = function () { $("modal").classList.remove("show"); };
  $("mStart").onclick = function () { $("modal").classList.remove("show"); startOver(); };
  $("mReset").onclick = function () { if (confirm("Forget all endings found?")) { try { localStorage.removeItem(FOUND); } catch (e) {} openMenu(); } };
  $("modal").onclick = function (e) { if (e.target === this) this.classList.remove("show"); };
  els.backTop.onclick = backToChoice;
  document.addEventListener("pointerdown", function () { userTapped = true; }, true);
  document.addEventListener("keydown", function () { userTapped = true; }, true);
  window.addEventListener("pagehide", function () { stopReading(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden && rd.on) pauseReading(); });

  // test hooks
  window.MoonAdventure = window.ReadAlong = { togglePlay: function () { togglePlay(); }, state: function () { return clone(st); }, startOver: startOver, back: backToChoice,
    go: function (id, flags) { stopReading(); st.at = id; if (flags) for (var k in flags) st.flags[k] = flags[k]; render(); },

    reading: function () { return { on: rd.on, paused: rd.paused, seg: rd.seg, mode: rd.mode, t: audioEl ? audioEl.currentTime : null, src: audioEl ? audioEl.src : null, rate: audioEl ? audioEl.playbackRate : null, cur: hlEl ? +hlEl.dataset.i : -1, speed: rd.speed }; } };

})();
