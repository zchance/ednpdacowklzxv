<title>Flying Pork Chops</title>
<style>
:root{--bg:#3e5f2a;--panel:#fbf6ec;--ink:#24211c;--accent:#e8a33d;--good:#2f8f5b;--muted:#7b7266;--hl:#ffe08a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#top{flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;background:#2f4a1f;color:#fff;min-height:56px}
#top .t{flex:1;font-size:18px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:#5a7f3a;color:#fff;border:0;border-radius:12px;font-size:22px;min-width:48px;height:48px;cursor:pointer}
.iconbtn:disabled{opacity:.35}
#bigplay{min-width:64px;width:64px;height:64px;border-radius:50%;font-size:26px;background:#2f8f5b;color:#fff;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.35);letter-spacing:-3px;line-height:1;padding:0}
#bigplay[data-state=playing]{background:#e8a33d;color:#2a1b05}
#bigplay:active{transform:translateY(2px)}
#picwrap{flex:none;position:relative;background:#000;height:min(46vh,calc(100vw*0.75));display:flex;justify-content:center;align-items:center;overflow:hidden}
#picwrap img{max-width:100%;max-height:100%;object-fit:contain;display:block;transition:opacity .25s;position:relative}
#picwrap #picbg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);max-width:none;max-height:none;object-fit:cover;filter:blur(22px) brightness(.55)}
#picwrap img.fade{opacity:0}
#pdots{position:absolute;bottom:8px;left:0;right:0;text-align:center}
#pdots span{display:inline-block;width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.4);margin:0 3px;box-shadow:0 0 2px rgba(0,0,0,.6)}
#pdots span.on{background:#fff}
#scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel)}
#page{max-width:900px;margin:0 auto;padding:18px 22px 40px}
#where{font-size:16px;color:var(--muted);margin:2px 0 4px}
h1{font-size:30px;margin:0 0 10px;line-height:1.2}
#booktitle{display:none;font-size:clamp(28px,4vw,38px);color:#8a3b12;margin:0 0 6px}
#text p{font-size:clamp(23px,3.1vw,30px);line-height:1.6;margin:0 0 .8em}
#text em{font-style:italic}
#text b{font-weight:800}
.w{border-radius:6px;padding:0 1px;transition:background .12s;cursor:pointer}
.w.cur{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
#readbar{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.btn{font:inherit;font-size:22px;border:0;border-radius:16px;padding:14px 20px;cursor:pointer;min-height:60px}
#read{background:#2f5f9f;color:#fff;min-width:210px}
#read[data-state=playing]{background:#1f7a52}
#speedbox{display:flex;flex-direction:column;justify-content:center;font-size:16px;color:var(--muted);min-width:180px;flex:1;max-width:320px}
#speedbox input{width:100%;height:36px;accent-color:#2f5f9f}
#nav{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
.choice{font:inherit;font-size:clamp(22px,3vw,28px);font-weight:700;border:0;border-radius:18px;padding:16px 22px;min-height:72px;cursor:pointer;background:var(--accent);color:#2a1b05;box-shadow:0 4px 0 #b97b1f;flex:1;min-width:200px}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 #b97b1f}
.choice.home{background:#e9e1d3;color:#2a2318;box-shadow:0 4px 0 #b8ab95}
.choice[hidden]{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
#modal.show{display:flex}
#card{background:#fff;border-radius:18px;max-width:640px;width:92vw;max-height:88vh;overflow:auto;padding:20px 22px}
#card h2{margin:0 0 6px}
#card label.chk{display:flex;gap:10px;align-items:center;font-size:17px;margin:12px 0}
#card label.chk input{width:26px;height:26px}
#card .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#card .row .btn{font-size:18px;min-height:50px;padding:10px 16px;background:#eee}
#card ol{padding-left:24px;font-size:17px;columns:2}
#card ol li{padding:3px 0;cursor:pointer;color:#2f5f9f;break-inside:avoid}
@media (orientation:landscape) and (max-height:700px){#picwrap{height:42vh}}
@media (max-width:560px){#top{gap:6px;padding:6px 8px}#top .t{font-size:15px}#card ol{columns:1}}
</style>

var STORY = {"title": "Flying Pork Chops", "storage_key": "porkChop.v1.", "scenes": [{"id": "p01", "title": "Pork Chop's Big Dream", "place": "The mud puddle", "image": "img/p01.jpg", "paragraphs": ["Pork Chop was a pig with one big dream. Every day he lay in the mud and watched the birds zip across the sky. \"Someday,\" he said, \"that will be me.\"", "\"Pigs can't fly,\" said the cow, chewing her grass.", "\"Not yet,\" said Pork Chop."]}, {"id": "p02", "title": "Olive the Ostrich", "place": "Across the farm", "image": "img/p02.jpg", "paragraphs": ["So he trotted across the farm to see Olive. Olive was an ostrich. She was the biggest bird on the farm, maybe the biggest bird anywhere!", "\"Olive,\" said Pork Chop, \"you are the biggest bird I know. Please teach me to fly!\""]}, {"id": "p03", "title": "A Bird Who Runs", "place": "Across the farm", "image": "img/p03.jpg", "paragraphs": ["Olive blinked her giant eyes. \"I am an ostrich. I do not fly.\"", "\"But you are a bird! You have wings and everything!\"", "\"I am a bird who runs,\" said Olive, lifting her chin. \"Very, very fast.\""]}, {"id": "p04", "title": "Lesson One", "place": "The farmyard", "image": "img/p04.jpg", "paragraphs": ["Pork Chop thought about this for a long time. He scratched his ear with his back hoof. \"Okay,\" he said at last. \"Teach me to run very, very fast. Then I will just keep going, and I will fly.\"", "Olive sighed a long ostrich sigh. \"Fine. Lesson one. Flap your arms like this.\""]}, {"id": "p05", "title": "BONK", "place": "The farmyard", "image": "img/p05.jpg", "paragraphs": ["Pork Chop flapped his front legs as hard as he could. Flap, flap, flap. He tipped forward and fell right on his nose. BONK.", "\"Ow,\" said Pork Chop. \"Pigs are heavy in the front.\""]}, {"id": "p06", "title": "Lesson Two", "place": "Past the barn", "image": "img/p06.jpg", "paragraphs": ["\"Lesson two,\" said Olive. \"Run!\"", "Pork Chop ran. His ears flopped. His belly jiggled. His curly tail spun like a little wheel. He ran faster and faster, right past the barn, right past the chickens, and right into the mud."]}, {"id": "p07", "title": "SPLAT", "place": "The mud", "image": "img/p07.jpg", "paragraphs": ["SPLAT.", "He sat up. Mud covered his whole face. \"Was I flying?\" he asked.", "\"You were mudding,\" said Olive."]}, {"id": "p08", "title": "Lesson Three", "place": "The farmyard", "image": "img/p08.jpg", "paragraphs": ["The chickens giggled. The cow rolled her eyes.", "\"Lesson three,\" said Olive. \"Wings need wind. Moving air is what pushes a bird up. Face the wind and run right into it.\""]}, {"id": "p09", "title": "I FLEW!", "place": "Facing the wind", "image": "img/p09.jpg", "paragraphs": ["Pork Chop licked his finger, which was really a hoof, and held it up. The wind was coming from the hill. He faced it. He wiggled his bottom. He ran. He jumped. For one tiny second, all four of his feet left the ground.", "\"I FLEW!\" he yelled.", "\"You hopped,\" said Olive."]}, {"id": "p10", "title": "A Big Idea", "place": "Pork Chop's pen", "image": "img/p10.jpg", "paragraphs": ["\"I flew a little bit!\" said Pork Chop. \"A very little bit counts!\"", "That night, Pork Chop could not sleep. He lay in his pen and thought and thought. Then he had an idea. It was a BIG idea!"]}, {"id": "p11", "title": "The Bedsheet", "place": "The top of the hill", "image": "img/p11.jpg", "paragraphs": ["In the morning, he snuck to the clothesline and pulled down a bedsheet. He held one end in each front hoof. He marched to the top of the hill, where the wind blew the hardest.", "\"Pork Chop,\" said Olive, \"what are you doing?\"", "\"Flying!\" said Pork Chop. And he ran down the hill."]}, {"id": "p12", "title": "WHOOSH!", "place": "Over the farm", "image": "img/p12.jpg", "paragraphs": ["The wind filled the sheet like a big balloon. WHOOSH! Pork Chop floated right up off the grass. He sailed over the fence. He sailed over the chickens. He sailed right over the cow's head."]}, {"id": "p13", "title": "Pigs Can GLIDE!", "place": "Over the cow", "image": "img/p13.jpg", "paragraphs": ["The cow's mouth fell open. Her grass fell out. \"Pigs can't fly!\" she said.", "\"Pigs can GLIDE!\" said Pork Chop."]}, {"id": "p14", "title": "SPLAT Again", "place": "The mud", "image": "img/p14.jpg", "paragraphs": ["Then the wind stopped. Pork Chop came down, down, down, and landed right in the mud.", "SPLAT."]}, {"id": "p15", "title": "A Big Wing", "place": "The mud", "image": "img/p15.jpg", "paragraphs": ["Olive ran over on her long legs. She looked at the sheet. She looked at the pig. \"That was not bad,\" she said. \"Big wings catch more air. Your sheet was a big wing.\"", "Pork Chop grinned. Mud dripped off his snout. \"Did you hear that, everyone? I have a WING!\""]}, {"id": "p16", "title": "A Bigger Sheet", "place": "The farmyard", "image": "img/p16.jpg", "paragraphs": ["\"Tomorrow,\" he said, \"I am getting a bigger sheet.\"", "Olive laughed so hard she had to put her head in the sand to stop giggling.", "**The End**"]}]};
