<script>
var STORY = {"title": "Evelyn and the TimeBand: The Golden Spike", "version": "1.0", "start": "s01", "storage_key": "spikeAdventure.v1.", "photo_where": "Real photos from 1869", "meter": {"short": "⏱", "label": "Trip clock", "max": 60, "flag": "clock_min", "field": "clock"}, "flags": {"charges": 3, "walked_trail": false, "ten_mile": false, "knows_code": false, "saw_grades": false, "clock_min": 60, "via": null, "recording_saved": false}, "notes": "Second-person time-travel adventure (mission 2). Tokens {variant} and {bonus} are filled by the player from state.via and flags.", "scenes": {"s01": {"id": "s01", "page": 1, "title": "The Second Mission", "place": "Your kitchen, Saturday morning", "image": "img/s01.jpg", "paragraphs": ["On Saturday morning, Dr. Ada Finch knocks on the kitchen door. She has come for honey, like always. She also has her metal case.", "\"Your Moon recording plays at the museum every day,\" she says. \"People stop and listen. Now I need you again.\"", "She opens the case. There is the TimeBand. She snaps it on your wrist, and three green dots light up.", "\"In 1869, people finished the first railroad across America,\" she says. \"The last spike went in at a place in Utah called Promontory Summit. We have photos of that day. But we have no sound. Back then, nobody could record sound. The first machine that could record sound and play it back came eight years later.\"", "\"Your mission is to bring home the sound of the moment the railroad was finished. The last spike, and the telegraph word DONE.\"", "Mom sets a jar of honey on the table. \"Lots of your great-great-grandparents walked to Utah,\" she says. \"Some of them pulled handcarts.\"", "\"Same rules as the Moon,\" Dr. Finch says. \"Each trip uses a charge. Coming home is free. Watch, but don't change anything. Press the red button and hold still to record. And the band can keep you in the past for only one hour. Watch the trip clock.\"", "She hands you a dress, an apron, a bonnet, and boots. \"Girls dressed like this back then. Nobody must notice you.\"", "\"You could visit a handcart company first,\" she says. \"That trip is to 1856. It would use a charge.\""], "choices": [{"label": "Visit the handcart trail", "prompt": "If you want to visit a handcart company on the trail in 1856, tap 'Visit the handcart trail.'", "target": "s02", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "Open the mission map", "prompt": "If you are ready to pick a day in 1869, tap 'Open the mission map.'", "target": "s05", "hop": false}]}, "s02": {"id": "s02", "page": 2, "title": "The Handcart Trail", "place": "Beside the Platte River, Nebraska Territory - August 1856, late afternoon", "image": "img/s02.jpg", "paragraphs": ["You press the band. The kitchen goes white, then quiet.", "You stand in tall grass by a wide, shallow river. A long line of people walks along a dirt trail. They are not riding. They are pulling carts.", "Each handcart has two big wooden wheels and two long handles. A grown-up stands between the handles and pulls. Kids push from behind. The carts carry flour, blankets, pots, and tents.", "This is the first handcart company. Their captain is Edmund Ellsworth. They are Latter-day Saints, on their way to Salt Lake City. Many of them came on a ship from England. They started in Iowa in June. They will get there at the end of September.", "A little girl walks next to the captain. Her name is Annie, and she is four. She walks all day. Her family promised her bread and butter when she gets to the valley.", "Wheels make the work easier. A wheel rolls. A heavy box would have to drag.", "But one cart has a wheel that squeaks and squeaks.", "Your trip clock says 60 minutes."], "choices": [{"label": "Ride in a cart", "prompt": "If you climb up and ride in a handcart, tap 'Ride in a cart.'", "target": "e_safety_return", "hop": false, "sets": {"via": "cart"}}, {"label": "Walk with Annie", "prompt": "If you walk at the side of the trail near Annie, tap 'Walk with Annie.'", "target": "s03", "hop": false}], "clock": 60}, "s03": {"id": "s03", "page": 3, "title": "The Squeaky Wheel", "place": "Camp by the Platte River - before sunset", "image": "img/s03.jpg", "paragraphs": ["You walk at the side of the trail, near Annie. She hums. Nobody minds one more child in the dust.", "Before sunset, the company stops to camp. The squeaky cart stops too. A man tips it on its side and looks at the wheel.", "The wooden wheel turns on a wooden axle. Rub, rub, squeak. The axle is worn thin. It's hot to touch.", "When things rub, they slow down, get hot, and wear away. That's called friction.", "The man wraps a strip of tin around the axle and taps it down with a hammer. Smooth metal rubs less than rough wood. He spins the wheel. It still squeaks, but less.", "\"They walk about fifteen miles a day,\" Dr. Finch says softly in your ear. \"On foot, it takes them all summer to reach the valley. In 1869, a train will make the same trip in a few days.\"", "The hammer sits on the cart.", "Your trip clock says 40 minutes."], "choices": [{"label": "Hammer it yourself", "prompt": "If you pick up the hammer and fix the wheel yourself, tap 'Hammer it yourself.'", "target": "e_safety_return", "hop": false, "sets": {"via": "wheel"}}, {"label": "Stay for supper", "prompt": "If you stay and watch the camp make supper, tap 'Stay for supper.'", "target": "s04", "hop": false}], "on_enter": {"set": {"walked_trail": true}}, "clock": 40}, "s04": {"id": "s04", "page": 4, "title": "Songs at Camp", "place": "Camp by the Platte River - sunset", "image": "img/s04.jpg", "paragraphs": ["Small fires glow in a circle. There are not many trees out here, so the fires burn dried buffalo chips. That's dried buffalo poop! It burns hot and slow.", "Supper cooks in pans over the fires.", "Then someone starts to sing, and everyone joins in:", "\"Some must push and some must pull, as we go marching up the hill. As merrily on the way we go, until we reach the valley, oh!\"", "Annie claps. Her feet are dusty, but she smiles.", "You think about the walk. More than a thousand miles, step by step.", "Your trip clock says 10 minutes. \"Time to come home soon,\" Dr. Finch says. \"The mission map is waiting.\""], "choices": [{"label": "Sleep by the fire", "prompt": "If you curl up by the warm fire for a little nap, tap 'Sleep by the fire.'", "target": "e_time_up", "hop": false, "sets": {"via": "camp"}}, {"label": "Go home to the map", "prompt": "If you go home and open the mission map, tap 'Go home to the map.' (Going home is free.)", "target": "s05", "hop": false}], "clock": 10}, "s05": {"id": "s05", "page": 5, "title": "The Mission Map", "place": "The TimeBand screen, in your kitchen", "image": "img/s05.jpg", "paragraphs": ["Back in the kitchen, Dr. Finch taps the band. A map lights up. A line runs all the way across America.", "\"In 1863, two railroad companies started building,\" she says. \"The Central Pacific built east from California. The Union Pacific built west from Nebraska. In 1869, they met in Utah.\"", "The band shows four stops.", "March 1869. Two dirt roads, side by side, in the mountains.", "April 28, 1869. Ten-Mile Day.", "May 8, 1869. That's the date written on the golden spike.", "May 10, 1869. Tap it, and the band lets you pick a place.", "\"Picking a place is free,\" Dr. Finch says. \"So is looking at the telegraph wires. Trips are not.\"", "You look at your green dots, and you think."], "choices": [{"label": "The two grades", "prompt": "If you want to see the workers building the grade in March 1869, tap 'The two grades.'", "target": "s06", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "Ten-Mile Day", "prompt": "If you want to see the record day, April 28, 1869, tap 'Ten-Mile Day.'", "target": "s08", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "May 8", "prompt": "If you want to go on May 8, 1869, the date on the golden spike, tap 'May 8.'", "target": "e_wrong_day", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "May 10", "prompt": "If you want to pick a place for May 10, 1869, tap 'May 10.' (Picking is free.)", "target": "s11", "hop": false}, {"label": "Look at the wires", "prompt": "If you want to look at the telegraph wires, tap 'Look at the wires.' (Looking is free.)", "target": "s25", "hop": false}]}, "s06": {"id": "s06", "page": 6, "title": "Two Grades", "place": "Promontory Mountains, Utah Territory - late March 1869", "image": "img/s06.jpg", "paragraphs": ["You land on a hill of gray sagebrush. The wind is cold. Your trip clock says 60 minutes.", "Below you, men are building a grade. A grade is a long, smooth ramp of dirt and rock. Later, the rails will sit on top.", "Many of these workers are Latter-day Saints from towns nearby. In 1868, Brigham Young, the leader of their church, signed a contract to build grade for the Union Pacific. Later, Latter-day Saint builders took jobs for the Central Pacific too. Farmers came with their sons, their mules, and their shovels.", "Then you see something strange. There are two grades, side by side!", "\"Nobody has picked the meeting place yet,\" Dr. Finch says in your ear. \"So both companies keep building. For many miles, their grades run right next to each other.\"", "Up the hill, a man shouts, \"Blast! Stand clear!\" A crew is about to blast rock with black powder."], "choices": [{"label": "Run up to the rock cut", "prompt": "If you run up the hill to watch the blasting, tap 'Run up to the rock cut.'", "target": "e_blast", "hop": false}, {"label": "Go to the Big Fill", "prompt": "If you walk down to the ravine where the crews are filling it in, tap 'Go to the Big Fill.'", "target": "s07", "hop": false}], "on_enter": {"set": {"saw_grades": true}}, "clock": 60}, "s07": {"id": "s07", "page": 7, "title": "The Big Fill", "place": "Spring Creek ravine, Promontory Mountains - late March 1869", "image": "img/s07.jpg", "paragraphs": ["A deep ravine cuts across the path of the railroad. A train can't jump a ravine. So the workers are filling it in.", "Mules pull small dump carts to the edge. Each cart tips. Dirt and rock slide down. Load after load after load. This is the Big Fill. A Latter-day Saint company, Benson, Farr and West, is building it for the Central Pacific.", "Right next to it, the Union Pacific builds a tall wooden bridge called the Big Trestle. It goes up faster.", "Why not just go down one side and up the other? Iron wheels roll easily on iron rails. That's how one engine can pull a long, heavy train. But iron on iron is slippery. On a steep hill, the wheels would spin. So builders cut through hills and fill in low places. They keep the track almost flat.", "An empty dump cart rattles back up. The driver waves at you.", "Your trip clock says 45 minutes."], "choices": [{"label": "Ride the dump cart", "prompt": "If you jump on an empty dump cart for a ride, tap 'Ride the dump cart.'", "target": "e_safety_return", "hop": false, "sets": {"via": "dumpcart"}}, {"label": "Go to Ten-Mile Day", "prompt": "If you jump ahead to April 28, Ten-Mile Day, tap 'Go to Ten-Mile Day.'", "target": "s08", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "Open May 10", "prompt": "If you want to pick a place for May 10, tap 'Open May 10.' (Picking is free.)", "target": "s11", "hop": false}], "clock": 45}, "s08": {"id": "s08", "page": 8, "title": "Ten-Mile Day", "place": "Near Victory camp, Utah Territory - April 28, 1869, 7:15 a.m.", "image": "img/s08.jpg", "paragraphs": ["You land beside a long, flat grade. It's April 28, 1869, a little after seven in the morning. Your trip clock says 60 minutes.", "Charles Crocker runs the Central Pacific's building. He made a bet. His crews will lay ten miles of track in one day. Nobody has ever done that.", "A signal, and they're off!", "Horses pull small iron cars loaded with rails. Eight Irishmen grab each rail with big tongs and set it down. Chinese crews lay the wooden ties. They set the spikes and hammer them in. A good spiker drives a spike in three blows. Bang, bang, bang!", "Right behind them, another crew puts up telegraph poles and hangs the wire.", "At the end of each rail, the men leave a tiny gap. \"Why?\" you ask.", "\"Iron grows a tiny bit when it gets hot,\" Dr. Finch says. \"On a hot day, rails with no gaps would push and bend.\""], "choices": [{"label": "Push the rails together", "prompt": "If you push two rails tight together to close the gap, tap 'Push the rails together.'", "target": "e_safety_return", "hop": false, "sets": {"via": "gap"}}, {"label": "Watch the rail team", "prompt": "If you watch the rail team up close, tap 'Watch the rail team.'", "target": "s09", "hop": false}, {"label": "Follow the telegraph crew", "prompt": "If you follow the crew that hangs the telegraph wire, tap 'Follow the telegraph crew.'", "target": "s09", "hop": false, "sets": {"knows_code": true}}], "clock": 60}, "s09": {"id": "s09", "page": 9, "title": "Iron and Tea", "place": "Ten-Mile Day - about 8:15 a.m.", "image": "img/s09.jpg", "paragraphs": ["The track moves forward about as fast as you walk. Clang! goes a rail. Bang, bang, bang go the hammers.", "Each rail weighs about as much as three grown-ups. Four men lift each end.", "Chinese workers walk along the line with buckets on poles. The buckets hold tea. The tea is made with boiled water, and boiling kills many germs.", "{bonus}", "\"By seven tonight, they'll lay ten miles and fifty-six feet,\" Dr. Finch says. \"That record still stands today.\"", "Your trip clock says 35 minutes. The day is long. Your clock is short."], "choices": [{"label": "Wait for the end", "prompt": "If you wait here to see the end of the day, tap 'Wait for the end.'", "target": "e_time_up", "hop": false, "sets": {"via": "tenmile"}}, {"label": "Jump to sunset", "prompt": "If you jump ahead to 7 o'clock tonight, tap 'Jump to sunset.'", "target": "s10", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "Open May 10", "prompt": "If you want to pick a place for May 10, tap 'Open May 10.' (Picking is free.)", "target": "s11", "hop": false}], "on_enter": {"set": {"ten_mile": true}}, "bonus": [{"if": {"knows_code": true}, "text": "In a wagon office, a telegraph man taps a key. Short clicks are dots. Long clicks are dashes. Dots and dashes spell letters. He shows you a D: dash, dot, dot."}], "clock": 35}, "s10": {"id": "s10", "page": 10, "title": "Ten Miles!", "place": "Ten-Mile Day - 7:00 p.m.", "image": "img/s10.jpg", "paragraphs": ["You land as the sun goes down. Your trip clock says 60 minutes.", "The last spike of the day goes in. Bang, bang, bang. The workers cheer. Ten miles and fifty-six feet!", "The eight rail men can hardly lift their arms. The Chinese crews sit down on the ties. They are dusty and tired and proud.", "A man named Jim Campbell climbs into an engine. He drives it fast over the new track, to show it was laid well. It doesn't wobble.", "\"Now the Central Pacific is only a few miles from Promontory Summit,\" Dr. Finch says. \"The railroad is almost done.\""], "choices": [{"label": "Open May 10", "prompt": "If you want to pick a place for May 10, tap 'Open May 10.' (Picking is free.)", "target": "s11", "hop": false}, {"label": "Look at the wires", "prompt": "If you want to look at the telegraph wires, tap 'Look at the wires.' (Looking is free.)", "target": "s25", "hop": false}], "clock": 60}, "s11": {"id": "s11", "page": 11, "title": "Two Promontories", "place": "The TimeBand screen - May 10, 1869", "image": "img/s11.jpg", "paragraphs": ["Dr. Finch's face pops up on the band's screen. \"May 10, 1869,\" she says. \"Now pick a place and a time.\"", "The map shows the Great Salt Lake. A long, bumpy finger of land points down into the water. That is the Promontory.", "At the very tip, by the water, is Promontory Point.", "Far up in the hills to the north is Promontory Summit. A summit is the top of a climb. The railroad climbs up to it from both sides.", "\"Lots of people mix these up,\" Dr. Finch says. \"Even newspapers did, back in 1869.\"", "The band shows two times for the Summit: sunrise and noon. Remember, you'll only have one hour."], "choices": [{"label": "Promontory Point", "prompt": "If you go to Promontory Point, at the tip of the land by the lake, tap 'Promontory Point.'", "target": "e_wrong_place", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "The Summit at sunrise", "prompt": "If you go to Promontory Summit at sunrise, tap 'The Summit at sunrise.'", "target": "s12", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "The Summit at noon", "prompt": "If you go to Promontory Summit at noon, tap 'The Summit at noon.'", "target": "s13", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}]}, "s12": {"id": "s12", "page": 12, "title": "Sunrise at the Summit", "place": "Promontory Summit - May 10, 1869, sunrise", "image": "img/s12.jpg", "paragraphs": ["You land behind a stack of wooden ties. The air is cold. Your breath makes little clouds.", "Promontory is one muddy street of tents and wooden shacks. A few men sleep on boxes.", "At the end of the track, there's a gap. It's just long enough for two rails. One rail for the Union Pacific. One rail for the Central Pacific. The gap is waiting for today.", "A man climbs a telegraph pole to check the wire.", "Your trip clock says 60 minutes. The ceremony won't start until about noon. That's six hours away."], "choices": [{"label": "Wait for the spike", "prompt": "If you sit by the ties and wait for the spike, tap 'Wait for the spike.'", "target": "e_time_up", "hop": false, "sets": {"via": "morning"}}, {"label": "Jump ahead to noon", "prompt": "If you jump ahead to noon, tap 'Jump ahead to noon.'", "target": "s13", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}], "clock": 60}, "s13": {"id": "s13", "page": 13, "title": "Promontory Summit", "place": "Promontory Summit - May 10, 1869, about noon", "image": "img/s13.jpg", "paragraphs": ["You land behind a wagon. The sun is out, but the wind is cold. Your trip clock says 60 minutes.", "Two engines face each other on the track, with a short gap between them. The Central Pacific's engine, Jupiter, came from the west. Its smokestack is shaped like a big funnel. The Union Pacific's engine, No. 119, came from the east. Its smokestack is tall and straight.", "Hundreds of people are here. Workers. Soldiers. Railroad bosses in tall hats. A few women in long dresses. There are two bands. One is an army band. The other came all the way from Salt Lake City.", "Brigham Young isn't here. He is visiting towns in southern Utah. Bishop John Sharp and Ogden's mayor, Lorin Farr, came in his place.", "Near the gap, a man sets a small table by a telegraph pole. Over by the engines, a man sets up a big wooden camera."], "choices": [{"label": "Go see the engines", "prompt": "If you go see the two engines, tap 'Go see the engines.'", "target": "s14", "hop": false}, {"label": "Go to the last rail", "prompt": "If you go to the gap where the last rails go down, tap 'Go to the last rail.'", "target": "s17", "hop": false}, {"label": "Go to the photographer", "prompt": "If you go to the man with the big camera, tap 'Go to the photographer.'", "target": "s22", "hop": false}, {"label": "Stay at the back", "prompt": "If you stay at the back of the crowd, tap 'Stay at the back.'", "target": "s29", "hop": false}], "clock": 60}, "s14": {"id": "s14", "page": 14, "title": "Two Engines", "place": "Promontory Summit - about 12:10 p.m.", "image": "img/s14.jpg", "paragraphs": ["Up close, the engines are huge. They hiss. They tick. They puff out steam.", "A steam engine works like a giant teakettle. A fire heats water in a big tank called a boiler. The water turns into steam. Steam takes up much more room than water, so it pushes hard. The push moves the pistons, and the pistons turn the wheels.", "Jupiter burns wood. Its big funnel smokestack catches sparks, so they don't start grass fires.", "No. 119 burns coal. Coal packs more heat into a smaller pile than wood.", "George Booth is Jupiter's engineer. Sam Bradford runs No. 119. Their cabs are high up, with little steps.", "Down by Jupiter's big front wheels, little pipes drip and hiss."], "choices": [{"label": "Stand by the front wheels", "prompt": "If you stand by Jupiter's big front wheels to record, tap 'Stand by the front wheels.'", "target": "e_steam", "hop": false}, {"label": "Climb into Jupiter", "prompt": "If you climb up into Jupiter's cab, tap 'Climb into Jupiter.'", "target": "s15", "hop": false}, {"label": "Climb into No. 119", "prompt": "If you climb up into No. 119's cab, tap 'Climb into No. 119.'", "target": "s16", "hop": false}], "clock": 50}, "s15": {"id": "s15", "page": 15, "title": "Jupiter's Cab", "place": "Inside Jupiter's cab - about 12:20 p.m.", "image": "img/s15.jpg", "paragraphs": ["The fireman reaches down and helps you up the steps. \"Just for a look,\" he says. George Booth nods.", "The cab is warm. The fireman opens a small iron door, and you see the fire inside. He tosses in a stick of wood, then another. Behind the cab, the tender is piled high with wood.", "A round gauge shows how hard the steam is pushing. The needle points high.", "Above your head hangs the whistle cord.", "From up here, you can see the gap, the crowd, and the telegraph pole. Your trip clock says 40 minutes."], "choices": [{"label": "Pull the whistle cord", "prompt": "If you pull the whistle cord, tap 'Pull the whistle cord.'", "target": "e_safety_return", "hop": false, "sets": {"via": "whistle"}}, {"label": "Record from the cab", "prompt": "If you rest your arm on the cab window and record from here, tap 'Record from the cab.'", "target": "g_jupiter", "hop": false}, {"label": "Go to the last rail", "prompt": "If you climb down and go to the last rail, tap 'Go to the last rail.'", "target": "s17", "hop": false}], "clock": 40}, "s16": {"id": "s16", "page": 16, "title": "No. 119's Cab", "place": "Inside No. 119's cab - about 12:20 p.m.", "image": "img/s16.jpg", "paragraphs": ["The fireman of No. 119 helps you up. Sam Bradford tips his hat.", "Clang! The fireman opens the firebox door and shovels in coal. The fire roars and glows orange. Behind the cab, the tender is full of black coal.", "No. 119 wasn't supposed to be here. A flood in Weber Canyon hurt a bridge, and the first engine couldn't cross. So No. 119 came from Ogden to the rescue.", "A lump of coal sits on the floor by your boot.", "Your trip clock says 40 minutes."], "choices": [{"label": "Throw in some coal", "prompt": "If you throw a lump of coal into the fire, tap 'Throw in some coal.'", "target": "e_safety_return", "hop": false, "sets": {"via": "coal"}}, {"label": "Record from the cab", "prompt": "If you hold still in the cab and record from here, tap 'Record from the cab.'", "target": "g_119", "hop": false}, {"label": "Go to the photographer", "prompt": "If you climb down and go to the photographer, tap 'Go to the photographer.'", "target": "s22", "hop": false}], "clock": 40}, "s17": {"id": "s17", "page": 17, "title": "The Last Rail", "place": "At the gap - about 12:20 p.m.", "image": "img/s17.jpg", "paragraphs": ["Two crews carry the last two rails. A Union Pacific crew of Irish workers brings one. A Central Pacific crew of Chinese workers, in clean blue shirts, brings the other. Down go the rails.", "Under them is a special tie. It's made of shiny laurel wood, with a silver plate on top. Holes are already drilled in it.", "Now the golden spike comes out. Gold is soft. A hard hit with a hammer would bend it. So the special spikes just drop into the holes and get a little tap. Then they come back out, and a plain iron spike does the real job.", "That iron spike has a wire on it. So does the hammer. Both wires go to the telegraph.", "The golden spike shines on the tie. Nobody is watching it right now.", "Your trip clock says 35 minutes."], "choices": [{"label": "Touch the golden spike", "prompt": "If you reach out and touch the golden spike, tap 'Touch the golden spike.'", "target": "e_safety_return", "hop": false, "sets": {"via": "spike"}}, {"label": "Stand with the Chinese crew", "prompt": "If you saw Ten-Mile Day, you may know some of these workers. Stand with the Chinese crew. Tap 'Stand with the Chinese crew.'", "target": "s18", "hop": false, "requires": {"ten_mile": true}}, {"label": "Stand with the Irish crew", "prompt": "If you stand with the Union Pacific's Irish crew, tap 'Stand with the Irish crew.'", "target": "s19", "hop": false}, {"label": "Go to the telegraph table", "prompt": "If you go to the telegraph table, tap 'Go to the telegraph table.'", "target": "s20", "hop": false}], "clock": 35}, "s18": {"id": "s18", "page": 18, "title": "The Chinese Crew", "place": "Beside the last rail", "image": "img/s18.jpg", "paragraphs": ["You stand with the Chinese crew. Their boss is H. H. Minkler. They came this morning from their camp at Victory.", "Some of them may be the same men you saw on Ten-Mile Day.", "Thousands of Chinese workers built the Central Pacific. They cut through the Sierra Nevada mountains. They worked in deep snow and in desert heat.", "Today, the speeches will thank the bosses. Most of the photos will show the bosses too.", "A worker next to you smiles and tips his hat.", "Your trip clock says 30 minutes."], "choices": [{"label": "Record with the crew", "prompt": "If you stand still with the crew and record, tap 'Record with the crew.'", "target": "g_crew", "hop": false}, {"label": "Go to the telegraph table", "prompt": "If you go to the telegraph table, tap 'Go to the telegraph table.'", "target": "s20", "hop": false}], "clock": 30}, "s19": {"id": "s19", "page": 19, "title": "The Irish Crew", "place": "Beside the last rail", "image": "img/s19.jpg", "paragraphs": ["The Union Pacific crew stands with mauls on their shoulders. A maul is a heavy hammer for driving spikes. Many of these men were born in Ireland. Their foreman is named Guilford.", "They laid track all the way from Nebraska.", "\"Hold it at the end of the handle,\" a worker tells a boy. \"A long handle makes the head move fast. A fast, heavy head hits hard.\"", "A spare maul leans against a pile of ties.", "Your trip clock says 30 minutes."], "choices": [{"label": "Swing the spare maul", "prompt": "If you pick up the spare maul and swing it, tap 'Swing the spare maul.'", "target": "e_safety_return", "hop": false, "sets": {"via": "maul"}}, {"label": "Record with the crew", "prompt": "If you stand still with the crew and record, tap 'Record with the crew.'", "target": "g_irish", "hop": false}], "clock": 30}, "s20": {"id": "s20", "page": 20, "title": "The Telegraph Table", "place": "By the telegraph pole - about 12:27 p.m.", "image": "img/s20.jpg", "paragraphs": ["A telegraph man sits at the little table. His name is W. N. Shilling. In front of him is the telegraph key, a small metal lever.", "When he presses the key, electricity flows down the wire. When he lets go, it stops. Electricity in a wire is so fast that the clicks reach the other end almost at once. Omaha. Chicago. Washington. New York. San Francisco. They're all listening right now.", "Click, click-clack. Shilling taps: \"Almost ready. Hats off. Prayer is being offered.\"", "All around you, men take off their hats.", "{bonus}", "Your trip clock says 25 minutes."], "choices": [{"label": "Tap the key", "prompt": "If you reach over and tap the telegraph key, tap 'Tap the key.'", "target": "e_safety_return", "hop": false, "sets": {"via": "key"}}, {"label": "Listen for the code", "prompt": "If you learned the dot-dash code, stay close and listen. Tap 'Listen for the code.'", "target": "s21", "hop": false, "requires": {"knows_code": true}}, {"label": "Look at the wires", "prompt": "If you want to hear the news arrive somewhere far away, tap 'Look at the wires.' (Looking is free.)", "target": "s25", "hop": false}], "bonus": [{"if": {"knows_code": true}, "text": "You know this code! Short clicks are dots. Long clicks are dashes. You listen for every letter."}], "clock": 25}, "s21": {"id": "s21", "page": 21, "title": "Hats Off", "place": "By the telegraph table - about 12:45 p.m.", "image": "img/s21.jpg", "paragraphs": ["{variant}", "Reverend John Todd prays. It's very quiet. Then come speeches, and the special spikes.", "Shilling taps: \"We have got done praying. The spike is about to be presented.\"", "Then: \"All ready now. The spike will soon be driven. The signal will be three dots for the start of the blows.\"", "Leland Stanford, the head of the Central Pacific, picks up the hammer. It has a wire on it too. Everyone leans in.", "Your finger is on the red button. Your trip clock says 15 minutes."], "choices": [{"label": "Record the clicks", "prompt": "If you press record and hold the band near the key, tap 'Record the clicks.'", "target": "g_telegraph", "hop": false}, {"label": "Climb on the table", "prompt": "If you climb on the table to see better, tap 'Climb on the table.'", "target": "e_safety_return", "hop": false, "sets": {"via": "table"}}, {"label": "Jump to Washington", "prompt": "If you jump to Washington, D.C., to hear the same clicks arrive there, tap 'Jump to Washington.'", "target": "s28", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}], "variants": {"squeeze": "\"Excuse me. Excuse me.\" You squeeze between coats until you're right by the telegraph table.", "_default": ""}, "clock": 15}, "s22": {"id": "s22", "page": 22, "title": "The Photographer", "place": "Near the engines - about 12:15 p.m.", "image": "img/s22.jpg", "paragraphs": ["A man stands by a big wooden box on three legs. It's a camera. His name is Andrew J. Russell. He takes pictures for the Union Pacific.", "Next to him is a wagon with a dark tent. That's where he gets his glass plates ready. Each picture goes onto a sheet of glass.", "His camera needs lots of light. To take one picture, the lens has to stay open for a few seconds. Anything that moves turns into a blur. So everyone in the picture must hold very still.", "\"After the spike,\" he tells a helper, \"the engines come together. That's my picture.\"", "Another photographer works nearby. He's from Salt Lake City.", "Your trip clock says 45 minutes."], "choices": [{"label": "Run in front and wave", "prompt": "If you run in front of the camera and wave, tap 'Run in front and wave.'", "target": "e_in_photo", "hop": false}, {"label": "Stand behind the camera", "prompt": "If you stand behind the camera and record, tap 'Stand behind the camera.'", "target": "g_camera", "hop": false}, {"label": "Meet the other photographer", "prompt": "If you meet the photographer from Salt Lake City, tap 'Meet the other photographer.'", "target": "s23", "hop": false}], "clock": 45}, "s23": {"id": "s23", "page": 23, "title": "Charles Savage", "place": "Near the tracks", "image": "img/s23.jpg", "paragraphs": ["The other photographer is Charles R. Savage. He came from England, and he has a picture studio in Salt Lake City. He's a Latter-day Saint.", "His glass plates sit in a wooden box. Glass is hard, but it doesn't bend. Drop it, and it breaks.", "\"People in Salt Lake City are waiting for the news,\" he says. \"The telegraph will bring it to them in a blink.\"", "Your trip clock says 40 minutes."], "choices": [{"label": "Carry his glass plates", "prompt": "If you offer to carry his box of glass plates, tap 'Carry his glass plates.'", "target": "e_safety_return", "hop": false, "sets": {"via": "plate"}}, {"label": "Go to Salt Lake City", "prompt": "If you jump to Salt Lake City to hear the news arrive there, tap 'Go to Salt Lake City.'", "target": "s26", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}], "clock": 40}, "s24": {"id": "s24", "page": 24, "title": "The Tenth Ward Band", "place": "Near the crowd", "image": "img/s24.jpg", "paragraphs": ["Brass horns flash in the sun. This is the Tenth Ward Band from Salt Lake City. A ward is a Latter-day Saint congregation, like a church family in one neighborhood. Their uniforms are bright.", "A horn is a long metal tube, curled up. The player buzzes their lips into it. The air inside shakes, and that shaking is the sound. A longer tube makes a lower note.", "{bonus}", "The drummer sets his drum down for a moment. The sticks lie on top.", "Your trip clock says 25 minutes."], "choices": [{"label": "Play the drum", "prompt": "If you pick up the sticks and play the drum, tap 'Play the drum.'", "target": "e_safety_return", "hop": false, "sets": {"via": "drum"}}, {"label": "Record with the band", "prompt": "If you stand by the band and record, tap 'Record with the band.'", "target": "g_band", "hop": false}, {"label": "Go to Salt Lake City", "prompt": "If you jump to Salt Lake City, where the band came from, tap 'Go to Salt Lake City.'", "target": "s26", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}], "bonus": [{"if": {"saw_grades": true}, "text": "You think of the grade crews you saw in March. Some of these players may have brothers who built that grade."}], "clock": 25}, "s25": {"id": "s25", "page": 25, "title": "The Wire Map", "place": "The TimeBand screen", "image": "img/s25.jpg", "paragraphs": ["Dr. Finch shows a new map. Thin lines spread across the country like a spider web. They're telegraph wires.", "\"When the spike goes in, the clicks race down these wires,\" she says. \"Electricity is so fast that the whole country hears it at almost the same moment.\"", "\"Want to know the code?\" she asks. \"D is dash, dot, dot. O is dot, dot, with a little space between. N is dash, dot. E is just one dot. That spells DONE.\"", "\"Now, a puzzle. In 1869, every town sets its clocks by its own sun. The sun reaches the East first. So when it's 12:47 in Utah, the clocks in Washington say 2:47.\"", "\"Railroads will fix that someday,\" she says. \"In 1883, they'll make time zones.\"", "Where do you want to listen?"], "choices": [{"label": "Salt Lake City", "prompt": "If you go to Salt Lake City, about 90 miles from Promontory, tap 'Salt Lake City.'", "target": "s26", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "Washington at 12:47", "prompt": "If you go to Washington when its clocks say 12:47, tap 'Washington at 12:47.'", "target": "e_too_early", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "Washington at 2:47", "prompt": "If you go to Washington when its clocks say 2:47, tap 'Washington at 2:47.'", "target": "s28", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}], "on_enter": {"set": {"knows_code": true}}}, "s26": {"id": "s26", "page": 26, "title": "Salt Lake City", "place": "Salt Lake City, Utah Territory - May 10, 1869, just after noon", "image": "img/s26.jpg", "paragraphs": ["You land on a wide dirt street. Tall mountains stand behind the city, with snow on top. Your trip clock says 60 minutes.", "Flags hang from windows. Brass bands wait on the corners. On Arsenal Hill, men stand ready by cannons.", "Salt Lake City has no railroad yet. The new tracks run through Ogden, about forty miles north. \"People here will build their own railroad to Ogden,\" Dr. Finch says. \"They'll finish it in January.\"", "{bonus}", "Not far away is the big new Tabernacle. Its round roof looks like the back of a turtle.", "Everyone is waiting for the telegraph signal."], "choices": [{"label": "Wait for the signal", "prompt": "If you wait on the street for the signal, tap 'Wait for the signal.'", "target": "g_salt_lake", "hop": false}, {"label": "Find the handcart pioneers", "prompt": "If you walked with the handcart company, look for people who walked here too. Tap 'Find the handcart pioneers.'", "target": "s27", "hop": false, "requires": {"walked_trail": true}}, {"label": "Go to the telegraph office", "prompt": "If you go to the telegraph office, tap 'Go to the telegraph office.'", "target": "s30", "hop": false}], "bonus": [{"if": {"saw_grades": true}, "text": "Many families here helped build the grade. Now they wait to hear that the railroad is done."}], "clock": 60}, "s27": {"id": "s27", "page": 27, "title": "People Who Walked", "place": "A street corner in Salt Lake City", "image": "img/s27.jpg", "paragraphs": ["You think of the trail, and Annie, and the squeaky wheel. You look around the crowd.", "An old woman leans on a cane. \"I pulled a handcart across the plains,\" she tells her grandson. \"It took us all summer. Now people will come here by train in a few days.\"", "Is Annie here somewhere? She'd be seventeen now. You can't tell.", "Many people in this crowd walked here, or came by wagon. They know how long that road is.", "Your trip clock says 50 minutes."], "choices": [{"label": "Tell her you walked too", "prompt": "If you tell her you walked with a handcart company too, tap 'Tell her you walked too.'", "target": "e_safety_return", "hop": false, "sets": {"via": "tell"}}, {"label": "Record with the crowd", "prompt": "If you stand by her and record, tap 'Record with the crowd.'", "target": "g_salt_lake", "hop": false, "sets": {"via": "handcart"}}], "clock": 50}, "s28": {"id": "s28", "page": 28, "title": "Washington, D.C.", "place": "Western Union office, Washington, D.C. - 2:40 p.m. (Washington clocks)", "image": "img/s28.jpg", "paragraphs": ["You land in a busy telegraph office on a city corner in Washington, D.C. The clock on the wall says 2:40. Your trip clock says 60 minutes.", "People crowd around the counter. The manager, Mr. Tinker, has hooked up a bell to the wire. Every click from Utah will ring it.", "Ding, ding-ding. The clerk reads out the message: \"We have got done praying. The spike is about to be presented.\"", "Chicago answers on the wire: \"We understand. All are ready in the East.\"", "The room is so quiet you can hear the wall clock tick.", "The little bell sits on the counter, right by your hand."], "choices": [{"label": "Ring the bell yourself", "prompt": "If you ring the bell yourself to hurry things up, tap 'Ring the bell yourself.'", "target": "e_safety_return", "hop": false, "sets": {"via": "bell"}}, {"label": "Record the bell", "prompt": "If you hold still by the bell and record, tap 'Record the bell.'", "target": "g_washington", "hop": false}], "clock": 60}, "s29": {"id": "s29", "page": 29, "title": "The Back of the Crowd", "place": "Promontory Summit - about 12:30 p.m.", "image": "img/s29.jpg", "paragraphs": ["You stand behind the crowd. All you can see are coats and hats. Lots of hats.", "Sound spreads out as it travels. The farther away you are, the quieter it gets. Back here, the wind blows the speeches away.", "Up on the hill, you could see everything. But the hill is far.", "Over by the engines, a band starts to warm up.", "Your trip clock says 40 minutes."], "choices": [{"label": "Climb the hill", "prompt": "If you climb the hill to see everything from far away, tap 'Climb the hill.'", "target": "e_too_far", "hop": false}, {"label": "Squeeze to the front", "prompt": "If you say 'excuse me' and squeeze to the front by the telegraph table, tap 'Squeeze to the front.'", "target": "s21", "hop": false, "sets": {"via": "squeeze"}}, {"label": "Follow the music", "prompt": "If you follow the sound of the band, tap 'Follow the music.'", "target": "s24", "hop": false}], "clock": 40}, "s30": {"id": "s30", "page": 30, "title": "The Telegraph Office", "place": "Telegraph office, Salt Lake City", "image": "img/s30.jpg", "paragraphs": ["The telegraph office is a small room with a counter and a few desks. Keys click and clack.", "At one desk sits a young woman. She's a telegraph operator. In Utah, lots of young women learned to send and read the code. They run telegraph offices in towns all over the territory, on a line called the Deseret Telegraph. Latter-day Saints built it.", "{bonus}", "She leans close to the sounder and listens. Her pencil is ready.", "Your trip clock says 55 minutes."], "choices": [{"label": "Tap the key", "prompt": "If you tap the telegraph key while she listens, tap 'Tap the key.'", "target": "e_safety_return", "hop": false, "sets": {"via": "key2"}}, {"label": "Record with her", "prompt": "If you stand quietly by her desk and record, tap 'Record with her.'", "target": "g_deseret", "hop": false}], "bonus": [{"if": {"knows_code": true}, "text": "You know the code. You get ready to read along."}], "clock": 55}}, "endings": {"g_telegraph": {"id": "g_telegraph", "page": 31, "type": "GOOD", "title": "D-O-N-E", "image": "img/g_telegraph.jpg", "paragraphs": ["You press the red button. You hold the band still, the way you did with the bee.", "Leland Stanford swings the hammer. He misses the spike and hits the tie! Thomas Durant of the Union Pacific swings next. He misses too. People laugh.", "Shilling doesn't wait. He taps the three dots. Then a railroad worker steps up and drives the iron spike in. Clang, clang, clang!", "Shilling's finger moves. Dash, dot, dot. Dot, dot. Dash, dot. Dot.", "D. O. N. E. DONE! It's 12:47.", "The crowd roars. Hats fly. The engines whistle. All across the country, people hear the clicks at the same moment.", "{bonus}", "The band beeps twice and brings you home. Dr. Finch listens to the clicks and the cheers. \"That's the sound of a whole country, joined together,\" she says."], "bonus": [{"if": {"knows_code": true}, "text": "You read every letter yourself, as the clicks came."}, {"if": {"walked_trail": true}, "text": "You think of Annie and the squeaky wheel. Now families can ride to Utah in days."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "W. N. Shilling sent the word DONE at 12:47 p.m. on May 10, 1869. Leland Stanford and Thomas Durant both missed with their swings. The telegraph sent the news across the country in moments.", "photos": [{"src": "img/photos/russell_last_rail.jpg", "id": "russell_last_rail", "caption": "The crowd at the last rail. On the right, a man has climbed the telegraph pole.", "credit": "Andrew J. Russell. No restrictions. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Last_Rail_-_Promontory_Point._(8706011188).jpg"}, {"src": "img/photos/golden_spike.jpg", "id": "golden_spike", "caption": "The golden spike. Today it is at the Cantor Arts Center at Stanford University. (Photo from 2012.)", "credit": "Photo: Wjenning, 2012. CC BY-SA 3.0. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:The-Golden-Spike-7Oct2012.jpg"}]}}, "g_jupiter": {"id": "g_jupiter", "page": 32, "type": "GOOD", "title": "From Jupiter's Cab", "image": "img/g_jupiter.jpg", "paragraphs": ["You rest your arm on the cab window and press the red button. The band holds still.", "From up here, you see the hammer swing. A miss! Then a railroad worker drives the iron spike. Bang, bang, bang. The telegraph sends DONE.", "The crowd cheers. George Booth reaches up and pulls the whistle cord. Whoo-ooo! Across the gap, No. 119 whistles back.", "Then the two engines roll forward, slowly, slowly, until their noses almost touch. George Booth and Sam Bradford each break a bottle on the other's engine, the way people do when a new ship sets sail.", "{bonus}", "The band beeps twice. It has the whistles, the hiss of steam, and the cheers. You hold on tight as it brings you home."], "bonus": [{"if": {"walked_trail": true}, "text": "You think of the handcarts. These wheels go much faster."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "Jupiter was a wood-burning engine with a big funnel smokestack. Its engineer was George Booth. After the spike, Jupiter and No. 119 rolled forward until they nearly touched.", "photos": [{"src": "img/photos/russell_workmen.jpg", "id": "russell_workmen", "caption": "Jupiter at Promontory, with its name on the side. People line the track.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:69workmen.jpg"}, {"src": "img/photos/russell_east_west.jpg", "id": "russell_east_west", "caption": "Jupiter on the left, No. 119 on the right, nose to nose.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:East_and_West_Shaking_hands_at_the_laying_of_last_rail_Union_Pacific_Railroad_-_Restoration.jpg"}]}}, "g_119": {"id": "g_119", "page": 33, "type": "GOOD", "title": "From No. 119's Cab", "image": "img/g_119.jpg", "paragraphs": ["You stand still in the warm cab and press the red button.", "Through the front window, you see the hammer swing and miss. Then a worker drives the spike home. DONE! The crowd roars. Sam Bradford pulls the whistle. Whoo-whoo! Jupiter whistles back.", "The engines creep forward until they almost touch. People climb all over them.", "Later, Jupiter backs up. Sam Bradford opens the throttle, and No. 119 rolls slowly across the spot where the rails meet. It's the first engine to cross! Then Jupiter crosses too.", "{bonus}", "You feel the rumble through your boots. The band beeps twice and brings you home.", "\"A train from the East, on the rails of the West,\" Dr. Finch says. \"You were riding it.\""], "bonus": [{"if": {"walked_trail": true}, "text": "You think of the handcarts, and their squeaky wheels. These wheels roll on iron."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "No. 119 was a coal-burning Union Pacific engine with a tall, straight smokestack. Its engineer was Sam Bradford. It came to Promontory only because a flood had hurt a bridge.", "photos": [{"src": "img/photos/russell_east_west.jpg", "id": "russell_east_west", "caption": "No. 119 is on the right, with the tall, straight smokestack.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:East_and_West_Shaking_hands_at_the_laying_of_last_rail_Union_Pacific_Railroad_-_Restoration.jpg"}, {"src": "img/photos/russell_up_officers.jpg", "id": "russell_up_officers", "caption": "Union Pacific men at the last rail.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Laying_the_last_rail_at_Promontory_Summit_1869.jpg"}]}}, "g_crew": {"id": "g_crew", "page": 34, "type": "GOOD", "title": "The Crew Who Laid It", "image": "img/g_crew.jpg", "paragraphs": ["You press the red button beside the crew and hold still.", "The hammer swings and misses. A worker drives the spike. DONE! The Chinese crew cheers with everyone else. They built this.", "After the ceremony, the crew lifts out the laurel tie. They put in a plain pine tie with plain iron spikes. Souvenir hunters cut that tie to bits. The crew saws the pieces small and hands them out.", "Then J. H. Strobridge, the Central Pacific's building boss, invites the crew to eat in his railroad car. When they walk in, all the guests cheer for them.", "{bonus}", "The band beeps twice. It brings you home with their cheers saved.", "\"Almost none of them are in the famous photo,\" Dr. Finch says quietly. \"But now the museum can hear them.\""], "bonus": [{"if": {"ten_mile": true}, "text": "Some of these men laid ten miles of track in one day. You saw it."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "Thousands of Chinese workers built the Central Pacific. A Chinese crew laid the last Central Pacific rail on May 10, 1869. They were almost left out of the famous photo.", "photos": [{"src": "img/photos/russell_chinese_detail.jpg", "id": "russell_chinese_detail", "caption": "A close-up of the famous photo. Two Chinese workers stand in the crowd.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Two_Chinese_Railroad_Workers_at_Golden_Spike_Ceremony.jpg"}, {"src": "img/photos/hill_last_spike.jpg", "id": "hill_last_spike", "caption": "A painting of the last spike, made twelve years later by Thomas Hill.", "credit": "Thomas Hill (painting, 1881). Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:The_Last_Spike_1869.jpg"}]}}, "g_irish": {"id": "g_irish", "page": 35, "type": "GOOD", "title": "Mauls Up!", "image": "img/g_irish.jpg", "paragraphs": ["You stand still with the crew and press the red button.", "The hammer swings. A miss! The crew laughs. They can drive a spike in three blows. Then a worker drives it, bang, bang, bang. DONE!", "Up go the mauls. Up go the hats. The crew yells and cheers.", "These men laid the Union Pacific's track for 1,086 miles, all the way from Omaha. The Central Pacific built 690 miles from Sacramento. Now it's one railroad.", "{bonus}", "The band beeps twice and brings you home. Dr. Finch laughs at the shouting. \"That's what joy sounds like,\" she says."], "bonus": [{"if": {"ten_mile": true}, "text": "You think of the eight Irish rail men on Ten-Mile Day. They worked for the other company, but they'd cheer too."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "The Union Pacific laid 1,086 miles of track from Omaha. Many of its track workers were Irish. The Central Pacific laid 690 miles from Sacramento.", "photos": [{"src": "img/photos/russell_casement.jpg", "id": "russell_casement", "caption": "A Union Pacific track crew and its work train, about 1868.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Captain_Andrew_Joseph_Russell_-_General_John_S._Casement_and_His_Outfit_-_Google_Art_Project.jpg"}, {"src": "img/photos/russell_last_rail.jpg", "id": "russell_last_rail", "caption": "The crowd at the last rail, May 10, 1869.", "credit": "Andrew J. Russell. No restrictions. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Last_Rail_-_Promontory_Point._(8706011188).jpg"}]}}, "g_camera": {"id": "g_camera", "page": 36, "type": "GOOD", "title": "Hold Still!", "image": "img/g_camera.jpg", "paragraphs": ["You stand behind the camera and press the red button.", "The spike goes in, and DONE goes out on the wire. The crowd cheers. Then the two engines roll forward until their noses almost touch. People climb up on them and wave.", "Two chief engineers step into the middle. Samuel Montague of the Central Pacific. Grenville Dodge of the Union Pacific. They shake hands.", "\"Hold still!\" calls Mr. Russell. He takes the cap off the lens. Everyone freezes. One, two, three. He puts the cap back on.", "That's the picture. It will be called \"East and West Shaking Hands at Laying Last Rail.\" People still look at it today.", "{bonus}", "The band beeps twice and takes you home. You recorded the moment the most famous picture of the railroad was made."], "bonus": [{"if": {"ten_mile": true}, "text": "Look closely at that photo someday. You can find two Chinese workers in it, but only two."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "Andrew J. Russell took this photo after the last spike. It shows the chief engineers, Samuel Montague and Grenville Dodge, shaking hands between the two engines.", "photos": [{"src": "img/photos/russell_east_west.jpg", "id": "russell_east_west", "caption": "\"East and West Shaking Hands at Laying Last Rail,\" by Andrew J. Russell.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:East_and_West_Shaking_hands_at_the_laying_of_last_rail_Union_Pacific_Railroad_-_Restoration.jpg"}, {"src": "img/photos/russell_photographer.jpg", "id": "russell_photographer", "caption": "Andrew J. Russell, the photographer.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Andrew_russell_photographer.jpg"}]}}, "g_band": {"id": "g_band", "page": 37, "type": "GOOD", "title": "Music at Promontory", "image": "img/g_band.jpg", "paragraphs": ["You stand beside the band and press the red button.", "The hammer swings. A miss! Then a worker drives the spike. DONE! The crowd cheers, and the band plays.", "The horns shine. The big drum booms. You can feel it in your chest. That's sound, shaking the air, and the air shaking you.", "{bonus}", "The band beeps twice. It has the cheers, the whistles, and the music. Then it takes you home.", "\"A band from Salt Lake City, at the meeting of the rails,\" Dr. Finch says. \"Lots of people from Utah helped make this day.\""], "bonus": [{"if": {"saw_grades": true}, "text": "You think of the grade crews in March. Some of their families are in this band."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "Two bands played at Promontory: an army band, and the Tenth Ward Band from Salt Lake City. Charles R. Savage, a photographer from Salt Lake City, took pictures too.", "photos": [{"src": "img/photos/savage_promontory.jpg", "id": "savage_promontory", "caption": "The crowd at the last rail, by Charles R. Savage, May 10, 1869.", "credit": "Charles R. Savage. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Promontory_Utah_10_May_1869.jpg"}, {"src": "img/photos/russell_east_west.jpg", "id": "russell_east_west", "caption": "The two engines meet.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:East_and_West_Shaking_hands_at_the_laying_of_last_rail_Union_Pacific_Railroad_-_Restoration.jpg"}]}}, "g_salt_lake": {"id": "g_salt_lake", "page": 38, "type": "GOOD", "title": "Salt Lake City Hears", "image": "img/g_salt_lake.jpg", "paragraphs": ["You press the red button and wait.", "Then the news comes down the telegraph wire. The railroad is done!", "Flags go up. The bands play. On Arsenal Hill, a cannon fires. You see the puff of smoke first. Then, a moment later, BOOM. Light is faster than sound.", "Stores close. People hug and cheer in the street. This afternoon, six or seven thousand people will fill the new Tabernacle to celebrate.", "{variant}", "{bonus}", "The band beeps twice and brings you home.", "\"Eight months from now, people here will finish their own railroad to Ogden,\" Dr. Finch says. \"Brigham Young will drive its last spike. It will be made of Utah iron.\""], "variants": {"handcart": "The old woman who pulled a handcart wipes her eyes. \"In a few days,\" she says. \"Not a whole summer.\"", "_default": "A man next to you says his family came by wagon. It took them months. \"Now it will take days,\" he says."}, "bonus": [{"if": {"walked_trail": true}, "text": "You think of Annie, walking all day for bread and butter. Kids like her will ride the train now."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "On May 10, 1869, Salt Lake City celebrated with flags, bands, and cannons, and thousands gathered in the new Tabernacle. On January 10, 1870, the Utah Central Railroad reached the city, and Brigham Young drove its last spike.", "photos": [{"src": "img/photos/savage_tabernacle.jpg", "id": "savage_tabernacle", "caption": "The new Tabernacle in Salt Lake City, about 1867. Photo by Charles R. Savage.", "credit": "Charles R. Savage. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Mormon_Tabernacle_Salt_Lake_City,_C.R._Savage..jpg"}, {"src": "img/photos/handcart_train_1903.jpg", "id": "handcart_train_1903", "caption": "A drawing of a handcart company, from a book printed in 1903.", "credit": "History of Iowa, B. F. Gue (1903). Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Mormon_Hand-Cart_Train_-_History_of_Iowa.jpg"}, {"src": "img/photos/emigrant_train_echo.jpg", "id": "emigrant_train_echo", "caption": "Pioneers' wagons in Echo Canyon, Utah, about 1870.", "credit": "Charles W. Carter, about 1870. CC0. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Mormon_Emigrant_Train,_Echo_Canyon_MET_DP259468.jpg"}]}}, "g_deseret": {"id": "g_deseret", "page": 39, "type": "GOOD", "title": "The Operator", "image": "img/g_deseret.jpg", "paragraphs": ["You stand quietly by the desk and press the red button.", "The sounder clicks. The operator's pencil moves. Dash, dot, dot. Dot, dot. Dash, dot. Dot.", "She writes four letters on her paper: D O N E.", "She jumps up. \"It's done! The railroad is done!\" Everyone in the office cheers. Outside, a cannon booms.", "{bonus}", "Right away, she starts sending the news down the Deseret Telegraph to towns all over Utah. Click, click-clack.", "The band beeps twice and brings you home. \"She heard it at the same moment as Washington and New York,\" Dr. Finch says. \"That's the telegraph.\""], "bonus": [{"if": {"knows_code": true}, "text": "You read along with her pencil, letter by letter."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "Latter-day Saints built the Deseret Telegraph in Utah in the 1860s, and many young women worked as its operators. Latter-day Saint crews also built much of the railroad grade in northern Utah.", "photos": [{"src": "img/photos/russell_trestle.jpg", "id": "russell_trestle", "caption": "The Big Trestle near Promontory, built by Latter-day Saint contractors for the Union Pacific.", "credit": "Andrew J. Russell. No restrictions. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Trestle_Work_at_Prominitory_(sic)_Pt._(8706010162).jpg"}, {"src": "img/photos/savage_self.jpg", "id": "savage_self", "caption": "Charles R. Savage, the Salt Lake City photographer, later in his life.", "credit": "Charles R. Savage. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Charles_Roscoe_Savage_self-portrait.jpg"}]}}, "g_washington": {"id": "g_washington", "page": 40, "type": "GOOD", "title": "Washington Hears", "image": "img/g_washington.jpg", "paragraphs": ["You hold still by the bell and press the red button.", "Ding. Ding. Ding. Three dots: the hammer is starting!", "Then the bell taps again and again, for the blows of the hammer, more than two thousand miles away. Everyone in the room holds their breath.", "At 2:47 by the Washington clock, the bell taps out four letters. D-O-N-E. DONE!", "People cheer and shake hands. At an army office nearby, General Sherman hears the same bell. In New York, cannons fire one hundred times, and church bells ring.", "{bonus}", "The band beeps twice and brings you home. \"Utah to Washington, in a blink,\" Dr. Finch says. \"Electricity is fast.\""], "bonus": [{"if": {"knows_code": true}, "text": "You can read the bell taps yourself. Dash, dot, dot."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "In Washington, D.C., a bell in the Western Union office rang with each signal from Promontory. The word DONE arrived at 2:47 p.m., Washington time.", "photos": [{"src": "img/photos/russell_east_west.jpg", "id": "russell_east_west", "caption": "Promontory Summit, May 10, 1869.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:East_and_West_Shaking_hands_at_the_laying_of_last_rail_Union_Pacific_Railroad_-_Restoration.jpg"}, {"src": "img/photos/golden_spike.jpg", "id": "golden_spike", "caption": "The golden spike, now at Stanford University. (Photo from 2012.)", "credit": "Photo: Wjenning, 2012. CC BY-SA 3.0. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:The-Golden-Spike-7Oct2012.jpg"}]}}, "e_safety_return": {"id": "e_safety_return", "page": 41, "type": "BAD", "title": "Safety Return", "image": "img/e_safety_return.jpg", "paragraphs": ["The band buzzes three times. Then everything goes white.", "You're back in the kitchen. The light on the band is amber now. It's locked for the day.", "{variant}", "Dr. Finch kneels beside you. \"You're safe,\" she says. \"And history is safe too. That's what the safety rule is for.\"", "There's no recording this time.", "What could you try differently? Watch, and keep your hands still. The band can only record a moment you leave just as it was."], "variants": {"cart": "You climbed into a handcart. Every pound mattered on that long walk. Someone would have had to pull you.", "wheel": "You picked up the hammer. That man was fixing his own family's cart. It had to be his work.", "dumpcart": "You jumped on a dump cart. Each cart had its driver and its mules, and its own job to do.", "gap": "You pushed the rails together. Those gaps had to be there, or the rails would bend in the heat.", "whistle": "You pulled the whistle. Everyone would have thought the spike was in!", "coal": "You threw coal on the fire. The fireman keeps the fire just right. Too much, and the steam pushes too hard.", "spike": "You touched the golden spike. It was going into the laurel tie, right then, in front of everyone.", "maul": "You swung the maul. A railroad maul is heavy, and the crew needed every one.", "key": "You tapped the telegraph key. The whole country was listening for Shilling's clicks, not yours.", "key2": "You tapped the key. The operator was listening for clicks from Promontory.", "table": "You climbed on the table. The telegraph wire runs right across it.", "plate": "You picked up the glass plates. One slip, and a famous photo would be broken.", "drum": "You hit the drum. The band was waiting for its leader's signal.", "tell": "You told her about the trail. But you're a girl from the future. That would change her story.", "bell": "You rang the bell. Everyone would have thought the spike was in!", "_default": "You tried to change what really happened."}}, "e_out_of_charges": {"id": "e_out_of_charges", "page": 42, "type": "BAD", "title": "Out of Charges", "image": "img/e_out_of_charges.jpg", "paragraphs": ["You press the band. Nothing happens. All three dots are dark.", "Then a small light blinks: backup power. The band hums and brings you home.", "\"Every trip used a charge,\" Dr. Finch says. \"And now they're all gone, before we got the recording.\"", "She plugs the band in. It will take a whole day to charge.", "What could you try differently? Every trip used a charge. Which trips mattered most for the mission?"]}, "e_in_photo": {"id": "e_in_photo", "page": 43, "type": "BAD", "title": "In the Picture", "image": "img/e_in_photo.jpg", "paragraphs": ["You run out in front of the big camera and wave. Hi!", "The band buzzes three times, and everything goes white.", "Back home, Dr. Finch shakes her head and smiles. \"That camera stays open for a few seconds,\" she says. \"You would have been a little blur in a famous photo. A girl who was never there. People would wonder about her for a hundred and fifty years!\"", "There's no recording this time.", "What could you try differently? Where could you stand to watch the picture being made, without being in it?"]}, "e_wrong_day": {"id": "e_wrong_day", "page": 44, "type": "BAD", "title": "The Wrong Day", "image": "img/e_wrong_day.jpg", "paragraphs": ["You land at Promontory Summit on May 8, 1869. The golden spike says May 8. But nothing is happening.", "There's still a gap in the track. The Union Pacific hasn't even finished laying its rails. And its big train is stuck in Wyoming. Workers who hadn't been paid chained the boss's railroad car to the track. And heavy rain hurt a bridge in Weber Canyon.", "The ceremony moves to May 10. You wait and wait. Then your trip clock runs out, and the band brings you home.", "What could you try differently? The date on the golden spike was the plan. Which day did it really happen?"]}, "e_wrong_place": {"id": "e_wrong_place", "page": 45, "type": "BAD", "title": "The Wrong Promontory", "image": "img/e_wrong_place.jpg", "paragraphs": ["You land on rocks by the edge of the Great Salt Lake. Gulls cry. Waves splash. The water smells salty.", "There's no railroad here. No engines. No crowd. Only birds.", "This is Promontory Point, the tip of the land. The railroad is far to the north, up at the summit.", "Your trip clock runs out, and the band brings you home.", "What could you try differently? The railroad climbed up to the top. What's another word for the top of a climb?"]}, "e_steam": {"id": "e_steam", "page": 46, "type": "BAD", "title": "Lost in the Steam", "image": "img/e_steam.jpg", "paragraphs": ["You stand by Jupiter's big front wheels and press record.", "Just as the hammer goes up, the engineer opens little valves to let water out. WHOOSH! A cloud of steam bursts out around you.", "Steam is water, so hot it's turned into gas. When it hits the cool glass of the band's camera, it turns back into tiny drops. The lens fogs up. All you see is white.", "When the cloud clears, everyone is cheering. You missed the moment. The band brings you home.", "What could you try differently? Steam is very wet. Where could you watch from, away from the puffs?"]}, "e_time_up": {"id": "e_time_up", "page": 47, "type": "BAD", "title": "Time's Up", "image": "img/e_time_up.jpg", "paragraphs": ["The trip clock beeps. Zero minutes.", "{variant}", "The band hums and brings you home, before the big moment.", "\"The band can only stay one hour,\" Dr. Finch says. \"It keeps you safe. But it doesn't wait.\"", "There's no recording this time.", "What could you try differently? The band can only stay one hour. How could you get there closer to the moment?"], "variants": {"camp": "The fire was warm. The camp was quiet. Your eyes closed, and the clock ran out.", "tenmile": "The track kept growing, mile after mile. But the day had twelve hours, and your clock had one.", "morning": "The ceremony was six hours away. Your clock had one hour.", "_default": "You waited too long."}}, "e_too_early": {"id": "e_too_early", "page": 48, "type": "BAD", "title": "Too Early in Washington", "image": "img/e_too_early.jpg", "paragraphs": ["You land in the Washington telegraph office. The wall clock says 12:47.", "But nothing is happening. Clerks read papers. A man yawns.", "The sun reaches Washington first. When Washington's clocks say 12:47, Utah's clocks say only about 10:47 in the morning. The ceremony hasn't started yet. The news won't come for two more hours.", "Your trip clock runs out, and the band brings you home.", "What could you try differently? The sun reaches the East first. When the news came, were Washington's clocks ahead or behind?"]}, "e_too_far": {"id": "e_too_far", "page": 49, "type": "BAD", "title": "Too Far Away", "image": "img/e_too_far.jpg", "paragraphs": ["You climb and climb. From the hill, you see everything: the engines, the crowd, the little table.", "You press record. Far below, the hammer swings. The crowd jumps and waves.", "But up here, the sound is tiny. Sound spreads out as it travels, and it gets quieter. The wind whooshes past the band. You can't hear a single click.", "The recording is mostly wind. The band brings you home.", "What could you try differently? Sound gets quieter far away. How could you get closer?"]}, "e_blast": {"id": "e_blast", "page": 50, "type": "BAD", "title": "Stand Clear!", "image": "img/e_blast.jpg", "paragraphs": ["You run up the hill toward the rock cut.", "\"Blast! Stand clear!\" a man shouts again. Everyone runs the other way.", "The band buzzes. Its safety rule doesn't only protect history. It protects you, too. Everything goes white.", "Back in the kitchen, you hear a faraway BOOM in your head. Black powder burns very fast and makes lots of gas. The gas pushes so hard it breaks rock.", "\"Blasting is for grown-ups who know the rules,\" Dr. Finch says.", "What could you try differently? Where else could you watch the workers, safely?"]}}};

  if (!synth || typeof SpeechSynthesisUtterance === "undefined") els.note.textContent = "";

  function audioSrc(src) {

  }
  function buildSegments() {

  }
  function segOf(pi, wi) {

    }

  }
  function setReadBtn(state) {
    els.read.textContent = state === "playing" ? "\u23F8 Pause" : state === "paused" ? "\u25B6 Keep reading" : "\u25B6 Read to me";
    els.read.setAttribute("aria-label", els.read.textContent.slice(2));
    els.read.dataset.state = state;
    if (els.big) {
      els.big.dataset.state = state;
      els.big.innerHTML = state === "playing" ? "&#10074;&#10074;" : "&#9654;";
      var lb = state === "playing" ? "Pause" : state === "paused" ? "Play (keep reading)" : "Play (read to me)";
      els.big.setAttribute("aria-label", lb); els.big.title = lb;
    }
  }
  function highlight(pi, wi) {
    if (hlEl) hlEl.classList.remove("cur"); hlEl = null;
    var w = words[pi] && words[pi][wi]; if (!w) return;
    rd.p = pi; rd.w = wi; w.el.classList.add("cur"); hlEl = w.el;
    var r = w.el.getBoundingClientRect(), sr = els.scroller.getBoundingClientRect();
    if (r.top < sr.top + 10 || r.bottom > sr.bottom - 30) w.el.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function clearHl() { if (hlEl) hlEl.classList.remove("cur"); hlEl = null; }
  function loadVoices() {
    if (!synth) return;
    var all = synth.getVoices() || []; if (!all.length) return;
    var en = all.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    rd.voices = en.concat(all.filter(function (v) { return en.indexOf(v) < 0; }));
    var saved = null; try { saved = localStorage.getItem(KEY + "voice"); } catch (e) {}
    var pick = saved ? rd.voices.filter(function (v) { return v.voiceURI === saved; })[0] : null;
    for (var i = 0; i < PREFERRED.length && !pick; i++) pick = en.filter(function (v) { return v.name.toLowerCase().indexOf(PREFERRED[i]) >= 0; })[0] || null;
    if (!pick) pick = en.filter(function (v) { return /en[-_]us/i.test(v.lang); })[0] || en[0] || all[0];
    rd.voice = pick;
    var sel = $("voice"); sel.innerHTML = "";
    rd.voices.forEach(function (v, i) { var o = document.createElement("option"); o.value = i; o.textContent = v.name + " (" + v.lang + ")"; if (v === pick) o.selected = true; sel.appendChild(o); });
  }
  if (synth) { loadVoices(); if ("onvoiceschanged" in synth) synth.onvoiceschanged = loadVoices; setTimeout(loadVoices, 600); setTimeout(loadVoices, 1600); }
  $("voice").onchange = function () { rd.voice = rd.voices[+this.value] || null; try { localStorage.setItem(KEY + "voice", rd.voice ? rd.voice.voiceURI : ""); } catch (e) {} };
  function showSpeed() { $("speed").value = rd.speed; $("speedVal").textContent = rd.speed.toFixed(2).replace(/0$/, "") + "\u00D7"; }
  showSpeed();
  $("speed").oninput = function () {
    rd.speed = +this.value; showSpeed();
    if (audioEl) audioEl.playbackRate = rd.speed;
    try { localStorage.setItem(KEY + "speed", rd.speed); } catch (e) {}
  };
  $("auto").checked = autoRead;
  $("auto").onchange = function () { autoRead = this.checked; try { localStorage.setItem(KEY + "auto", autoRead ? "1" : "0"); } catch (e) {} };

  function chunkEnd(text, from) {
    var re = /[.!?]+["'\u201d\u2019)]*\s+/g, end = -1, m; re.lastIndex = from;
    while ((m = re.exec(text))) { var e = m.index + m[0].length; if (end < 0 || e - from <= 180) end = e; if (e - from > 180) break; }
    return end < 0 ? text.length : end;
  }
  function stopTimers() { if (timer) clearTimeout(timer); timer = null; if (startWatch) clearTimeout(startWatch); startWatch = null; if (raf) cancelAnimationFrame(raf); raf = 0; }
  function stopReading(keepHl) {
    gen++; stopTimers(); if (synth) synth.cancel(); current = null;
    if (audioEl) { audioEl.onended = audioEl.onerror = audioEl.ontimeupdate = null; audioEl.pause(); audioEl = null; }
    rd.on = false; rd.paused = false; rd.resume = null; rd.mode = null; setReadBtn("idle"); if (!keepHl) clearHl();
  }
  function doneReading() { stopReading(); rd.p = 0; rd.w = 0; rd.seg = 0; }

  // Built-in voice for paragraphs pi..lastPi, then done()
  function speakFrom(pi, wi, lastPi, done) {
    var para = paras[pi] && paras[pi].t, list = words[pi];
    if (para == null || pi > lastPi) return done();
    if (!list || !list.length || wi >= list.length) return speakFrom(pi + 1, 0, lastPi, done);
    var my = gen, from = list[wi].start, to = chunkEnd(para, from), text = para.slice(from, to);
    var u = new SpeechSynthesisUtterance(text);
    u.lang = (rd.voice && rd.voice.lang) || "en-US"; if (rd.voice) { try { u.voice = rd.voice; } catch (e) {} }
    var rate = 0.85 * rd.speed; u.rate = rate; u.pitch = 1.05; current = u;
    var got = false, cw = [];
    for (var k = wi; k < list.length && list[k].start < to; k++) cw.push(k);
    function wordAt(ci) { var abs = from + ci, best = cw[0]; for (var j = 0; j < cw.length; j++) { if (list[cw[j]].start <= abs + 1) best = cw[j]; else break; } return best; }
    u.onboundary = function (e) { if (my !== gen) return; if (e.name && e.name !== "word") return; got = true; boundaryWorks = true; if (timer) { clearTimeout(timer); timer = null; } highlight(pi, wordAt(e.charIndex || 0)); };
    function runTimer(idx) {
      if (my !== gen || got || idx >= cw.length) return;
      highlight(pi, cw[idx]);
      var w = list[cw[idx]], tok = para.slice(w.start, w.end).replace(/["'\u201d\u2019]+$/, "");
      var ms = (tok.length + 1) * 62 / rate + 90 / rate;
      if (/[,;:]$/.test(tok)) ms += 220 / rate; if (/[.!?]$/.test(tok)) ms += 420 / rate;
      timer = setTimeout(function () { runTimer(idx + 1); }, ms);
    }
    u.onstart = function () { if (my !== gen) return; if (startWatch) { clearTimeout(startWatch); startWatch = null; } highlight(pi, wi); if (!boundaryWorks) timer = setTimeout(function () { if (!got) runTimer(0); }, 250); };
    u.onend = function () { if (my !== gen) return; stopTimers(); if (to >= para.length) speakFrom(pi + 1, 0, lastPi, done); else { var nw = wi; while (nw < list.length && list[nw].start < to) nw++; speakFrom(pi, nw, lastPi, done); } };
    u.onerror = function (e) { if (my !== gen) return; if (e && (e.error === "interrupted" || e.error === "canceled")) return; stopTimers(); doneReading(); els.note.textContent = (synth.getVoices() || []).length ? "The voice stopped. Tap Read to me to try again." : "No reading voice was found on this device. You can still read it yourself."; };
    highlight(pi, wi); synth.speak(u); if (synth.paused) synth.resume();
    startWatch = setTimeout(function () { if (my !== gen || !rd.on) return; if (!synth.speaking) { synth.cancel(); synth.speak(u); } }, 4000);
  }

  // Recorded clip with word timings
  function playAudioSeg(si, local, at) {
    var g = segs[si], W = g.a.words, my = gen, el = new Audio();
    audioEl = el; rd.mode = "audio"; rd.seg = si;
    el.preload = "auto";
    try { el.preservesPitch = true; el.mozPreservesPitch = true; el.webkitPreservesPitch = true; } catch (e) {}
    var t0 = at != null ? at : (local > 0 && W[local] ? Math.max(0, W[local][0] - 0.05) : 0), last = -1;
    function sync() {
      if (my !== gen || audioEl !== el) return;
      var t = el.currentTime + 0.03, i = last < 0 ? 0 : last;
      if (i > 0 && W[i][0] > t) i = 0;
      while (i < W.length - 1 && W[i + 1][0] <= t) i++;
      if (i !== last) { last = i; highlight(g.map[i][0], g.map[i][1]); }
    }
    function tick() { sync(); if (my === gen && audioEl === el && !el.paused) raf = requestAnimationFrame(tick); }
    function fail() {
      if (my !== gen) return; g.failed = true; audioEl = null;
      if (synth) { var m = g.map[Math.max(0, last, local)] || g.map[0]; rd.mode = "synth"; speakFrom(m[0], m[1], g.paras[g.paras.length - 1], function () { playSeg(si + 1, 0); }); }
      else playSeg(si + 1, 0);
    }
    function go() {
      if (my !== gen) return;
      if (t0 > 0) { try { el.currentTime = t0; } catch (e) {} }
      el.playbackRate = rd.speed;
      var pr = el.play();
      if (pr && pr.catch) pr.catch(function (err) {
        if (my !== gen) return;
        if (err && err.name === "NotAllowedError") { rd.resume = { seg: si, t: t0 }; stopTimers(); audioEl = null; rd.on = false; rd.paused = true; setReadBtn("paused"); els.note.textContent = "Tap \u25B6 to hear the story."; }

    el.onerror = fail;

    highlight(g.map[local] ? g.map[local][0] : g.map[0][0], g.map[local] ? g.map[local][1] : g.map[0][1]);
  }
  function playSeg(si, local) {
    if (!rd.on) return;
    stopTimers(); audioEl = null;
    if (si >= segs.length) return doneReading();
    var g = segs[si]; rd.seg = si;
    if (!g.n) return playSeg(si + 1, 0);
    if (g.a && !g.failed) return playAudioSeg(si, local || 0);
    if (synth && typeof SpeechSynthesisUtterance !== "undefined") {
      rd.mode = "synth"; var m = g.map[local || 0] || g.map[0];
      return speakFrom(m[0], m[1], g.paras[g.paras.length - 1], function () { playSeg(si + 1, 0); });
    }
    playSeg(si + 1, 0);
  }
  function begin() { els.note.textContent = ""; rd.on = true; rd.paused = false; setReadBtn("playing"); }
  function startReading(pi, wi) {
    stopReading(); begin();
    var sl = segOf(pi, wi); playSeg(sl[0], sl[1]);
  }
  function pauseReading() {
    if (!rd.on) return;
    var r = { seg: rd.seg, p: rd.p, w: rd.w };
    if (rd.mode === "audio" && audioEl) r.t = audioEl.currentTime;
    stopReading(true); rd.paused = true; rd.resume = r; setReadBtn("paused");
  }
  function resumeReading() {
    var r = rd.resume; rd.paused = false; rd.resume = null;

  }
  function togglePlay() { userTapped = true; if (rd.on) pauseReading(); else if (rd.paused) resumeReading(); else startReading(0, 0); }
  els.read.onclick = togglePlay;
  if (els.big) els.big.onclick = togglePlay;
  document.addEventListener("keydown", function (e) {

    var tg = e.target && e.target.tagName; if (tg === "INPUT" || tg === "SELECT" || tg === "TEXTAREA" || tg === "BUTTON") return;

  });
  els.text.addEventListener("click", function (e) { var t = e.target; if (!t || !t.classList || !t.classList.contains("w")) return; userTapped = true; startReading(+t.dataset.p, +t.dataset.w); });

  // ---------------- menu ----------------
  function openMenu() {
    var f = found(), ids = Object.keys(S.endings).sort(function (a, b) { return S.endings[a].page - S.endings[b].page; });
    var g = f.filter(function (x) { return S.endings[x] && S.endings[x].type === "GOOD"; }).length;
    $("foundSum").textContent = "Endings found: " + f.length + " of " + ids.length + " (" + g + " good, " + (f.length - g) + " bad)";
    var ul = $("foundList"); ul.innerHTML = "";
    ids.forEach(function (id) { var e = S.endings[id], li = document.createElement("li"), has = f.indexOf(id) >= 0;
      li.className = has ? "yes" : "no"; li.textContent = (has ? "\u2714 " : "\u25CB ") + e.title + (e.type === "GOOD" ? " \u2B50" : ""); ul.appendChild(li); });
    $("modal").classList.add("show");
  }
  $("menuBtn").onclick = openMenu;
  $("mClose").onclick = function () { $("modal").classList.remove("show"); };
  $("mStart").onclick = function () { $("modal").classList.remove("show"); startOver(); };
  $("mReset").onclick = function () { if (confirm("Forget all endings found?")) { try { localStorage.removeItem(FOUND); } catch (e) {} openMenu(); } };
  $("modal").onclick = function (e) { if (e.target === this) this.classList.remove("show"); };
  els.backTop.onclick = backToChoice;
  document.addEventListener("pointerdown", function () { userTapped = true; }, true);
  document.addEventListener("keydown", function () { userTapped = true; }, true);
  window.addEventListener("pagehide", function () { stopReading(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden && rd.on) pauseReading(); });

  // test hooks
  window.MoonAdventure = window.ReadAlong = { togglePlay: function () { togglePlay(); }, state: function () { return clone(st); }, startOver: startOver, back: backToChoice,
    go: function (id, flags) { stopReading(); st.at = id; if (flags) for (var k in flags) st.flags[k] = flags[k]; render(); },
    segments: function () { return segs.map(function (g) { return { k: g.k, n: g.n, audio: !!g.a, paras: g.paras.slice() }; }); },
    reading: function () { return { on: rd.on, paused: rd.paused, seg: rd.seg, mode: rd.mode, t: audioEl ? audioEl.currentTime : null, src: audioEl ? audioEl.src : null, rate: audioEl ? audioEl.playbackRate : null, cur: hlEl ? +hlEl.dataset.i : -1, speed: rd.speed }; } };
  if (st.at === S.start && !st.history.length) enter(S.start);
  render();
})();
