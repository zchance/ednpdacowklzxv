<script>
var STORY = {"title": "Evelyn and the TimeBand: The Golden Spike", "version": "2.0", "start": "s01", "storage_key": "spikeAdventure.v2.", "photo_where": "Real photos from 1869", "meter": {"short": "⏱", "label": "Trip clock", "max": 60, "flag": "clock_min", "field": "clock"}, "flags": {"charges": 3, "walked_trail": false, "saw_grades": false, "knows_code": false, "ten_mile": false, "clock_min": 60, "via": null, "recording_saved": false}, "notes": "Second-person time-travel adventure (mission 2). Tokens {variant} and {bonus} are filled by the player from state.via and flags.", "scenes": {"s01": {"id": "s01", "page": 1, "title": "The Second Mission", "place": "Your kitchen, Saturday morning", "image": "img/s01.jpg", "paragraphs": ["Knock, knock. Dr. Ada Finch is at the kitchen door. She came for honey. She also brought her metal case.", "Click. The case pops open. Click. The TimeBand snaps onto your left wrist. Three green dots blink on.", "\"Your Moon recording plays at the museum every day,\" she says. \"Now I need you again.\"", "\"May 10, 1869. Promontory Summit, Utah. Two railroads meet and make one railroad across America. We have photos of that day. We have no sound. Nobody could record sound back then.\"", "\"Your mission is to record the moment the railroad was finished: the last spike, and the telegraphed word DONE.\"", "She counts on her fingers. \"Three charges. Every trip uses one. Coming home is free. One hour per trip, so watch your trip clock. Look, but don't change anything. Hold still to record.\"", "She hands you a bonnet, a dress, an apron, and boots. \"So nobody notices you.\"", "Mom sets down a jar of honey. \"Lots of your great-great-grandparents walked to Utah,\" she says. \"Some of them pulled handcarts.\"", "\"You could visit a handcart company in 1856,\" Dr. Finch says. \"But that trip costs a charge. Spend them wisely.\""], "choices": [{"label": "Visit the handcart trail", "prompt": "If you want to visit a handcart company on the trail in 1856, tap 'Visit the handcart trail.'", "target": "s02", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "Open the mission map", "prompt": "If you are ready to pick a day in 1869, tap 'Open the mission map.'", "target": "s05", "hop": false}]}, "s02": {"id": "s02", "page": 2, "title": "The Handcart Trail", "place": "Beside the Platte River, Nebraska Territory - August 1856, late afternoon", "image": "img/s02.jpg", "paragraphs": ["Press. White. Quiet.", "Grass tickles your knees. A wide, muddy river slides by. Creak, creak. A long line of people comes down the trail. They are not riding. They are pulling carts.", "Two big wheels. Two long handles. A dad pulls in front. Kids push behind. Flour, blankets, and pots ride on top.", "This is the first handcart company. Their captain is Edmund Ellsworth. They are Latter-day Saints, walking to Salt Lake City. Many of them crossed the ocean from England to get here.", "A girl walks beside the captain. Her name is Annie. She is four, and she walks all day. When they reach the valley, her family has promised her bread and butter.", "A wheel rolls. A box would have to drag. That's why the carts have wheels.", "Squeak. Squeak. SQUEAK. One wheel sounds like it needs help.", "Your trip clock says 60 minutes."], "choices": [{"label": "Ride in a cart", "prompt": "If you climb up and ride in a handcart, tap 'Ride in a cart.'", "target": "e_safety_return", "hop": false, "sets": {"via": "cart"}}, {"label": "Walk with Annie", "prompt": "If you walk at the side of the trail near Annie, tap 'Walk with Annie.'", "target": "s03", "hop": false}], "clock": 60}, "s03": {"id": "s03", "page": 3, "title": "The Squeaky Wheel", "place": "Camp by the Platte River - before sunset", "image": "img/s03.jpg", "paragraphs": ["You walk beside Annie. Dust puffs up with every step. She hums. Nobody minds one more girl in a bonnet.", "At sunset, the company stops. A man tips the squeaky cart on its side. He spins the wheel. Rub, rub, squeak.", "He touches the axle and jerks his hand back. Hot! Wood rubbing on wood gets hot and wears thin. That rubbing is called friction.", "He wraps a strip of tin around the axle. Tap, tap, tap. Smooth metal rubs less than rough wood. He spins the wheel again. Quieter.", "\"Fifteen miles a day, on foot,\" Dr. Finch whispers in your ear. \"All summer long. In 1869, a train will make this trip in a few days.\"", "The hammer lies on the cart, right by your hand.", "Your trip clock says 40 minutes."], "choices": [{"label": "Hammer it yourself", "prompt": "If you pick up the hammer and fix the wheel yourself, tap 'Hammer it yourself.'", "target": "e_safety_return", "hop": false, "sets": {"via": "wheel"}}, {"label": "Stay for supper", "prompt": "If you stay and watch the camp make supper, tap 'Stay for supper.'", "target": "s04", "hop": false}], "on_enter": {"set": {"walked_trail": true}}, "clock": 40}, "s04": {"id": "s04", "page": 4, "title": "Songs at Camp", "place": "Camp by the Platte River - sunset", "image": "img/s04.jpg", "paragraphs": ["Small fires glow in a ring. There are almost no trees out here. So the fires burn dried buffalo chips. That's dried buffalo poop! It burns hot and slow.", "Someone starts to sing. Then everyone sings:", "\"Some must push and some must pull, as we go marching up the hill. As merrily on the way we go, until we reach the valley, oh!\"", "Annie claps. Her feet are dusty. She is smiling.", "More than a thousand miles. Step by step.", "The fire is warm. Your eyes feel heavy.", "Your trip clock says 10 minutes. \"Come home soon,\" Dr. Finch says. \"The mission map is waiting.\""], "choices": [{"label": "Sleep by the fire", "prompt": "If you curl up by the warm fire for a little nap, tap 'Sleep by the fire.'", "target": "e_time_up", "hop": false, "sets": {"via": "camp"}}, {"label": "Go home to the map", "prompt": "If you go home and open the mission map, tap 'Go home to the map.' (Going home is free.)", "target": "s05", "hop": false}], "clock": 10}, "s05": {"id": "s05", "page": 5, "title": "The Mission Map", "place": "The TimeBand screen, in your kitchen", "image": "img/s05.jpg", "paragraphs": ["Back in the kitchen. Dr. Finch taps the band. A map pops up. A glowing line runs across America.", "\"Two companies raced to build it,\" she says. \"The Central Pacific came from California. The Union Pacific came from Nebraska. They meet in Utah.\"", "Four stops blink on the map.", "March 1869: two grades, side by side, and blasting on the hill.", "April 28, 1869: Ten-Mile Day. A race to set a record.", "May 8, 1869: the date written on the golden spike.", "May 10, 1869: tap it to pick a place.", "\"Picking a place is free. So is the wire map,\" she says. \"Trips are not. And what you learn on one trip can help you on another.\"", "You look at your green dots. Where first?"], "choices": [{"label": "The two grades", "prompt": "If you want to see the workers building the grade in March 1869, tap 'The two grades.'", "target": "s06", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "Ten-Mile Day", "prompt": "If you want to see the record race, April 28, 1869, tap 'Ten-Mile Day.'", "target": "s08", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "May 8", "prompt": "If you want to go on May 8, 1869, the date on the golden spike, tap 'May 8.'", "target": "e_wrong_day", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "May 10", "prompt": "If you want to pick a place for May 10, 1869, tap 'May 10.' (Picking is free.)", "target": "s11", "hop": false}, {"label": "Look at the wires", "prompt": "If you want to look at the telegraph wires, tap 'Look at the wires.' (Looking is free.)", "target": "s25", "hop": false}]}, "s06": {"id": "s06", "page": 6, "title": "Two Grades", "place": "Promontory Mountains, Utah Territory - late March 1869", "image": "img/s06.jpg", "paragraphs": ["Thump. You land on a hill of gray sagebrush. Cold wind. Your trip clock says 60 minutes.", "Below you, men shovel dirt into a long, smooth ramp. That's a grade. Later, the rails will sit on top.", "Many of these workers are Latter-day Saints from towns nearby. Brigham Young, the leader of their church, signed a contract to build grade for the railroad. Farmers came with their sons, their mules, and their shovels.", "Wait. There are TWO grades, side by side!", "\"Nobody has picked the meeting place yet,\" Dr. Finch says. \"Each company gets paid by the mile. So both keep building.\"", "Up the hill, a man strikes a match. A fuse sputters. Hsssss.", "\"BLAST!\" he yells. \"STAND CLEAR!\"", "Men drop their shovels and run."], "choices": [{"label": "Run up to see the fuse", "prompt": "If you run up the hill to get a close look at the fuse, tap 'Run up to see the fuse.'", "target": "e_blast", "hop": false}, {"label": "Dive behind the wagon", "prompt": "If you dive behind the wagon and cover your ears, tap 'Dive behind the wagon.'", "target": "s07", "hop": false}], "on_enter": {"set": {"saw_grades": true}}, "clock": 60}, "s07": {"id": "s07", "page": 7, "title": "The Big Fill", "place": "Spring Creek ravine, Promontory Mountains - late March 1869", "image": "img/s07.jpg", "paragraphs": ["BOOM! The ground jumps under your boots. Pebbles rattle on the wagon. Black powder burns so fast it makes a giant push of gas. That push cracks the rock.", "The dust drifts away. Everyone is fine. The men pick up their shovels.", "Down the hill is a deep ravine. A train can't jump a ravine, so the workers are filling it in. Mules pull carts to the edge. Tip. Crash. Dirt and rock slide down. Again. Again. Again. This is the Big Fill. A Latter-day Saint company, Benson, Farr and West, is building it.", "Right next to it, the other company builds a tall wooden bridge. It's called the Big Trestle.", "Why not just go down and up? Iron wheels on iron rails are slippery. On a steep hill, the wheels would spin. So the track has to stay almost flat.", "An empty dump cart rattles past. It looks like a fun ride.", "Your trip clock says 45 minutes."], "choices": [{"label": "Ride the dump cart", "prompt": "If you jump on an empty dump cart for a ride, tap 'Ride the dump cart.'", "target": "e_safety_return", "hop": false, "sets": {"via": "dumpcart"}}, {"label": "Go to Ten-Mile Day", "prompt": "If you jump ahead to April 28, Ten-Mile Day, tap 'Go to Ten-Mile Day.'", "target": "s08", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "Open May 10", "prompt": "If you want to pick a place for May 10, tap 'Open May 10.' (Picking is free.)", "target": "s11", "hop": false}], "clock": 45}, "s08": {"id": "s08", "page": 8, "title": "Ten-Mile Day", "place": "Near Victory camp, Utah Territory - April 28, 1869, 7:15 a.m.", "image": "img/s08.jpg", "paragraphs": ["Thump. You land beside a long, empty grade. It's April 28, 1869, a cold morning. Your trip clock says 60 minutes.", "Charles Crocker runs the building for the Central Pacific. He made a big bet. His crews will lay ten miles of track in ONE day. Nobody has ever done that.", "A whistle shrieks. GO!", "Horses haul little iron cars piled with rails. Eight men grab a rail with tongs. Lift! Drop! CLANG! The ground shakes under your boots. Chinese crews slide the ties in and set the spikes. Bang, bang, bang. Three blows, and a spike is in.", "At the end of each rail, the men leave a tiny gap. On hot days, iron grows a little. Without the gaps, the rails would push and bend.", "Behind the crews, a wagon rolls along with a telegraph key inside. Men hang the wire as fast as the track grows."], "choices": [{"label": "Push the rails together", "prompt": "If you push two rails tight together to close the gap, tap 'Push the rails together.'", "target": "e_safety_return", "hop": false, "sets": {"via": "gap"}}, {"label": "Race with the rail crew", "prompt": "If you run along with the rail crew, tap 'Race with the rail crew.'", "target": "s09", "hop": false}, {"label": "Follow the wire wagon", "prompt": "If you run after the wagon with the telegraph key, tap 'Follow the wire wagon.'", "target": "s23", "hop": false}], "clock": 60}, "s23": {"id": "s23", "page": 9, "title": "The Wire Wagon", "place": "Ten-Mile Day - about 7:45 a.m.", "image": "img/s23.jpg", "paragraphs": ["You run to the wagon. Inside, a telegraph man sits at a little key.", "Click. Clack. Click-click. He's sending news of the race down the wire, as fast as the track grows.", "\"Short clicks are dots,\" he tells you. \"Long clicks are dashes. Dots and dashes make letters.\" He taps. \"Dash, dot, dot. That's D.\"", "He taps again. \"Dot, dot, with a little space. That's O. Dash, dot is N. One dot is E.\"", "D. O. N. E. You whisper it. DONE. You tuck it away for later.", "\"Want a turn?\" he jokes, and slides the key toward you.", "Your trip clock says 50 minutes."], "choices": [{"label": "Take a turn on the key", "prompt": "If you take a turn and tap the key, tap 'Take a turn on the key.'", "target": "e_safety_return", "hop": false, "sets": {"via": "wirekey"}}, {"label": "Run back to the race", "prompt": "If you say no thank you and run back to the race, tap 'Run back to the race.'", "target": "s09", "hop": false}, {"label": "Jump to the finish", "prompt": "If you jump ahead to tonight, when the race ends, tap 'Jump to the finish.'", "target": "s10", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}], "on_enter": {"set": {"knows_code": true}}, "clock": 50}, "s09": {"id": "s09", "page": 10, "title": "Iron and Tea", "place": "Ten-Mile Day - about 8:30 a.m.", "image": "img/s09.jpg", "paragraphs": ["The track grows as fast as you can walk. CLANG goes a rail. Bang, bang, bang go the hammers. The ground thumps like a giant heartbeat.", "Each rail weighs as much as three grown-ups. Four men lift each end. They don't stop. They don't slow down.", "A Chinese worker trots by with two buckets on a pole. Tea! It's made with boiled water. Boiling kills germs, so the tea crews get sick less.", "{bonus}", "\"Ten miles by dark?\" Dr. Finch says. \"The finish is twelve hours away. Your clock has thirty-five minutes.\"", "Your trip clock says 35 minutes."], "choices": [{"label": "Wait for the finish", "prompt": "If you stay here and wait for the end of the race, tap 'Wait for the finish.'", "target": "e_time_up", "hop": false, "sets": {"via": "tenmile"}}, {"label": "Jump to the finish", "prompt": "If you jump ahead to tonight, when the race ends, tap 'Jump to the finish.'", "target": "s10", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "Open May 10", "prompt": "If you want to pick a place for May 10, tap 'Open May 10.' (Picking is free.)", "target": "s11", "hop": false}], "bonus": [{"if": {"knows_code": true}, "text": "From the wire wagon, you hear click, clack. Dash, dot, dot. You know that one!"}], "clock": 35}, "s10": {"id": "s10", "page": 11, "title": "Ten Miles!", "place": "Ten-Mile Day - about 6:30 p.m.", "image": "img/s10.jpg", "paragraphs": ["Thump. The sun is low and orange. Your trip clock says 60 minutes.", "The crews are still going. Faster now. A boss shouts the count. \"Nine miles!\" CLANG. Bang, bang, bang.", "Arms ache. Sweat drips. Nobody stops.", "Then the last spike of the day goes in. A shout runs down the line. TEN MILES AND FIFTY-SIX FEET!", "Hats fly. The eight rail men flop down in the dirt. The Chinese crews sit on the ties, tired and proud. That record still stands today.", "Then Jim Campbell climbs into an engine. Chuff, chuff, CHUFF. He races it over the new track, faster than a galloping horse. The rails hold. Not one wobble.", "\"Now the Central Pacific is only a few miles from Promontory Summit,\" Dr. Finch says. \"Remember these faces.\""], "choices": [{"label": "Open May 10", "prompt": "If you want to pick a place for May 10, tap 'Open May 10.' (Picking is free.)", "target": "s11", "hop": false}, {"label": "Look at the wires", "prompt": "If you want to look at the telegraph wires, tap 'Look at the wires.' (Looking is free.)", "target": "s25", "hop": false}], "on_enter": {"set": {"ten_mile": true}}, "clock": 60}, "s11": {"id": "s11", "page": 12, "title": "Two Promontories", "place": "The TimeBand screen - May 10, 1869", "image": "img/s11.jpg", "paragraphs": ["Dr. Finch's face pops up on the band. \"May 10, 1869. Pick a place and a time. Careful. You only get one hour.\"", "The map shows the Great Salt Lake. A long, bumpy finger of land points into the water. That's the Promontory.", "At the very tip, by the water, is Promontory Point.", "Up in the hills to the north is Promontory Summit. A summit is the top of a climb. The railroad climbs up to it from both sides.", "\"People mix these up,\" Dr. Finch says. \"Even the newspapers did.\"", "Two times blink for the Summit. Eleven o'clock, when the engine Jupiter rolls in. Or noon."], "choices": [{"label": "Promontory Point", "prompt": "If you go to Promontory Point, at the tip of the land by the lake, tap 'Promontory Point.'", "target": "e_wrong_place", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "The Summit at eleven", "prompt": "If you go to Promontory Summit at eleven o'clock, to see Jupiter roll in, tap 'The Summit at eleven.'", "target": "s12", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "The Summit at noon", "prompt": "If you go to Promontory Summit at noon, tap 'The Summit at noon.'", "target": "s13", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}]}, "s12": {"id": "s12", "page": 13, "title": "Jupiter Rolls In", "place": "Promontory Summit - May 10, 1869, a few minutes after 11 a.m.", "image": "img/s12.jpg", "paragraphs": ["Thump. You land behind a stack of ties. Cold wind. Your trip clock says 60 minutes.", "WHOOOO! A whistle screams down the track. Chuff. Chuff. Chuff. Here comes Jupiter! Its funnel smokestack puffs gray smoke. Its brass shines. Steam hisses from its sides.", "The crowd waves hats. Jupiter squeals to a stop. Leland Stanford's fancy railroad car is right behind it.", "Across a short gap, the Union Pacific's engine, No. 119, waits. Hiss. Hiss.", "In the gap, there's room for just two more rails.", "The spike won't go in until almost one o'clock. That's nearly two hours away. Your clock has one."], "choices": [{"label": "Stay for the spike", "prompt": "If you stay right here and wait for the spike, tap 'Stay for the spike.'", "target": "e_time_up", "hop": false, "sets": {"via": "jupiter"}}, {"label": "Run up to Jupiter", "prompt": "If you run right up to Jupiter as it hisses to a stop, tap 'Run up to Jupiter.'", "target": "e_steam", "hop": false, "sets": {"via": "arrive"}}, {"label": "Jump ahead to noon", "prompt": "If you jump ahead to noon, tap 'Jump ahead to noon.'", "target": "s13", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}], "clock": 60}, "s13": {"id": "s13", "page": 14, "title": "Promontory Summit", "place": "Promontory Summit - May 10, 1869, about noon", "image": "img/s13.jpg", "paragraphs": ["Thump. You land behind a wagon. Bright sun. Cold wind. Your trip clock says 60 minutes.", "Two engines face each other across a gap. Jupiter came from the west. Its smokestack looks like a big funnel. No. 119 came from the east. Its smokestack is tall and straight. Hiss. Tick. Puff.", "Hundreds of people push in close. Workers. Soldiers. Bosses in tall hats. A few women in long dresses. An army band. And a band all the way from Salt Lake City.", "Brigham Young isn't here. He's visiting towns in southern Utah. Bishop John Sharp and Ogden's mayor, Lorin Farr, came in his place.", "By the gap, a man sets a little table beside a telegraph pole. By the engines, a man sets up a big wooden camera.", "The spike goes in at 12:47. Where will you be when the hammer swings?"], "choices": [{"label": "Go see the engines", "prompt": "If you go see the two engines, tap 'Go see the engines.'", "target": "s14", "hop": false}, {"label": "Go to the last rail", "prompt": "If you go to the gap where the last rails go down, tap 'Go to the last rail.'", "target": "s17", "hop": false}, {"label": "Go to the photographer", "prompt": "If you go to the man with the big camera, tap 'Go to the photographer.'", "target": "s22", "hop": false}, {"label": "Stay at the back", "prompt": "If you stay at the back of the crowd, tap 'Stay at the back.'", "target": "s29", "hop": false}], "clock": 60}, "s14": {"id": "s14", "page": 15, "title": "Two Engines", "place": "Promontory Summit - about 12:10 p.m.", "image": "img/s14.jpg", "paragraphs": ["Up close, the engines are HUGE. They hiss. They tick. They drip. Hot air wobbles above them.", "A steam engine is a giant teakettle on wheels. Fire boils water. The water turns to steam. Steam needs much more room than water, so it shoves hard. It shoves the pistons, and the pistons turn the wheels.", "Jupiter burns wood. Its funnel stack catches sparks. No. 119 burns coal.", "George Booth drives Jupiter. Sam Bradford drives No. 119. Their cabs are high up, with little steps.", "Down by Jupiter's big front wheels, little pipes spit and hiss. Tsssss.", "Your trip clock says 50 minutes."], "choices": [{"label": "Stand by the front wheels", "prompt": "If you stand by Jupiter's big front wheels to record, tap 'Stand by the front wheels.'", "target": "e_steam", "hop": false, "sets": {"via": "wheels"}}, {"label": "Climb into Jupiter", "prompt": "If you climb up into Jupiter's cab, tap 'Climb into Jupiter.'", "target": "s15", "hop": false}, {"label": "Climb into No. 119", "prompt": "If you climb up into No. 119's cab, tap 'Climb into No. 119.'", "target": "s16", "hop": false}], "clock": 50}, "s15": {"id": "s15", "page": 16, "title": "Jupiter's Cab", "place": "Inside Jupiter's cab - about 12:20 p.m.", "image": "img/s15.jpg", "paragraphs": ["The fireman reaches down. \"Just for a look,\" he says. Up you go. George Booth nods.", "Hot! The fireman swings open a little iron door. Fire roars inside. He tosses in a stick of wood. Then another.", "A round gauge shows how hard the steam is pushing. The needle points high. Jupiter is ready to roll.", "Above your head swings the whistle cord.", "Through the window, you can see the gap, the crowd, and the telegraph pole. Your trip clock says 40 minutes."], "choices": [{"label": "Pull the whistle cord", "prompt": "If you pull the whistle cord, tap 'Pull the whistle cord.'", "target": "e_safety_return", "hop": false, "sets": {"via": "whistle"}}, {"label": "Record from the cab", "prompt": "If you rest your arm on the cab window and record from here, tap 'Record from the cab.'", "target": "g_jupiter", "hop": false}, {"label": "Go to the last rail", "prompt": "If you climb down and go to the last rail, tap 'Go to the last rail.'", "target": "s17", "hop": false}], "clock": 40}, "s16": {"id": "s16", "page": 17, "title": "No. 119's Cab", "place": "Inside No. 119's cab - about 12:20 p.m.", "image": "img/s16.jpg", "paragraphs": ["The fireman of No. 119 pulls you up. Sam Bradford tips his hat.", "CLANG. The fireman kicks open the firebox. Orange heat blasts out. Shovel. Shovel. Black coal flies in. The fire roars.", "No. 119 wasn't supposed to be here. A flood hurt a bridge in Weber Canyon, and the first engine couldn't cross. So No. 119 came to the rescue.", "A lump of coal lies by your boot.", "Your trip clock says 40 minutes."], "choices": [{"label": "Throw in some coal", "prompt": "If you throw a lump of coal into the fire, tap 'Throw in some coal.'", "target": "e_safety_return", "hop": false, "sets": {"via": "coal"}}, {"label": "Record from the cab", "prompt": "If you hold still in the cab and record from here, tap 'Record from the cab.'", "target": "g_119", "hop": false}, {"label": "Go to the photographer", "prompt": "If you climb down and go to the photographer, tap 'Go to the photographer.'", "target": "s22", "hop": false}], "clock": 40}, "s17": {"id": "s17", "page": 18, "title": "The Last Rail", "place": "At the gap - about 12:20 p.m.", "image": "img/s17.jpg", "paragraphs": ["\"Make way!\" Two crews carry the last two rails. An Irish crew brings one for the Union Pacific. A Chinese crew in clean blue shirts brings the other for the Central Pacific.", "Lift. Step. DROP. Clang! Dust puffs up.", "Under the rails lies a special tie. It's made of shiny laurel wood, with a silver plate on top. Its holes are already drilled.", "Out comes the golden spike. Gold is soft. One hard whack would bend it. So it just drops into its hole and gets a gentle tap. A plain iron spike will do the real work.", "That iron spike has a wire on it. So does the hammer. Both wires run to the telegraph. Every hit will click across the country.", "The golden spike glints. Nobody is looking at it. It's right by your hand.", "Your trip clock says 35 minutes."], "choices": [{"label": "Touch the golden spike", "prompt": "If you reach out and touch the golden spike, tap 'Touch the golden spike.'", "target": "e_safety_return", "hop": false, "sets": {"via": "spike"}}, {"label": "Stand with the Chinese crew", "prompt": "If you saw Ten-Mile Day end, you know these workers. Tap 'Stand with the Chinese crew.'", "target": "s18", "hop": false, "requires": {"ten_mile": true}}, {"label": "Stand with the Irish crew", "prompt": "If you stand with the Union Pacific's Irish crew, tap 'Stand with the Irish crew.'", "target": "s19", "hop": false}, {"label": "Go to the telegraph table", "prompt": "If you go to the telegraph table, tap 'Go to the telegraph table.'", "target": "s20", "hop": false}], "clock": 35}, "s18": {"id": "s18", "page": 19, "title": "The Chinese Crew", "place": "Beside the last rail", "image": "img/s18.jpg", "paragraphs": ["You slip in beside the Chinese crew. Their boss is H. H. Minkler.", "You know these faces. You saw men like them on Ten-Mile Day. Clang. Bang, bang, bang. Ten miles in one day.", "Thousands of Chinese workers built the Central Pacific. They cut through mountains. They worked in deep snow and in desert heat.", "Today, the speeches will thank the bosses. Most of the photos will show the bosses too.", "The man beside you tips his hat. You smile back.", "Your trip clock says 30 minutes."], "choices": [{"label": "Record with the crew", "prompt": "If you stand still with the crew and record, tap 'Record with the crew.'", "target": "g_crew", "hop": false}, {"label": "Go to the telegraph table", "prompt": "If you go to the telegraph table, tap 'Go to the telegraph table.'", "target": "s20", "hop": false}], "clock": 30}, "s19": {"id": "s19", "page": 20, "title": "The Irish Crew", "place": "Beside the last rail", "image": "img/s19.jpg", "paragraphs": ["The Union Pacific crew leans on their mauls. A maul is a big, heavy hammer. Many of these men were born in Ireland. Their foreman is named Guilford. They laid track all the way from Nebraska.", "\"Grip it at the end,\" a worker tells a boy. \"Long handle, fast head. Fast head, hard hit.\" He swings at the air. Whoosh!", "A spare maul leans on a pile of ties. It's almost as tall as you.", "Your trip clock says 30 minutes."], "choices": [{"label": "Swing the spare maul", "prompt": "If you pick up the spare maul and swing it, tap 'Swing the spare maul.'", "target": "e_safety_return", "hop": false, "sets": {"via": "maul"}}, {"label": "Record with the crew", "prompt": "If you stand still with the crew and record, tap 'Record with the crew.'", "target": "g_irish", "hop": false}], "clock": 30}, "s20": {"id": "s20", "page": 21, "title": "The Telegraph Table", "place": "By the telegraph pole - about 12:27 p.m.", "image": "img/s20.jpg", "paragraphs": ["W. N. Shilling sits at the little table. In front of him is the telegraph key, a small metal lever.", "Press: electricity zips down the wire. Let go: it stops. The clicks race to Omaha, Chicago, Washington, New York, and San Francisco almost at once. The whole country is listening.", "Click, click-clack. Shilling taps: \"Almost ready. Hats off. Prayer is being offered.\"", "Hats come off all around you. It goes very quiet.", "{bonus}", "Your trip clock says 25 minutes."], "choices": [{"label": "Tap the key", "prompt": "If you reach over and tap the telegraph key, tap 'Tap the key.'", "target": "e_safety_return", "hop": false, "sets": {"via": "key"}}, {"label": "Stay and read the clicks", "prompt": "If you learned the code, stay close and read the clicks. Tap 'Stay and read the clicks.'", "target": "s21", "hop": false, "requires": {"knows_code": true}, "sets": {"via": "code"}}, {"label": "Look at the wires", "prompt": "If you want to hear the news arrive somewhere far away, tap 'Look at the wires.' (Looking is free.)", "target": "s25", "hop": false}], "bonus": [{"if": {"knows_code": true}, "text": "You know this code! You learned it in the wire wagon on Ten-Mile Day. You can read every letter."}, {"if": {"knows_code": false}, "text": "The clicks fly by too fast. You can't read them. Without the code, you won't know when DONE comes. A soldier waves kids back from the table."}], "clock": 25}, "s21": {"id": "s21", "page": 22, "title": "Hats Off", "place": "By the telegraph table - about 12:45 p.m.", "image": "img/s21.jpg", "paragraphs": ["{variant}", "Reverend John Todd prays. Nobody moves. Then speeches. Then the special spikes go in. Tap. Tap.", "Shilling taps: \"We have got done praying. The spike is about to be presented.\"", "Then: \"All ready now. The spike will soon be driven. The signal will be three dots for the start of the blows.\"", "Leland Stanford lifts the hammer. A wire trails from it. The crowd leans in.", "Your finger is on the red button. Your trip clock says 15 minutes.", "Three dots are coming. Then the blows. Then DONE."], "choices": [{"label": "Record the clicks", "prompt": "If you press record and hold the band still until the very end, tap 'Record the clicks.'", "target": "g_telegraph", "hop": false}, {"label": "Stop at three dots", "prompt": "If you stop recording as soon as you hear three dots, tap 'Stop at three dots.'", "target": "e_too_soon", "hop": false, "sets": {"via": "table"}}, {"label": "Jump to Washington", "prompt": "If you jump to Washington, D.C., to hear the same clicks arrive there, tap 'Jump to Washington.'", "target": "s28", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}], "variants": {"code": "You stay right by the table. Every click is a letter to you now.", "grade": "You scramble up the old grade. From the top, you look right down on the telegraph table. Close enough to hear every click.", "_default": ""}, "clock": 15}, "s22": {"id": "s22", "page": 23, "title": "The Photographer", "place": "Near the engines - about 12:15 p.m.", "image": "img/s22.jpg", "paragraphs": ["A man ducks under a black cloth behind a big wooden box on three legs. It's a camera. His name is Andrew J. Russell. He takes pictures for the Union Pacific.", "Next to him is a wagon with a dark tent. He makes each picture on a sheet of wet glass.", "His camera drinks in light slowly. The lens stays open for a few seconds. Anything that moves turns into a blur. \"Hold still up there!\" he shouts at a man on an engine.", "\"After the spike, the engines come together,\" he tells his helper. \"That's my picture.\"", "You are standing right next to his lens. One step forward, and you'd be in the picture.", "Your trip clock says 45 minutes."], "choices": [{"label": "Run in front and wave", "prompt": "If you run in front of the camera and wave, tap 'Run in front and wave.'", "target": "e_in_photo", "hop": false}, {"label": "Stand behind the camera", "prompt": "If you stand behind the camera and record, tap 'Stand behind the camera.'", "target": "g_camera", "hop": false}, {"label": "Go to the band", "prompt": "If you follow the music to the band, tap 'Go to the band.'", "target": "s24", "hop": false}], "clock": 45}, "s24": {"id": "s24", "page": 24, "title": "The Tenth Ward Band", "place": "Near the crowd", "image": "img/s24.jpg", "paragraphs": ["Brass horns flash in the sun. BOOM goes the big drum. This is the Tenth Ward Band from Salt Lake City. A ward is a Latter-day Saint congregation, like a church family in one neighborhood. Their uniforms are brand new.", "A horn is a long metal tube, curled up. The player buzzes his lips. The air inside shakes. That shaking is the sound. A longer tube makes a lower note.", "Nearby, Charles R. Savage sets up his camera. He's a Latter-day Saint photographer from Salt Lake City. People back home are waiting for his pictures.", "{bonus}", "The drummer sets his drum down. The sticks lie right on top.", "Your trip clock says 35 minutes."], "choices": [{"label": "Play the drum", "prompt": "If you pick up the sticks and play the drum, tap 'Play the drum.'", "target": "e_safety_return", "hop": false, "sets": {"via": "drum"}}, {"label": "Record with the band", "prompt": "If you stand by the band and record, tap 'Record with the band.'", "target": "g_band", "hop": false}, {"label": "Go to Salt Lake City", "prompt": "If you jump to Salt Lake City, where the band came from, tap 'Go to Salt Lake City.'", "target": "s26", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}], "bonus": [{"if": {"saw_grades": true}, "text": "You think of the grade crews you saw in March. Some of these players may have brothers who built that grade."}], "clock": 35}, "s25": {"id": "s25", "page": 25, "title": "The Wire Map", "place": "The TimeBand screen", "image": "img/s25.jpg", "paragraphs": ["Dr. Finch shows a new map. Thin lines spread across the country like a spider web. Telegraph wires.", "\"When the spike goes in, the clicks race down every wire at once,\" she says. \"Electricity is that fast. Salt Lake City. Washington. New York. Same moment.\"", "\"Now the tricky part. In 1869, every town sets its clocks by its own sun. The sun reaches the East first. So when it's 12:47 in Utah, the clocks in Washington say 2:47.\"", "\"Railroads will fix that in 1883. They'll make time zones.\"", "{bonus}", "\"Pick a city. Pick the right time. Or you'll wait for news that hasn't happened yet.\""], "choices": [{"label": "Salt Lake City", "prompt": "If you go to Salt Lake City, about 90 miles from Promontory, tap 'Salt Lake City.'", "target": "s26", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "Washington at 12:47", "prompt": "If you go to Washington when its clocks say 12:47, tap 'Washington at 12:47.'", "target": "e_too_early", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}, {"label": "Washington at 2:47", "prompt": "If you go to Washington when its clocks say 2:47, tap 'Washington at 2:47.'", "target": "s28", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges"}], "bonus": [{"if": {"knows_code": true}, "text": "\"You already know DONE in dots and dashes,\" she says. \"That will help.\""}, {"if": {"knows_code": false}, "text": "\"What about the code?\" you ask. \"Somebody on Ten-Mile Day could teach you,\" she says, and winks."}]}, "s26": {"id": "s26", "page": 26, "title": "Salt Lake City", "place": "Salt Lake City, Utah Territory - May 10, 1869, just after noon", "image": "img/s26.jpg", "paragraphs": ["Thump. A wide dirt street. Snowy mountains behind the city. Your trip clock says 60 minutes.", "Flags flap from the windows. Bands wait on the corners. Up on Arsenal Hill, men stand ready by cannons.", "Salt Lake City has no railroad yet. The new tracks pass through Ogden, about forty miles north. \"People here will build their own line to Ogden,\" Dr. Finch says. \"They'll finish it in January.\"", "{bonus}", "The big new Tabernacle sits nearby. Its round roof looks like a turtle's back.", "Everyone keeps looking toward the telegraph office. Waiting."], "choices": [{"label": "Wait for the signal", "prompt": "If you wait on the street for the signal, tap 'Wait for the signal.'", "target": "g_salt_lake", "hop": false}, {"label": "Find the handcart pioneers", "prompt": "If you walked with the handcart company, look for people who walked here too. Tap 'Find the handcart pioneers.'", "target": "s27", "hop": false, "requires": {"walked_trail": true}}, {"label": "Go to the telegraph office", "prompt": "If you go to the telegraph office, tap 'Go to the telegraph office.'", "target": "s30", "hop": false}], "bonus": [{"if": {"saw_grades": true}, "text": "Many families here helped build the grade. Now they wait to hear that the railroad is done."}], "clock": 60}, "s27": {"id": "s27", "page": 27, "title": "People Who Walked", "place": "A street corner in Salt Lake City", "image": "img/s27.jpg", "paragraphs": ["You think of the trail. Of Annie. Of the squeaky wheel.", "An old woman leans on a cane. \"I pulled a handcart across the plains,\" she tells her grandson. \"It took us all summer. Now folks will come here in a few days.\"", "Is Annie here? She'd be seventeen now. You look and look. You can't tell.", "Many people in this crowd walked here, or came by wagon. They know how long that road is.", "You want to tell her that you walked too.", "Your trip clock says 50 minutes."], "choices": [{"label": "Tell her you walked too", "prompt": "If you tell her you walked with a handcart company too, tap 'Tell her you walked too.'", "target": "e_safety_return", "hop": false, "sets": {"via": "tell"}}, {"label": "Record with the crowd", "prompt": "If you stand by her and record, tap 'Record with the crowd.'", "target": "g_salt_lake", "hop": false, "sets": {"via": "handcart"}}], "clock": 50}, "s28": {"id": "s28", "page": 28, "title": "Washington, D.C.", "place": "Western Union office, Washington, D.C. - 2:40 p.m. (Washington clocks)", "image": "img/s28.jpg", "paragraphs": ["Thump. A busy telegraph office on a city corner. Washington, D.C. The wall clock says 2:40. Your trip clock says 60 minutes.", "People crowd the counter. The manager, Mr. Tinker, has hooked a bell to the wire. Every click from Utah will ring it.", "Ding, ding-ding. A clerk reads it out: \"We have got done praying. The spike is about to be presented.\"", "Chicago answers on the wire: \"We understand. All are ready in the East.\"", "Ding-ding. \"The signal will be three dots for the start of the blows.\"", "{bonus}", "Tick. Tock. You can hear the wall clock. The little bell sits on the counter, right by your hand."], "choices": [{"label": "Ring the bell yourself", "prompt": "If you ring the bell yourself to hurry things up, tap 'Ring the bell yourself.'", "target": "e_safety_return", "hop": false, "sets": {"via": "bell"}}, {"label": "Stop at three dings", "prompt": "If you stop recording as soon as the bell rings three times, tap 'Stop at three dings.'", "target": "e_too_soon", "hop": false, "sets": {"via": "bell"}}, {"label": "Record the bell", "prompt": "If you hold still by the bell and record until the very end, tap 'Record the bell.'", "target": "g_washington", "hop": false}], "bonus": [{"if": {"knows_code": true}, "text": "You know the code. Three dots will only be the start. You'll wait for D-O-N-E."}], "clock": 60}, "s29": {"id": "s29", "page": 29, "title": "The Back of the Crowd", "place": "Promontory Summit - about 12:20 p.m.", "image": "img/s29.jpg", "paragraphs": ["Coats. Hats. Elbows. That's all you can see.", "Someone is speaking up front. The wind snatches the words away. Sound spreads out as it travels. The farther away you are, the quieter it gets.", "Up on a far hill, you could see everything. But the hill is far.", "{bonus}", "Over by the engines, a band warms up. Toot. Boom.", "Your trip clock says 40 minutes."], "choices": [{"label": "Climb the far hill", "prompt": "If you climb the far hill to see everything, tap 'Climb the far hill.'", "target": "e_too_far", "hop": false}, {"label": "Climb the old grade", "prompt": "If you saw the grades in March, climb the old grade by the track. Tap 'Climb the old grade.'", "target": "s21", "hop": false, "requires": {"saw_grades": true}, "sets": {"via": "grade"}}, {"label": "Squeeze to the front", "prompt": "If you say 'excuse me' and squeeze to the front by the telegraph table, tap 'Squeeze to the front.'", "target": "s20", "hop": false}, {"label": "Follow the music", "prompt": "If you follow the sound of the band, tap 'Follow the music.'", "target": "s24", "hop": false}], "bonus": [{"if": {"saw_grades": true}, "text": "Then you spot it. A long bank of dirt runs right past the track. It's the extra grade, the one you saw them building in March! It's close, and it's high."}], "clock": 40}, "s30": {"id": "s30", "page": 30, "title": "The Telegraph Office", "place": "Telegraph office, Salt Lake City", "image": "img/s30.jpg", "paragraphs": ["Click. Clack. Click. Keys chatter all over the little office.", "At one desk sits a young woman. She's a telegraph operator. In Utah, lots of young women learned the code. They run offices on the Deseret Telegraph, a line the Latter-day Saints built.", "{bonus}", "She leans close to the sounder. Her pencil is ready.", "Your trip clock says 55 minutes."], "choices": [{"label": "Tap the key", "prompt": "If you tap the telegraph key while she listens, tap 'Tap the key.'", "target": "e_safety_return", "hop": false, "sets": {"via": "key2"}}, {"label": "Record with her", "prompt": "If you stand quietly by her desk and record, tap 'Record with her.'", "target": "g_deseret", "hop": false}], "bonus": [{"if": {"knows_code": true}, "text": "You know the code. You get ready to read along."}], "clock": 55}}, "endings": {"g_telegraph": {"id": "g_telegraph", "page": 31, "type": "GOOD", "title": "D-O-N-E", "image": "img/g_telegraph.jpg", "paragraphs": ["You press the red button. You hold the band still, the way you did with the bee.", "Leland Stanford swings. He misses the spike! THUNK. The hammer hits the tie. Thomas Durant swings next. Miss! People laugh.", "Shilling doesn't wait. Click. Click. Click. Three dots. The blows are starting!", "A railroad worker steps up. CLANG. CLANG. CLANG. The spike sinks in.", "Shilling's finger flies. Dash, dot, dot. Dot, dot. Dash, dot. Dot.", "D. O. N. E. DONE! It's 12:47.", "The crowd ROARS. Hats fly. Both engines scream their whistles. All across the country, people hear the clicks at the same moment.", "{bonus}", "The band beeps twice and brings you home. Dr. Finch listens with her eyes closed. \"That's the sound of a whole country, joined together,\" she says."], "bonus": [{"if": {"knows_code": true}, "text": "You read every letter yourself as it clicked. D-O-N-E."}, {"if": {"saw_grades": true}, "text": "You think of the grade crews you saw in March. Their work is under these rails."}, {"if": {"walked_trail": true}, "text": "You think of Annie and the squeaky wheel. Now families can ride to Utah in days."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "W. N. Shilling sent the word DONE at 12:47 p.m. on May 10, 1869. Leland Stanford and Thomas Durant both missed with their swings. The telegraph sent the news across the country in moments.", "photos": [{"src": "img/photos/russell_last_rail.jpg", "id": "russell_last_rail", "caption": "The crowd at the last rail. On the right, a man has climbed the telegraph pole.", "credit": "Andrew J. Russell. No restrictions. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Last_Rail_-_Promontory_Point._(8706011188).jpg"}, {"src": "img/photos/golden_spike.jpg", "id": "golden_spike", "caption": "The golden spike. Today it is at the Cantor Arts Center at Stanford University. (Photo from 2012.)", "credit": "Photo: Wjenning, 2012. CC BY-SA 3.0. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:The-Golden-Spike-7Oct2012.jpg"}]}}, "g_jupiter": {"id": "g_jupiter", "page": 32, "type": "GOOD", "title": "From Jupiter's Cab", "image": "img/g_jupiter.jpg", "paragraphs": ["You brace your arm on the cab window. Press. Hold still.", "Down by the gap, the hammer swings. Miss! Then a worker drives the iron spike. Clang, clang, clang. The telegraph clicks DONE.", "The crowd roars. George Booth grabs the whistle cord. WHOOOO! Across the gap, No. 119 screams back. WHOO-WHOO!", "Steam hisses. The floor shakes. Jupiter creeps forward. Slowly. Slowly. No. 119 creeps too. Closer. Closer. The two engines stop nose to nose, almost touching.", "George Booth and Sam Bradford each smash a bottle on the other's engine, the way people do when a new ship sets sail. Cheers!", "{bonus}", "The band beeps twice. Whistles, steam, and cheers are all saved. You hold on tight as it brings you home."], "bonus": [{"if": {"walked_trail": true}, "text": "You think of the handcarts. These wheels go much faster."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "Jupiter was a wood-burning engine with a big funnel smokestack. Its engineer was George Booth. After the spike, Jupiter and No. 119 rolled forward until they nearly touched.", "photos": [{"src": "img/photos/russell_workmen.jpg", "id": "russell_workmen", "caption": "Jupiter at Promontory, with its name on the side. People line the track.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:69workmen.jpg"}, {"src": "img/photos/russell_east_west.jpg", "id": "russell_east_west", "caption": "Jupiter on the left, No. 119 on the right, nose to nose.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:East_and_West_Shaking_hands_at_the_laying_of_last_rail_Union_Pacific_Railroad_-_Restoration.jpg"}]}}, "g_119": {"id": "g_119", "page": 33, "type": "GOOD", "title": "From No. 119's Cab", "image": "img/g_119.jpg", "paragraphs": ["You plant your boots on the warm cab floor. Press. Hold still.", "Through the front window, you see the hammer swing. Miss! A worker drives the spike home. DONE! The crowd roars. Sam Bradford yanks the whistle. WHOO-WHOO! Jupiter whistles back.", "Chuff. Chuff. The engines creep forward until their noses almost touch. People climb all over them, waving hats.", "Later, Jupiter backs away. Sam Bradford opens the throttle. No. 119 rolls across the spot where the rails meet. It's the very first engine to cross! Then Jupiter crosses too.", "{bonus}", "The rumble buzzes up through your boots. The band beeps twice and brings you home.", "\"A train from the East, on rails from the West,\" Dr. Finch says. \"And you rode it.\""], "bonus": [{"if": {"walked_trail": true}, "text": "You think of the handcarts and their squeaky wheels. These wheels roll on iron."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "No. 119 was a coal-burning Union Pacific engine with a tall, straight smokestack. Its engineer was Sam Bradford. It came to Promontory only because a flood had hurt a bridge.", "photos": [{"src": "img/photos/russell_east_west.jpg", "id": "russell_east_west", "caption": "No. 119 is on the right, with the tall, straight smokestack.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:East_and_West_Shaking_hands_at_the_laying_of_last_rail_Union_Pacific_Railroad_-_Restoration.jpg"}, {"src": "img/photos/russell_up_officers.jpg", "id": "russell_up_officers", "caption": "Union Pacific men at the last rail.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Laying_the_last_rail_at_Promontory_Summit_1869.jpg"}]}}, "g_crew": {"id": "g_crew", "page": 34, "type": "GOOD", "title": "The Crew Who Laid It", "image": "img/g_crew.jpg", "paragraphs": ["You stand still beside the crew and press the red button.", "The hammer swings. Miss! A worker drives the spike. DONE! The Chinese crew cheers with everyone else. They built this.", "After the ceremony, the crew pulls out the laurel tie. They slide in a plain pine tie with plain iron spikes. Souvenir hunters chop that tie to bits.", "Then J. H. Strobridge, the Central Pacific's building boss, invites the crew to eat in his railroad car. When they walk in, the guests stand and cheer.", "{bonus}", "The band beeps twice and brings you home with their cheers saved.", "\"Almost none of them are in the famous photo,\" Dr. Finch says quietly. \"But now the museum can hear them.\""], "bonus": [{"if": {"ten_mile": true}, "text": "Some of these men laid ten miles of track in one day. You saw it."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "Thousands of Chinese workers built the Central Pacific. A Chinese crew laid the last Central Pacific rail on May 10, 1869. They were almost left out of the famous photo.", "photos": [{"src": "img/photos/russell_chinese_detail.jpg", "id": "russell_chinese_detail", "caption": "A close-up of the famous photo. Two Chinese workers stand in the crowd.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Two_Chinese_Railroad_Workers_at_Golden_Spike_Ceremony.jpg"}, {"src": "img/photos/hill_last_spike.jpg", "id": "hill_last_spike", "caption": "A painting of the last spike, made twelve years later by Thomas Hill.", "credit": "Thomas Hill (painting, 1881). Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:The_Last_Spike_1869.jpg"}]}}, "g_irish": {"id": "g_irish", "page": 35, "type": "GOOD", "title": "Mauls Up!", "image": "img/g_irish.jpg", "paragraphs": ["You stand still with the crew and press the red button.", "The hammer swings. Miss! The crew hoots. They can drive a spike in three blows. Then a worker drives it. Bang. Bang. BANG. DONE!", "Up go the mauls. Up go the hats. \"HURRAH!\"", "These men laid the Union Pacific's track 1,086 miles from Omaha. The Central Pacific came 690 miles from Sacramento. Now it's one railroad.", "{bonus}", "The band beeps twice and brings you home. Dr. Finch laughs at all the shouting. \"That's what joy sounds like,\" she says."], "bonus": [{"if": {"ten_mile": true}, "text": "You think of the eight rail men on Ten-Mile Day. They worked for the other company, but they'd cheer too."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "The Union Pacific laid 1,086 miles of track from Omaha. Many of its track workers were Irish. The Central Pacific laid 690 miles from Sacramento.", "photos": [{"src": "img/photos/russell_casement.jpg", "id": "russell_casement", "caption": "A Union Pacific track crew and its work train, about 1868.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Captain_Andrew_Joseph_Russell_-_General_John_S._Casement_and_His_Outfit_-_Google_Art_Project.jpg"}, {"src": "img/photos/russell_last_rail.jpg", "id": "russell_last_rail", "caption": "The crowd at the last rail, May 10, 1869.", "credit": "Andrew J. Russell. No restrictions. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Last_Rail_-_Promontory_Point._(8706011188).jpg"}]}}, "g_camera": {"id": "g_camera", "page": 36, "type": "GOOD", "title": "Hold Still!", "image": "img/g_camera.jpg", "paragraphs": ["You tuck in behind the big camera and press the red button.", "The spike goes in. DONE flies down the wire. The crowd cheers. Then the two engines creep forward until their noses almost touch. Men climb up on them and wave.", "Two chief engineers meet in the middle. Samuel Montague of the Central Pacific. Grenville Dodge of the Union Pacific. They shake hands.", "\"HOLD STILL!\" Mr. Russell pulls the cap off the lens. Nobody breathes. One. Two. Three. Cap on.", "That's the picture. It will be called \"East and West Shaking Hands at Laying Last Rail.\" People still look at it today.", "{bonus}", "The band beeps twice and takes you home. You were there when the most famous railroad picture was made."], "bonus": [{"if": {"ten_mile": true}, "text": "Look closely at that photo someday. You can find two Chinese workers in it, but only two."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "Andrew J. Russell took this photo after the last spike. It shows the chief engineers, Samuel Montague and Grenville Dodge, shaking hands between the two engines.", "photos": [{"src": "img/photos/russell_east_west.jpg", "id": "russell_east_west", "caption": "\"East and West Shaking Hands at Laying Last Rail,\" by Andrew J. Russell.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:East_and_West_Shaking_hands_at_the_laying_of_last_rail_Union_Pacific_Railroad_-_Restoration.jpg"}, {"src": "img/photos/russell_photographer.jpg", "id": "russell_photographer", "caption": "Andrew J. Russell, the photographer.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Andrew_russell_photographer.jpg"}]}}, "g_band": {"id": "g_band", "page": 37, "type": "GOOD", "title": "Music at Promontory", "image": "img/g_band.jpg", "paragraphs": ["You stand beside the band and press the red button.", "The hammer swings. Miss! A worker drives the spike. DONE! The crowd roars, and the band blasts out a song.", "Horns shine. The big drum BOOMS. You feel it in your chest. That's sound: shaking air, shaking you.", "{bonus}", "The band beeps twice. Cheers, whistles, music: all saved. Then it takes you home.", "\"A band from Salt Lake City, at the meeting of the rails,\" Dr. Finch says. \"Lots of people from Utah helped make this day.\""], "bonus": [{"if": {"saw_grades": true}, "text": "You think of the grade crews in March. Some of their families are in this band."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "Two bands played at Promontory: an army band, and the Tenth Ward Band from Salt Lake City. Charles R. Savage, a photographer from Salt Lake City, took pictures too.", "photos": [{"src": "img/photos/savage_promontory.jpg", "id": "savage_promontory", "caption": "The crowd at the last rail, by Charles R. Savage, May 10, 1869.", "credit": "Charles R. Savage. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Promontory_Utah_10_May_1869.jpg"}, {"src": "img/photos/russell_east_west.jpg", "id": "russell_east_west", "caption": "The two engines meet.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:East_and_West_Shaking_hands_at_the_laying_of_last_rail_Union_Pacific_Railroad_-_Restoration.jpg"}]}}, "g_salt_lake": {"id": "g_salt_lake", "page": 38, "type": "GOOD", "title": "Salt Lake City Hears", "image": "img/g_salt_lake.jpg", "paragraphs": ["You press the red button and wait. The whole street is buzzing.", "A man bursts out of the telegraph office. \"It's DONE! The railroad is DONE!\"", "Flags go up. Bands strike up. On Arsenal Hill, a cannon fires. You see a puff of smoke first. Then, a moment later, BOOM! Light travels faster than sound.", "Stores close. People hug in the street. This afternoon, six or seven thousand people will pack the new Tabernacle to celebrate.", "{variant}", "{bonus}", "The band beeps twice and brings you home.", "\"Eight months from now, people here will finish their own railroad to Ogden,\" Dr. Finch says. \"Brigham Young will drive its last spike.\""], "variants": {"handcart": "The old woman who pulled a handcart wipes her eyes. \"In a few days,\" she says. \"Not a whole summer.\"", "_default": "A man next to you says his family came by wagon. It took them months. \"Now it will take days,\" he says."}, "bonus": [{"if": {"walked_trail": true}, "text": "You think of Annie, walking all day for bread and butter. Kids like her will ride the train now."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "On May 10, 1869, Salt Lake City celebrated with flags, bands, and cannons, and thousands gathered in the new Tabernacle. On January 10, 1870, the Utah Central Railroad reached the city, and Brigham Young drove its last spike.", "photos": [{"src": "img/photos/savage_tabernacle.jpg", "id": "savage_tabernacle", "caption": "The new Tabernacle in Salt Lake City, about 1867. Photo by Charles R. Savage.", "credit": "Charles R. Savage. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Mormon_Tabernacle_Salt_Lake_City,_C.R._Savage..jpg"}, {"src": "img/photos/handcart_train_1903.jpg", "id": "handcart_train_1903", "caption": "A drawing of a handcart company, from a book printed in 1903.", "credit": "History of Iowa, B. F. Gue (1903). Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Mormon_Hand-Cart_Train_-_History_of_Iowa.jpg"}, {"src": "img/photos/emigrant_train_echo.jpg", "id": "emigrant_train_echo", "caption": "Pioneers' wagons in Echo Canyon, Utah, about 1870.", "credit": "Charles W. Carter, about 1870. CC0. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Mormon_Emigrant_Train,_Echo_Canyon_MET_DP259468.jpg"}]}}, "g_deseret": {"id": "g_deseret", "page": 39, "type": "GOOD", "title": "The Operator", "image": "img/g_deseret.jpg", "paragraphs": ["You stand quietly by her desk and press the red button.", "Click. Click. Click. Three dots. The blows are starting. Her pencil waits.", "Then: dash, dot, dot. Dot, dot. Dash, dot. Dot.", "Her pencil moves. D. O. N. E.", "She jumps up. \"It's done! The railroad is DONE!\" The whole office cheers. Outside, BOOM. A cannon.", "{bonus}", "She sits right back down. Click, click-clack. She sends the news down the Deseret Telegraph to towns all over Utah.", "The band beeps twice and brings you home. \"She heard it at the same moment as Washington and New York,\" Dr. Finch says. \"That's the telegraph.\""], "bonus": [{"if": {"knows_code": true}, "text": "You read along with her pencil, letter by letter."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "Latter-day Saints built the Deseret Telegraph in Utah in the 1860s, and many young women worked as its operators. Latter-day Saint crews also built much of the railroad grade in northern Utah.", "photos": [{"src": "img/photos/russell_trestle.jpg", "id": "russell_trestle", "caption": "The Big Trestle near Promontory, built by Latter-day Saint contractors for the Union Pacific.", "credit": "Andrew J. Russell. No restrictions. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Trestle_Work_at_Prominitory_(sic)_Pt._(8706010162).jpg"}, {"src": "img/photos/savage_self.jpg", "id": "savage_self", "caption": "Charles R. Savage, the Salt Lake City photographer, later in his life.", "credit": "Charles R. Savage. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Charles_Roscoe_Savage_self-portrait.jpg"}]}}, "g_washington": {"id": "g_washington", "page": 40, "type": "GOOD", "title": "Washington Hears", "image": "img/g_washington.jpg", "paragraphs": ["You hold still by the bell and press the red button.", "Ding. Ding. Ding. Three dots. The hammer is starting! You keep your finger on the button.", "Ding-ding. Ding. The bell taps with the blows, more than two thousand miles away. Nobody breathes.", "At 2:47 by the Washington clock, the bell spells four letters. D-O-N-E. DONE!", "The room cheers. Men shake hands. At an army office nearby, General Sherman hears the same news. In New York, cannons fire one hundred times, and church bells ring.", "{bonus}", "The band beeps twice and brings you home. \"Utah to Washington, in a blink,\" Dr. Finch says. \"Electricity is fast.\""], "bonus": [{"if": {"knows_code": true}, "text": "You read the bell taps yourself. Dash, dot, dot. Dot, dot. Dash, dot. Dot."}], "on_enter": {"set": {"recording_saved": true}}, "really_there": {"title": "You were really there", "text": "In Washington, D.C., a bell in the Western Union office rang with each signal from Promontory. The word DONE arrived at 2:47 p.m., Washington time.", "photos": [{"src": "img/photos/russell_east_west.jpg", "id": "russell_east_west", "caption": "Promontory Summit, May 10, 1869.", "credit": "Andrew J. Russell. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:East_and_West_Shaking_hands_at_the_laying_of_last_rail_Union_Pacific_Railroad_-_Restoration.jpg"}, {"src": "img/photos/golden_spike.jpg", "id": "golden_spike", "caption": "The golden spike, now at Stanford University. (Photo from 2012.)", "credit": "Photo: Wjenning, 2012. CC BY-SA 3.0. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:The-Golden-Spike-7Oct2012.jpg"}]}}, "e_safety_return": {"id": "e_safety_return", "page": 41, "type": "BAD", "title": "Safety Return", "image": "img/e_safety_return.jpg", "paragraphs": ["Bzz. Bzz. Bzz. The band buzzes three times. Then everything goes white.", "You're back in the kitchen. The light on the band is amber now. It's locked for the day.", "{variant}", "Dr. Finch kneels beside you. \"You're safe,\" she says. \"And history is safe too. That's what the safety rule is for.\"", "There's no recording this time.", "What could you try differently? Watch, and keep your hands still. The band can only record a moment you leave just as it was."], "variants": {"cart": "You climbed into a handcart. Every pound mattered on that long walk. Someone would have had to pull you.", "wheel": "You picked up the hammer. That man was fixing his own family's cart. It had to be his work.", "dumpcart": "You jumped on a dump cart. Each cart had its driver and its mules, and its own job to do.", "gap": "You pushed the rails together. Those gaps had to be there, or the rails would bend in the heat.", "wirekey": "You tapped the key. Those clicks were real news of the race, going to real people.", "whistle": "You pulled the whistle. Everyone would have thought the spike was in!", "coal": "You threw coal on the fire. The fireman keeps the fire just right. Too much, and the steam pushes too hard.", "spike": "You touched the golden spike. It was going into the laurel tie, right then, in front of everyone.", "maul": "You swung the maul. A railroad maul is heavy, and the crew needed every one.", "key": "You tapped the telegraph key. The whole country was listening for Shilling's clicks, not yours.", "key2": "You tapped the key. The operator was listening for clicks from Promontory.", "drum": "You hit the drum. The band was waiting for its leader's signal.", "tell": "You told her about the trail. But you're a girl from the future. That would change her story.", "bell": "You rang the bell. Everyone would have thought the spike was in!", "_default": "You tried to change what really happened."}}, "e_out_of_charges": {"id": "e_out_of_charges", "page": 42, "type": "BAD", "title": "Out of Charges", "image": "img/e_out_of_charges.jpg", "paragraphs": ["Press. Nothing. Press again. Nothing. All three dots are dark.", "Then a small light blinks: backup power. The band hums and brings you home.", "\"Every trip used a charge,\" Dr. Finch says. \"And now they're all gone, before we got the recording.\"", "She plugs the band in. It will take a whole day to charge.", "What could you try differently? Every trip used a charge. Which trips mattered most for the mission?"]}, "e_in_photo": {"id": "e_in_photo", "page": 43, "type": "BAD", "title": "In the Picture", "image": "img/e_in_photo.jpg", "paragraphs": ["You run out in front of the big camera and wave. Hi!", "Bzz. Bzz. Bzz. Everything goes white.", "Back home, Dr. Finch shakes her head and smiles. \"That lens stays open for a few seconds,\" she says. \"You would have been a little blur in a famous photo. A girl who was never there. People would wonder about her for a hundred and fifty years!\"", "There's no recording this time.", "What could you try differently? Where could you stand to watch the picture being made, without being in it?"]}, "e_wrong_day": {"id": "e_wrong_day", "page": 44, "type": "BAD", "title": "The Wrong Day", "image": "img/e_wrong_day.jpg", "paragraphs": ["Thump. Promontory Summit, May 8, 1869. That's the date on the golden spike. You get ready.", "Nothing happens.", "There's still a gap in the track. And the Union Pacific's big train is stuck far away in Wyoming. Workers who hadn't been paid chained the boss's railroad car to the track. Heavy rain hurt a bridge in Weber Canyon, too.", "The ceremony moves to May 10. You wait and wait. Then your trip clock runs out, and the band brings you home.", "What could you try differently? The date on the golden spike was the plan. Which day did it really happen?"]}, "e_wrong_place": {"id": "e_wrong_place", "page": 45, "type": "BAD", "title": "The Wrong Promontory", "image": "img/e_wrong_place.jpg", "paragraphs": ["Thump. You land on rocks at the edge of the Great Salt Lake. Gulls cry. Waves splash. The air smells salty.", "No railroad. No engines. No crowd. Only birds.", "This is Promontory Point, the tip of the land. The railroad is far to the north, up at the summit.", "Your trip clock runs out, and the band brings you home.", "What could you try differently? The railroad climbed up to the top. What's another word for the top of a climb?"]}, "e_steam": {"id": "e_steam", "page": 46, "type": "BAD", "title": "Lost in the Steam", "image": "img/e_steam.jpg", "paragraphs": ["{variant}", "WHOOSH! A hot, white cloud bursts out all around you.", "Steam is water so hot it turns into gas. When it hits the cool band, it turns back into tiny drops. The band's lens fogs up. All you can see is white.", "The band can't see a thing. It can't record. It brings you home, damp and blinking.", "What could you try differently? Steam is very wet. Where could you watch from, away from the puffs?"], "variants": {"wheels": "You stand by Jupiter's big front wheels and press record. Just as the hammer goes up, the engineer opens little valves to let water out.", "arrive": "You run right up to Jupiter as it hisses to a stop. The engineer opens little valves to let water out.", "_default": "You stand close to the engine. The engineer opens little valves to let water out."}}, "e_time_up": {"id": "e_time_up", "page": 47, "type": "BAD", "title": "Time's Up", "image": "img/e_time_up.jpg", "paragraphs": ["Beep. Beep. Beep. The trip clock says zero.", "{variant}", "The band hums and brings you home, before the big moment.", "\"The band can only stay one hour,\" Dr. Finch says. \"It keeps you safe. But it doesn't wait.\"", "There's no recording this time.", "What could you try differently? The band can only stay one hour. How could you get there closer to the moment?"], "variants": {"camp": "The fire was warm. The camp was quiet. Your eyes closed, and the clock ran out.", "tenmile": "The track kept growing, mile after mile. But the day had twelve hours, and your clock had one.", "jupiter": "Jupiter hissed. The crowd grew. The laurel tie came out, and Shilling sat down at his table. Then the clock ran out. The spike was still forty minutes away.", "_default": "You waited too long."}}, "e_too_early": {"id": "e_too_early", "page": 48, "type": "BAD", "title": "Too Early in Washington", "image": "img/e_too_early.jpg", "paragraphs": ["Thump. The Washington telegraph office. The wall clock says 12:47.", "But nothing is happening. Clerks read papers. A man yawns.", "The sun reaches Washington first. When Washington's clocks say 12:47, Utah's clocks say only about 10:47 in the morning. The ceremony hasn't even started. The news won't come for two more hours.", "Your trip clock runs out, and the band brings you home.", "What could you try differently? The sun reaches the East first. When the news came, were Washington's clocks ahead or behind?"]}, "e_too_far": {"id": "e_too_far", "page": 49, "type": "BAD", "title": "Too Far Away", "image": "img/e_too_far.jpg", "paragraphs": ["You climb and climb. From the top of the hill, you see everything: the engines, the crowd, the little table.", "You press record. Far below, the hammer swings. The crowd jumps and waves.", "But up here, the sound is tiny. Sound spreads out as it travels, and it gets quieter. The wind whooshes past the band. You can't hear a single click.", "The recording is mostly wind. The band brings you home.", "What could you try differently? Sound gets quieter far away. How could you get closer?"]}, "e_blast": {"id": "e_blast", "page": 50, "type": "BAD", "title": "Stand Clear!", "image": "img/e_blast.jpg", "paragraphs": ["You run up the hill toward the fuse. Hssss. It's getting shorter!", "\"STAND CLEAR!\" A man waves both arms at you.", "Bzz. Bzz. Bzz. The band's safety rule doesn't only protect history. It protects you, too. Everything goes white.", "Back in the kitchen, you can still hear a faraway BOOM in your head. Black powder burns very fast and makes a huge push of gas. That push breaks rock.", "\"Blasting is for grown-ups who know the rules,\" Dr. Finch says.", "What could you try differently? Where else could you watch the workers, safely?"]}, "e_too_soon": {"id": "e_too_soon", "page": 51, "type": "BAD", "title": "Too Soon!", "image": "img/e_too_soon.jpg", "paragraphs": ["{variant}", "The band thinks you're finished. It brings you home.", "Dr. Finch plays the recording. Click. Click. Click. Then nothing.", "\"Three dots meant the blows were STARTING,\" Dr. Finch says gently. \"Next came the hammer. Then DONE. You stopped just before the best part.\"", "There's no DONE on this recording.", "What could you try differently? Three dots were the signal to start. Which word were you waiting for?"], "variants": {"table": "By the table, Shilling's key goes click, click, click. Three dots! You let go of the red button. Got it!", "bell": "In Washington, the little bell goes ding, ding, ding. Three dots! You let go of the red button. Got it!", "_default": "Click, click, click. Three dots! You let go of the red button. Got it!"}}}};
/* Narration: AUDIO[clipKey] = {src, dur, words:[[startSec,endSec], ...]} (one pair per displayed word in that clip).
   Clip keys: "<page>.s<n>" plain text runs, "<page>.v.<via>" variants, "<page>.b<i>" extra lines, "<page>.c<i>" conditional prompts.
   AUDIO_DATA (single-file build only) maps src -> base64 mp3. */
var AUDIO = {};
var AUDIO_DATA = null;
</script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var S = STORY, synth = window.speechSynthesis;
  var KEY = S.storage_key || "moonAdventure.v1.", FOUND = KEY + "found", SAVE = KEY + "state";
  var els = { pic: $("pic"), picwrap: $("picwrap"), pdots: $("pdots"), where: $("where"), title: $("title"), banner: $("banner"),
    text: $("text"), choices: $("choices"), read: $("read"), note: $("note"), scroller: $("scroller"), oxy: $("oxy"),
    oxyfill: $("oxyfill"), oxymin: $("oxymin"), backTop: $("backTop"), toptitle: $("toptitle"), big: $("bigplay"), pcredit: $("pcredit"), oxylbl: $("oxylbl") };
  var METER = S.meter || { short: "O\u2082", label: "Oxygen", max: 60, flag: "oxygen_min", field: "oxygen" };
  if (els.oxylbl) els.oxylbl.textContent = METER.short;
  if (els.oxy) els.oxy.setAttribute("aria-label", METER.label);
  if (S.title) document.title = S.title;

  // ---------------- state ----------------
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function freshFlags() { var f = clone(S.flags); f.via = null; return f; }
  var st = { at: S.start, flags: freshFlags(), history: [] };
  try { var sv = JSON.parse(localStorage.getItem(SAVE) || "null"); if (sv && sv.at && pageExists(sv.at)) st = sv; } catch (e) {}
  function save() { try { localStorage.setItem(SAVE, JSON.stringify(st)); } catch (e) {} }
  function found() { try { return JSON.parse(localStorage.getItem(FOUND) || "[]"); } catch (e) { return []; } }
  function markFound(id) { var f = found(); if (f.indexOf(id) < 0) { f.push(id); try { localStorage.setItem(FOUND, JSON.stringify(f)); } catch (e) {} } }
  function pageExists(id) { return !!(S.scenes[id] || S.endings[id] || (id.indexOf("photo:") === 0 && S.endings[id.slice(6)])); }

  function matches(cond) { for (var k in cond) if ((st.flags[k] || false) !== cond[k]) return false; return true; }
  function applySets(sets) { for (var k in (sets || {})) st.flags[k] = sets[k]; }
  function enter(id) {
    var p = S.scenes[id] || S.endings[id];
    if (p && p.on_enter) {
      applySets(p.on_enter.set);
      (p.on_enter.gain || []).forEach(function (g) { st.flags[g] = true; });
    }
    if (p && p[METER.field] != null) st.flags[METER.flag] = p[METER.field];
    st.at = id;
  }
  function choose(c) {
    stopReading();
    st.history.push({ at: st.at, flags: clone(st.flags) });
    var target = c.target;
    if (c.hop) {
      if ((st.flags.charges || 0) <= 0) target = c.if_no_charges || "e_out_of_charges";
      else st.flags.charges -= (c.cost && c.cost.charges) || 1;
    }
    applySets(c.sets);
    enter(target);
    render();
  }
  function backToChoice() {
    stopReading();
    var h = st.history.pop();
    if (!h) { startOver(); return; }
    st.at = h.at; st.flags = h.flags; render();
  }
  function startOver() { stopReading(); st = { at: S.start, flags: freshFlags(), history: [] }; enter(S.start); render(); }

  // ---------------- text building ----------------
  // Each displayed paragraph carries a clip key. Must mirror audio/plan.py page_items().
  function keyer(pid) {
    var run = 0, open = false;
    return {
      stat: function () { open = true; return pid + ".s" + run; },
      brk: function () { if (open) run++; open = false; }
    };
  }
  function fill(list, page, pid, kz) {
    page.paragraphs.forEach(function (t) {
      if (t === "{variant}") {
        kz.brk();
        var v = page.variants || {}, has = st.flags.via != null && v[st.flags.via] != null, line = has ? v[st.flags.via] : v._default;
        if (line) list.push({ t: line, k: pid + ".v." + (has ? st.flags.via : "_default") });
      } else if (t === "{bonus}") {
        kz.brk();
        (page.bonus || []).forEach(function (b, i) { if (matches(b["if"])) list.push({ t: b.text, k: pid + ".b" + i }); });
      } else {
        list.push({ t: t, cls: /^What could you try differently\?/.test(t) ? "tryagain" : "", k: kz.stat() });
      }
    });
    return list;
  }

  var paras = [], words = [], pageId = null, photos = [], photoIdx = 0;
  function setPic(src, alt) {
    els.pic.classList.add("fade");
    var img = new Image();
    img.onload = img.onerror = function () { els.pic.src = src; $("picbg").src = src; els.pic.alt = alt || ""; els.pic.classList.remove("fade"); };
    img.src = src;
  }
  function showPhoto(i) {
    photoIdx = (i + photos.length) % photos.length;
    setPic(photos[photoIdx].src, photos[photoIdx].caption);
    if (els.pcredit) { els.pcredit.textContent = photos[photoIdx].credit ? "Photo: " + photos[photoIdx].credit : ""; els.pcredit.style.display = photos[photoIdx].credit ? "block" : "none"; }
    var d = els.pdots.children; for (var k = 0; k < d.length; k++) d[k].classList.toggle("on", k === photoIdx);
  }
  $("pprev").onclick = function () { showPhoto(photoIdx - 1); };
  $("pnext").onclick = function () { showPhoto(photoIdx + 1); };

  function button(label, cls, fn, cost) {
    var b = document.createElement("button");
    b.className = "choice " + (cls || ""); b.type = "button";
    var s = document.createElement("span"); s.textContent = label; b.appendChild(s);
    if (cost) { var c = document.createElement("span"); c.className = "cost"; c.textContent = cost; b.appendChild(c); }
    b.onclick = fn; els.choices.appendChild(b); return b;
  }

  function render() {
    stopReading();
    var id = st.at; pageId = id;
    var isPhoto = id.indexOf("photo:") === 0;
    var page = isPhoto ? S.endings[id.slice(6)] : (S.scenes[id] || S.endings[id]);
    var isEnd = !isPhoto && !!S.endings[id];
    els.choices.innerHTML = ""; els.banner.className = ""; els.banner.textContent = "";
    els.picwrap.classList.remove("multi"); els.pdots.innerHTML = ""; photos = []; if (els.pcredit) els.pcredit.style.display = "none";
    var list = [];
    if (isPhoto) {
      var rt = page.really_there;
      els.where.textContent = S.photo_where || "Real photos from NASA";
      els.title.textContent = rt.title;
      els.banner.className = "photo"; els.banner.textContent = "\uD83D\uDCF7 This really happened";
      list.push({ t: rt.text, k: id + ".s0" });
      rt.photos.forEach(function (ph, i) { list.push({ t: "Photo " + (i + 1) + ". " + ph.caption, cls: "cap", k: id + ".s0" }); });
      photos = rt.photos;
      if (photos.length > 1) { els.picwrap.classList.add("multi"); photos.forEach(function () { els.pdots.appendChild(document.createElement("span")); }); }
      showPhoto(0);
    } else {
      els.where.textContent = page.place || (isEnd ? (page.type === "GOOD" ? "A good ending" : "Not this time") : "");
      els.title.textContent = page.title;
      setPic(page.image, page.title);
      var kz = keyer(id);
      list = fill(list, page, id, kz);
      if (isEnd) {
        markFound(id);
        if (page.type === "GOOD") { els.banner.className = "good"; els.banner.textContent = "\u2B50 You did it! Recording saved."; }
        else { els.banner.className = "bad"; els.banner.textContent = "No recording this time"; }
      }
    }
    // choices
    if (!isEnd && !isPhoto) {
      list.push({ t: "What do you do, Evelyn?", cls: "ask", k: kz.stat() });
      page.choices.forEach(function (c, ci) {
        var key;
        if (c.requires) { kz.brk(); key = id + ".c" + ci; if (!matches(c.requires)) return; }
        else key = kz.stat();
        list.push({ t: c.prompt, cls: "prompt", k: key });
        button(c.label, c.hop ? "" : "alt", function () { userTapped = true; choose(c); }, c.hop ? "uses 1 charge" : "");
      });
    } else {
      if (isEnd && page.type === "GOOD" && page.really_there) button("You were really there \u27A1", "photo", function () { userTapped = true; stopReading(); st.at = "photo:" + id; render(); });
      button("\u21B6 Back to my last choice", "home", function () { userTapped = true; backToChoice(); });
      button("\u27F2 Start over", "home", function () { userTapped = true; startOver(); });
    }
    // words
    paras = list; words = [];
    els.text.innerHTML = "";
    var gi = 0;
    list.forEach(function (p, pi) {
      var el = document.createElement("p"); if (p.cls) el.className = p.cls;
      var arr = [], re = /\S+/g, m, last = 0, t = p.t;
      while ((m = re.exec(t))) {
        if (m.index > last) el.appendChild(document.createTextNode(t.slice(last, m.index)));
        var s = document.createElement("span"); s.className = "w"; s.textContent = m[0];
        s.dataset.p = pi; s.dataset.w = arr.length; s.dataset.i = gi++;
        el.appendChild(s); arr.push({ start: m.index, end: m.index + m[0].length, el: s });
        last = m.index + m[0].length;
      }
      if (last < t.length) el.appendChild(document.createTextNode(t.slice(last)));
      words.push(arr); els.text.appendChild(el);
    });
    // header
    var dots = document.querySelectorAll("#charges .c");
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("on", i < (st.flags.charges || 0));
    var showOxy = !isPhoto && !isEnd && page[METER.field] != null;
    els.oxy.classList.toggle("show", showOxy);
