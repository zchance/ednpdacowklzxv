<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c3a4a">
<title>Ollie the Octopus and the Eighth Sock</title>
<style>
:root{--bg:#0c3a4a;--panel:#fbf6ec;--ink:#24211c;--accent:#e8a33d;--good:#2f8f5b;--muted:#7b7266;--hl:#ffe08a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#top{flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;background:#0a2a36;color:#fff;min-height:56px}
#top .t{flex:1;font-size:18px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:#1a5a6e;color:#fff;border:0;border-radius:12px;font-size:22px;min-width:48px;height:48px;cursor:pointer}
.iconbtn:disabled{opacity:.35}
#bigplay{min-width:64px;width:64px;height:64px;border-radius:50%;font-size:26px;background:#2f8f5b;color:#fff;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.35);letter-spacing:-3px;line-height:1;padding:0}
#bigplay[data-state=playing]{background:#e8a33d;color:#2a1b05}
#bigplay:active{transform:translateY(2px)}
#picwrap{flex:none;position:relative;background:#000;height:min(46vh,calc(100vw*0.75));display:flex;justify-content:center;align-items:center;overflow:hidden}
#picwrap img{max-width:100%;max-height:100%;object-fit:contain;display:block;transition:opacity .25s;position:relative}
#picwrap #picbg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);max-width:none;max-height:none;object-fit:cover;filter:blur(22px) brightness(.55)}
#picwrap img.fade{opacity:0}
#pdots{position:absolute;bottom:8px;left:0;right:0;text-align:center}
#pdots span{display:inline-block;width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.4);margin:0 3px;box-shadow:0 0 2px rgba(0,0,0,.6)}
#pdots span.on{background:#fff}
#scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel)}
#page{max-width:900px;margin:0 auto;padding:18px 22px 40px}
#where{font-size:16px;color:var(--muted);margin:2px 0 4px}
h1{font-size:30px;margin:0 0 10px;line-height:1.2}
#booktitle{display:none;font-size:clamp(28px,4vw,38px);color:#8a3b12;margin:0 0 6px}
#text p{font-size:clamp(23px,3.1vw,30px);line-height:1.6;margin:0 0 .8em}
#text em{font-style:italic}
#text b{font-weight:800}
.w{border-radius:6px;padding:0 1px;transition:background .12s;cursor:pointer}
.w.cur{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
#readbar{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.btn{font:inherit;font-size:22px;border:0;border-radius:16px;padding:14px 20px;cursor:pointer;min-height:60px}
#read{background:#2f5f9f;color:#fff;min-width:210px}
#read[data-state=playing]{background:#1f7a52}
#speedbox{display:flex;flex-direction:column;justify-content:center;font-size:16px;color:var(--muted);min-width:180px;flex:1;max-width:320px}
#speedbox input{width:100%;height:36px;accent-color:#2f5f9f}
#nav{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
.choice{font:inherit;font-size:clamp(22px,3vw,28px);font-weight:700;border:0;border-radius:18px;padding:16px 22px;min-height:72px;cursor:pointer;background:var(--accent);color:#2a1b05;box-shadow:0 4px 0 #b97b1f;flex:1;min-width:200px}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 #b97b1f}
.choice.home{background:#e9e1d3;color:#2a2318;box-shadow:0 4px 0 #b8ab95}
.choice[hidden]{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
#modal.show{display:flex}
#card{background:#fff;border-radius:18px;max-width:640px;width:92vw;max-height:88vh;overflow:auto;padding:20px 22px}
#card h2{margin:0 0 6px}
#card label.chk{display:flex;gap:10px;align-items:center;font-size:17px;margin:12px 0}
#card label.chk input{width:26px;height:26px}
#card .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#card .row .btn{font-size:18px;min-height:50px;padding:10px 16px;background:#eee}
#card ol{padding-left:24px;font-size:17px;columns:2}
#card ol li{padding:3px 0;cursor:pointer;color:#2f5f9f;break-inside:avoid}
@media (orientation:landscape) and (max-height:700px){#picwrap{height:42vh}}
@media (max-width:560px){#top{gap:6px;padding:6px 8px}#top .t{font-size:15px}#card ol{columns:1}}
</style>
</head>

s look good on you.\""]}, {"id": "p08", "title": "The Tickle Arm", "place": "The bottom of the sea", "image": "img/p08.jpg", "paragraphs": ["So Ollie had an idea. He took his eighth arm and he wiggled it. He wiggled it up. He wiggled it down. \"This one can be my tickle arm,\" he said. \"It doesn't need a sock.\""]}, {"id": "p09", "title": "Bubbles!", "place": "The bottom of the sea", "image": "img/p09.jpg", "paragraphs": ["And he tickled Pip right on the tummy. Pip laughed so hard that she blew bubbles out of her nose, and the sock hat popped right off her head and landed on the grumpy shrimp."]}, {"id": "p10", "title": "Actually, I Like It", "place": "The sunken boot", "image": "img/p10.jpg", "paragraphs": ["The shrimp looked at the sock. He looked at Ollie. Then he said, \"Actually, I like it,\" and he went back into his boot to take a nap, all snuggled up."]}, {"id": "p11", "title": "Seven Socks Every Day", "place": "The bottom of the sea", "image": "img/p11.jpg", "paragraphs": ["From then on, Ollie wore seven socks every day. Pip came by every morning to get tickled. And if you ever go to the bottom of the sea and see a sunken boot, be very quiet, because there's a shrimp in there napping in a sock.", "**The end.**"]}]};

  function mark(i) {
    if (hl && +hl.dataset.i === i) return;
    if (hl) hl.classList.remove("cur");
    hl = i >= 0 ? words[i] : null;
    if (hl) {
      hl.classList.add("cur");
      var sr = $("scroller"), r = hl.getBoundingClientRect(), b = sr.getBoundingClientRect();
      if (r.bottom > b.bottom - 40 || r.top < b.top + 10) sr.scrollTo({ top: sr.scrollTop + (r.top - b.top) - b.height * 0.3, behavior: "smooth" });
    }
  }
  function tick() {
    var t = audioEl.currentTime, idx = -1;
    for (var i = 0; i < times.length; i++) { if (times[i][0] <= t + 0.03) idx = i; else break; }
    mark(idx);
    if (playing) raf = requestAnimationFrame(tick);
  }
  function play(fromWord) {
    if (!audioEl.src) return;
    if (fromWord != null && times[fromWord]) audioEl.currentTime = Math.max(0, times[fromWord][0] - 0.05);
    audioEl.playbackRate = speed;
    var pr = audioEl.play();
    playing = true; paused = false; setUI(); cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
    if (pr && pr.catch) pr.catch(function () { playing = false; setUI(); });
  }
  function pause() { audioEl.pause(); playing = false; paused = true; cancelAnimationFrame(raf); setUI(); }
  function stop(silent) { audioEl.pause(); playing = false; paused = false; cancelAnimationFrame(raf); mark(-1); try { audioEl.currentTime = 0; } catch (e) {} if (!silent) setUI(); }
  function toggle() { if (playing) pause(); else if (paused) play(); else play(0); }
  audioEl.addEventListener("ended", function () {
    playing = false; paused = false; cancelAnimationFrame(raf); mark(-1); setUI();
    if (auto && at < N - 1) setTimeout(function () { go(at + 1, true); }, 900);
  });
  audioEl.addEventListener("canplay", function () { if (wantPlayOnLoad) { wantPlayOnLoad = false; play(0); } });
  function go(i, andPlay) { at = Math.max(0, Math.min(N - 1, i)); render(); if (andPlay) { if (audioEl.readyState >= 3) play(0); else wantPlayOnLoad = true; } }
  big.onclick = toggle; read.onclick = toggle;
  $("text").addEventListener("click", function (e) { var t = e.target.closest ? e.target.closest(".w") : null; if (t) play(+t.dataset.i); });
  $("nextBtn").onclick = function () { go(at + 1, playing || auto && (playing || paused)); };
  $("prevBtn").onclick = $("backTop").onclick = function () { go(at - 1, false); };
  $("againBtn").onclick = function () { go(0, false); };
  $("speed").value = speed;
  $("speed").oninput = function () { speed = parseFloat(this.value); audioEl.playbackRate = speed; ls("speed", String(speed)); setUI(); };
  $("auto").checked = auto; $("auto").onchange = function () { auto = this.checked; ls("auto", auto ? "1" : "0"); };
  function openMenu() {
    var ol = $("pageList"); ol.innerHTML = "";
    S.scenes.forEach(function (sc, i) { var li = document.createElement("li"); li.textContent = sc.title; li.onclick = function () { $("modal").classList.remove("show"); go(i, false); }; ol.appendChild(li); });
    $("modal").classList.add("show");
  }
  $("menuBtn").onclick = openMenu;
  $("mClose").onclick = function () { $("modal").classList.remove("show"); };
  $("mStart").onclick = function () { $("modal").classList.remove("show"); go(0, false); };
  $("modal").onclick = function (e) { if (e.target === this) this.classList.remove("show"); };
  document.addEventListener("keydown", function (e) {
    if ($("modal").classList.contains("show")) return;
    var tg = e.target && e.target.tagName; if (tg === "INPUT" || tg === "SELECT") return;
    if (e.code === "Space" || e.key === " " || e.key === "MediaPlayPause") { e.preventDefault(); toggle(); }
    else if (e.key === "ArrowRight") go(at + 1, false); else if (e.key === "ArrowLeft") go(at - 1, false);
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden && playing) pause(); });
  window.ReadAlong = { toggle: toggle, go: go, state: function () { return { at: at, playing: playing, paused: paused, t: audioEl.currentTime, src: audioEl.currentSrc, cur: hl ? +hl.dataset.i : -1, ready: audioEl.readyState }; } };
  render();
})();
