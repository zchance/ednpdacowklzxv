 mud puddle", "image": "img/p07.jpg", "paragraphs": ["The pig looked at him. \"Are you a chicken now?\"", "\"Not yet,\" said Gilbert, with mud on his nose."]}, {"id": "p08", "title": "Plop!", "place": "The nest", "image": "img/p08.jpg", "paragraphs": ["He went back to the nest and tried again. He sat. He scrunched. He waited. And then he heard something go *plop!*", "Gilbert jumped up. There, in the nest, was an egg! A real egg!", "\"I did it!\" Gilbert yelled. \"I'm a chicken!\""]}, {"id": "p09", "title": "That One's Mine", "place": "The hen house", "image": "img/p09.jpg", "paragraphs": ["Then Penny the hen stepped out from behind him, looking very proud of herself. \"Actually,\" she said, \"that one's mine. I sneaked it in there while you were scrunching.\"", "Gilbert looked at the egg. He looked at Penny. And then he laughed so hard that his beard wiggled."]}, {"id": "p10", "title": "What Gilbert Can Do", "place": "The farmyard", "image": "img/p10.jpg", "paragraphs": ["\"You know what?\" said Penny. \"You don't have to be a chicken. You're the only one on this farm who can climb all the way up to the top of the barn.\""]}, {"id": "p11", "title": "Good Morning, Farm!", "place": "The top of the barn", "image": "img/p11.jpg", "paragraphs": ["So that's what Gilbert did. Every morning after that, he climbed to the very top of the barn and shouted \"Good morning!\" to the whole farm. The hens laid their eggs, and Penny always saved one special egg for him to look at. Just to look at, not to eat. Goats don't eat eggs.", "**The end.**"]}]};

        else if (t[0] === "*") { html += ital ? "</em>" : "<em>"; ital = !ital; t = t.slice(1); }
        else { var m = t.match(/^[^*]+/)[0]; html += esc(m); t = t.slice(m.length); }
      }
      out.push('<span class="w" data-i="' + (base + n) + '">' + html + "</span>"); n++;
    });
    return { html: out.join(""), n: n };
  }
  function render() {
    stop(true);
    var sc = S.scenes[at];
    $("booktitle").style.display = at === 0 ? "block" : "none"; $("booktitle").textContent = S.title;
    $("where").textContent = sc.place || ""; $("title").textContent = sc.title;
    $("toptitle").textContent = "Page " + (at + 1) + " of " + N;
    pic.classList.add("fade");
    var im = new Image(); im.onload = im.onerror = function () { pic.src = sc.image; $("picbg").src = sc.image; pic.alt = sc.title; pic.classList.remove("fade"); }; im.src = sc.image;
    var dots = $("pdots"); dots.innerHTML = ""; for (var k = 0; k < N; k++) { var d = document.createElement("span"); if (k === at) d.className = "on"; dots.appendChild(d); }
    var html = "", base = 0;
    sc.paragraphs.forEach(function (p) { var r = paraHTML(p, base); html += "<p>" + r.html + "</p>"; base += r.n; });
    $("text").innerHTML = html;
    words = [].slice.call(document.querySelectorAll("#text .w"));
    var a = AUDIO[sc.id]; times = a ? a.words : [];
    var s = srcOf(sc); audioEl.src = s || ""; audioEl.playbackRate = speed;
    $("prevBtn").hidden = at === 0; $("backTop").disabled = at === 0;
    $("nextBtn").hidden = at === N - 1; $("againBtn").hidden = at !== N - 1; if ($("booksBtn")) $("booksBtn").hidden = at !== N - 1;
    $("scroller").scrollTop = 0;
    ls("page", String(at));
    setUI();
  }
  function setUI() {
    var st = playing ? "playing" : "idle";
    big.dataset.state = st; read.dataset.state = st;
    big.innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
    big.title = big.ariaLabel = playing ? "Pause" : "Play (read to me)";
    read.innerHTML = playing ? "&#9208;&#65039; Pause" : (paused ? "&#9654; Keep reading" : "&#9654; Read to me");
    $("speedVal").textContent = speed.toFixed(2).replace(/0$/, "") + "x";
  }
  function mark(i) {
    if (hl && +hl.dataset.i === i) return;
    if (hl) hl.classList.remove("cur");
    hl = i >= 0 ? words[i] : null;
    if (hl) {
      hl.classList.add("cur");
      var sr = $("scroller"), r = hl.getBoundingClientRect(), b = sr.getBoundingClientRect();
      if (r.bottom > b.bottom - 40 || r.top < b.top + 10) sr.scrollTo({ top: sr.scrollTop + (r.top - b.top) - b.height * 0.3, behavior: "smooth" });
    }
  }
  function tick() {
    var t = audioEl.currentTime, idx = -1;
    for (var i = 0; i < times.length; i++) { if (times[i][0] <= t + 0.03) idx = i; else break; }
    mark(idx);
    if (playing) raf = requestAnimationFrame(tick);
  }
  function play(fromWord) {
    if (!audioEl.src) return;
    if (fromWord != null && times[fromWord]) audioEl.currentTime = Math.max(0, times[fromWord][0] - 0.05);
    audioEl.playbackRate = speed;
    var pr = audioEl.play();
    playing = true; paused = false; setUI(); cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
    if (pr && pr.catch) pr.catch(function () { playing = false; setUI(); });
  }
  function pause() { audioEl.pause(); playing = false; paused = true; cancelAnimationFrame(raf); setUI(); }
  function stop(silent) { audioEl.pause(); playing = false; paused = false; cancelAnimationFrame(raf); mark(-1); try { audioEl.currentTime = 0; } catch (e) {} if (!silent) setUI(); }
  function toggle() { if (playing) pause(); else if (paused) play(); else play(0); }
  audioEl.addEventListener("ended", function () {
    playing = false; paused = false; cancelAnimationFrame(raf); mark(-1); setUI();
    if (auto && at < N - 1) setTimeout(function () { go(at + 1, true); }, 900);
  });
  audioEl.addEventListener("canplay", function () { if (wantPlayOnLoad) { wantPlayOnLoad = false; play(0); } });
  function go(i, andPlay) { at = Math.max(0, Math.min(N - 1, i)); render(); if (andPlay) { if (audioEl.readyState >= 3) play(0); else wantPlayOnLoad = true; } }
  big.onclick = toggle; read.onclick = toggle;
  $("text").addEventListener("click", function (e) { var t = e.target.closest ? e.target.closest(".w") : null; if (t) play(+t.dataset.i); });
  $("nextBtn").onclick = function () { go(at + 1, playing || auto && (playing || paused)); };
  $("prevBtn").onclick = $("backTop").onclick = function () { go(at - 1, false); };
  $("againBtn").onclick = function () { go(0, false); };
  $("speed").value = speed;
  $("speed").oninput = function () { speed = parseFloat(this.value); audioEl.playbackRate = speed; ls("speed", String(speed)); setUI(); };
  $("auto").checked = auto; $("auto").onchange = function () { auto = this.checked; ls("auto", auto ? "1" : "0"); };
  function openMenu() {
    var ol = $("pageList"); ol.innerHTML = "";
    S.scenes.forEach(function (sc, i) { var li = document.createElement("li"); li.textContent = sc.title; li.onclick = function () { $("modal").classList.remove("show"); go(i, false); }; ol.appendChild(li); });
    $("modal").classList.add("show");
  }
  $("menuBtn").onclick = openMenu;
  $("mClose").onclick = function () { $("modal").classList.remove("show"); };
  $("mStart").onclick = function () { $("modal").classList.remove("show"); go(0, false); };
  $("modal").onclick = function (e) { if (e.target === this) this.classList.remove("show"); };
  document.addEventListener("keydown", function (e) {
    if ($("modal").classList.contains("show")) return;
    var tg = e.target && e.target.tagName; if (tg === "INPUT" || tg === "SELECT") return;
    if (e.code === "Space" || e.key === " " || e.key === "MediaPlayPause") { e.preventDefault(); toggle(); }
    else if (e.key === "ArrowRight") go(at + 1, false); else if (e.key === "ArrowLeft") go(at - 1, false);
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden && playing) pause(); });
  window.ReadAlong = { toggle: toggle, go: go, state: function () { return { at: at, playing: playing, paused: paused, t: audioEl.currentTime, src: audioEl.currentSrc, cur: hl ? +hl.dataset.i : -1, ready: audioEl.readyState }; } };
  render();
})();

</script>
