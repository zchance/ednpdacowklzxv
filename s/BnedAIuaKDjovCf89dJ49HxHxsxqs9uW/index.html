d.\"", "Evelyn sets the bent glider on the porch. \"Next time, I will keep it light,\" she says."], "choices": [{"label": "Go to the TimeBand map", "prompt": "If you want to go to the TimeBand map, tap 'Go to the TimeBand map'.", "target": "s06", "icon": "band"}]}, "s05": {"id": "s05", "page": 5, "title": "Whoosh!", "place": "The garden", "image": "img/s05.jpg", "paragraphs": ["Evelyn throws the light glider. Whoosh!", "It floats over the grass. It glides past the beehive. It lands soft as a leaf by the sunflowers.", "\"Light things are easy to lift,\" says Dr. Finch. \"The Wright brothers made their plane as light as they could.\"", "Evelyn puts the glider in her pocket. \"I will take it with me,\" she says."], "choices": [{"label": "Go to the TimeBand map", "prompt": "If you want to go to the TimeBand map, tap 'Go to the TimeBand map'.", "target": "s06", "icon": "band"}]}, "s06": {"id": "s06", "page": 6, "title": "The TimeBand Map", "place": "Evelyn's backyard", "image": "img/s06.jpg", "paragraphs": ["Evelyn taps the band. A map lights up on the little screen. There are two blinking pins.", "\"This pin is Dayton, in Ohio,\" says Dr. Finch. \"That is the brothers' bike shop. They built bikes there. They built parts of their plane there too.\"", "\"This pin is Kitty Hawk, by the sea,\" she says. \"That is where they flew.\"", "\"A side trip to the bike shop uses one dot,\" she says. \"Then you will have fewer dots left.\"", "Where should Evelyn go?"], "choices": [{"label": "Side trip to the bike shop", "prompt": "If you want to side trip to the bike shop, tap 'Side trip to the bike shop'.", "target": "s07", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges", "icon": "bike"}, {"label": "Go to Kitty Hawk", "prompt": "If you want to go to Kitty Hawk, tap 'Go to Kitty Hawk'.", "target": "s12", "icon": "dunes"}]}, "s07": {"id": "s07", "page": 7, "title": "The Bike Shop", "place": "Dayton, Ohio, summer 1903", "image": "img/s07.jpg", "paragraphs": ["Evelyn presses the band. The yard goes white. Then it is quiet.", "She is in a shop with lots of bikes. There are wheels on the walls. There are tools on the bench. A sign on the window says Wright Cycle Company.", "A man with a big mustache wipes his hands. \"Hello,\" he says. \"I am Charlie Taylor. I fix bikes here. The brothers are out, but you can look around.\"", "He pats a black motor on the bench. \"I built this motor for their airplane,\" he says. \"We made it light. A heavy motor would be too hard to lift.\"", "There is a long wooden box in the back. And there is a bike just Evelyn's size."], "choices": [{"label": "Look at the long box", "prompt": "If you want to look at the long box, tap 'Look at the long box'.", "target": "s08", "sets": {"tunnel": true, "quest": true}, "icon": "windbox"}, {"label": "Ride the little bike", "prompt": "If you want to ride the little bike, tap 'Ride the little bike'.", "target": "s09", "sets": {"bike": true, "quest": true}, "icon": "bicycle"}]}, "s08": {"id": "s08", "page": 8, "title": "The Wind Box", "place": "The back of the bike shop", "image": "img/s08.jpg", "paragraphs": ["Charlie lifts the lid of the long box. A fan sits at one end. \"This is the wind box,\" he says. \"The brothers made it.\"", "Inside are tiny metal wings. Charlie turns on the fan. Air rushes through the box.", "\"They tried two hundred little wings in here,\" says Charlie. \"Flat ones. Curved ones. Thin ones. They looked to see which wings lifted best.\"", "Evelyn peeks in. A tiny curved wing tips up in the wind. \"That one lifts!\" she says.", "\"That is the kind of curve they picked for the big plane,\" Charlie says.", "Evelyn will remember the wind box."], "choices": [{"label": "Thank Charlie and go home", "prompt": "If you want to thank Charlie and go home, tap 'Thank Charlie and go home'.", "target": "s10", "icon": "home"}, {"label": "Stay and help in the shop", "prompt": "If you want to stay and help in the shop, tap 'Stay and help in the shop'.", "target": "e_bike_shop", "icon": "wrench"}]}, "s09": {"id": "s09", "page": 9, "title": "A Bike Ride", "place": "The street by the bike shop", "image": "img/s09.jpg", "paragraphs": ["Charlie holds the bike. Evelyn climbs on. She wobbles.", "\"Lean a little,\" says Charlie. \"Lean to turn. Lean back to stay up straight.\"", "Evelyn leans left. The bike turns left. She leans right. It turns right. She does not fall! She laughs.", "\"The brothers say a flying machine must balance, just like a bike,\" Charlie says. \"You do not just sit on it. You keep it level.\"", "Evelyn will remember the bike ride."], "choices": [{"label": "Thank Charlie and go home", "prompt": "If you want to thank Charlie and go home, tap 'Thank Charlie and go home'.", "target": "s10", "icon": "home"}, {"label": "Stay and help in the shop", "prompt": "If you want to stay and help in the shop, tap 'Stay and help in the shop'.", "target": "e_bike_shop", "icon": "wrench"}]}, "s10": {"id": "s10", "page": 10, "title": "Home Again", "place": "Evelyn's backyard", "image": "img/s10.jpg", "paragraphs": ["The band hums. Evelyn is back in her own garden. The bees still hum. No time has passed at all.", "She looks at the band. Only two green dots glow now.", "\"What did you see?\" asks Dr. Finch.", "Evelyn tells her all about the shop. Dr. Finch nods. \"Good. That will help you at Kitty Hawk,\" she says.", "\"Now set the band for the big day,\" she says."], "choices": [{"label": "Set the band for Kitty Hawk", "prompt": "If you want to set the band for Kitty Hawk, tap 'Set the band for Kitty Hawk'.", "target": "s12", "icon": "band"}]}, "s11": {"id": "s11", "page": 11, "title": "Too Late", "place": "Kill Devil Hills, the afternoon", "image": "img/s11.jpg", "paragraphs": ["The band hums. Evelyn is on a big sand hill. The wind is cold. The sun is low.", "Down below, men carry the airplane. It is broken. A wing is cracked.", "Evelyn runs down. \"What happened?\"", "\"We flew four times this morning!\" says Orville. He is very happy. \"Then a big gust of wind rolled our Flyer over. No more flying this year.\"", "Evelyn missed it. Her shoulders droop.", "\"We are going to send a telegram to our dad,\" says Wilbur. \"Do you want to walk with us?\""], "choices": [{"label": "Hop back to the morning", "prompt": "If you want to hop back to the morning, tap 'Hop back to the morning'.", "target": {"if": {"coat": true}, "then": "s15", "else": "s13"}, "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges", "icon": "sunrise"}, {"label": "Walk with them to send the telegram", "prompt": "If you want to walk with them to send the telegram, tap 'Walk with them to send the telegram'.", "target": "e_telegram", "icon": "telegram"}]}, "s12": {"id": "s12", "page": 12, "title": "Pick the Time", "place": "Evelyn's backyard", "image": "img/s12.jpg", "paragraphs": ["The band shows Kitty Hawk. Then it shows a date: December 17, 1903. That was a Thursday.", "\"The brothers flew in the morning that day,\" says Dr. Finch. \"Pick a time with care.\"", "The screen shows three buttons. There is a sun coming up, for Thursday morning. There is a sun going down, for Thursday afternoon. And there is a gray cloud, for Monday. That was three days before.", "Which button should Evelyn press?"], "choices": [{"label": "Thursday morning", "prompt": "If you want to thursday morning, tap 'Thursday morning'.", "target": {"if": {"coat": true}, "then": "s15", "else": "s13"}, "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges", "icon": "sunrise"}, {"label": "Thursday afternoon", "prompt": "If you want to thursday afternoon, tap 'Thursday afternoon'.", "target": "s11", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges", "icon": "sunset"}, {"label": "Monday", "prompt": "If you want to monday, tap 'Monday'.", "target": "e_monday", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges", "icon": "cloud"}]}, "s13": {"id": "s13", "page": 13, "title": "Brrr!", "place": "Kill Devil Hills, the morning", "image": "img/s13.jpg", "paragraphs": ["The band hums. Evelyn is on the sand. The wind is very cold. It blows sand on her legs.", "Her sunflower dress flaps. Her arms get goosebumps. Her teeth go chatter, chatter.", "There are little puddles here. They have thin ice on top.", "Near her is a wooden shed. Smoke comes out of a pipe on the roof. A stove must be inside.", "\"Brrr,\" says Evelyn. \"I need to get warm.\""], "choices": [{"label": "Hop home for my warm coat", "prompt": "If you want to hop home for my warm coat, tap 'Hop home for my warm coat'.", "target": "s14", "icon": "coat"}, {"label": "Warm up by the stove in the shed", "prompt": "If you want to warm up by the stove in the shed, tap 'Warm up by the stove in the shed'.", "target": "e_stove", "icon": "stove"}, {"label": "Run in circles to get warm", "prompt": "If you want to run in circles to get warm, tap 'Run in circles to get warm'.", "target": "e_run_warm", "icon": "run"}]}, "s14": {"id": "s14", "page": 14, "title": "Back for the Coat", "place": "Evelyn's backyard", "image": "img/s14.jpg", "paragraphs": ["The band hums. Evelyn is home. Mom is by the hive in her white bee suit.", "\"Cold?\" asks Mom. She brings the warm coat and a knit hat. She gives Evelyn a big hug.", "\"Going back uses a dot,\" says Dr. Finch. \"But now you are ready.\"", "Evelyn zips up her coat. She is warm and snug."], "choices": [{"label": "Hop back to Thursday morning", "prompt": "If you want to hop back to Thursday morning, tap 'Hop back to Thursday morning'.", "target": "s15", "hop": true, "mode": "trip", "cost": {"charges": 1}, "if_no_charges": "e_out_of_charges", "sets": {"coat": true}, "icon": "sunrise"}]}, "s15": {"id": "s15", "page": 15, "title": "Kill Devil Hills", "place": "Kill Devil Hills, near Kitty Hawk, December 17, 1903", "image": "img/s15.jpg", "paragraphs": ["The band hums. Evelyn is on the sand. The wind blows hard and cold. But her coat is warm.", "There are big sand hills. There is the gray sea. There are two wooden sheds.", "And there is the airplane! It sits on a long wooden rail. It has two big wings, one on top of the other. They call it the Flyer.", "Two men in suits and ties work on it. One has a mustache. That is Orville. One has no hair on top. That is Wilbur.", "The band whispers, \"Watch, but do not touch.\"", "What should Evelyn do first?"], "choices": [{"label": "Say hello to the brothers", "prompt": "If you want to say hello to the brothers, tap 'Say hello to the brothers'.", "target": "s17", "icon": "hello"}, {"label": "Peek at the Flyer up close", "prompt": "If you want to peek at the Flyer up close, tap 'Peek at the Flyer up close'.", "target": "s16", "icon": "magnifier"}, {"label": "Tell them about big jets", "prompt": "If you want to tell them about big jets, tap 'Tell them about big jets'.", "target": "e_future", "icon": "jet"}]}, "s16": {"id": "s16", "page": 16, "title": "Up Close", "place": "Next to the Flyer", "image": "img/s16.jpg", "paragraphs": ["Evelyn walks up to the Flyer. It is big. The wings are made of white cloth on thin wood.", "In the middle is a motor. Two long propellers sit at the back. Bike chains turn them, just like on a bike.", "There is a spot on the bottom wing, by the motor. That is where the pilot lies down on his tummy.", "The propellers are shiny. Evelyn wants to touch one so badly."], "choices": [{"label": "Touch the propeller", "prompt": "If you want to touch the propeller, tap 'Touch the propeller'.", "target": "e_touch", "icon": "propeller"}, {"label": "Keep my hands in my pockets", "prompt": "If you want to keep my hands in my pockets, tap 'Keep my hands in my pockets'.", "target": "s17", "icon": "pockets"}]}, "s17": {"id": "s17", "page": 17, "title": "Hello, Wright Brothers", "place": "Next to the Flyer", "image": "img/s17.jpg", "paragraphs": ["\"Hello!\" says Evelyn.", "\"Well, hello!\" says Orville. \"You came on a cold day.\"", "Wilbur holds up a little wind meter. Its tiny cups spin fast. \"The wind is very strong today,\" he says. \"Twenty-seven miles an hour.\"", "\"Is that bad?\" asks Evelyn.", "\"It is hard,\" says Orville. \"But wind can help us too.\"", "He looks at Evelyn. \"We must lay the rail so the Flyer faces one way. Which way should it face?\""], "choices": [{"label": "Face into the wind", "prompt": "If you want to face into the wind, tap 'Face into the wind'.", "target": "s19", "icon": "windface"}, {"label": "Face away, with the wind behind it", "prompt": "If you want to face away, with the wind behind it, tap 'Face away, with the wind behind it'.", "target": "s18", "icon": "windback"}]}, "s18": {"id": "s18", "page": 18, "title": "The Wind Test", "place": "Next to the Flyer", "image": "img/s18.jpg", "paragraphs": ["Wilbur smiles. He hands Evelyn a sheet of paper. \"Let us test it,\" he says.", "\"Turn your back to the wind. Hold the paper out.\" Evelyn does. The paper flops down.", "\"Now turn and face the wind.\" The wind rushes at the paper. It flaps up high!", "\"Air must rush over the wings to lift them,\" says Wilbur. \"When we face into the wind, the wind gives us lots of air. So we do not have to go so fast on the ground.\"", "\"Into the wind!\" says Evelyn."], "choices": [{"label": "Help look at the wings", "prompt": "If you want to help look at the wings, tap 'Help look at the wings'.", "target": "s19", "icon": "wing"}]}, "s19": {"id": "s19", "page": 19, "title": "The Wing Question", "place": "Next to the Flyer", "image": "img/s19.jpg", "paragraphs": ["They lay the rail on flat sand. The Flyer will face into the wind.", "Wilbur taps a wing. \"Look at our wing from the side,\" he says. \"Is it flat? Or is it curved?\"", "Evelyn bends down to look."], "choices": [{"label": "It is curved on top", "prompt": "If you want to it is curved on top, tap 'It is curved on top'.", "target": "s20", "icon": "curve"}, {"label": "It is flat, like a table", "prompt": "If you want to it is flat, like a table, tap 'It is flat, like a table'.", "target": "s21", "icon": "flat"}, {"label": "It is curved, like in the wind box!", "prompt": "If you want to it is curved, like in the wind box!, tap 'It is curved, like in the wind box!'.", "target": "s22", "requires": {"tunnel": true}, "icon": "windbox"}]}, "s20": {"id": "s20", "page": 20, "title": "Curved on Top", "place": "Next to the Flyer", "image": "img/s20.jpg", "paragraphs": ["\"It is curved on top,\" says Evelyn. \"Like my paper at home!\"", "\"Yes!\" says Wilbur. \"When air rushes over the curve, it lifts the wing. Birds have curved wings too.\"", "Just then, five people walk over the sand. Three of them are from the life-saving station down the beach. Their job is to help boats in trouble. Today they came to help with the Flyer.", "One of them is Mr. John Daniels. He tips his hat to Evelyn."], "choices": [{"label": "Go see what Orville is doing", "prompt": "If you want to go see what Orville is doing, tap 'Go see what Orville is doing'.", "target": "s23", "icon": "camera"}]}, "s21": {"id": "s21", "page": 21, "title": "Look Again", "place": "Next to the Flyer", "image": "img/s21.jpg", "paragraphs": ["\"It is flat,\" says Evelyn. \"Like a table.\"", "Wilbur chuckles. \"Look again, from the very end.\"", "Evelyn looks again. Oh! The wing bends up in the middle, like a rainbow. Just a little.", "\"It is curved on top,\" says Wilbur. \"When air rushes over the curve, it lifts the wing. A flat wing does not lift as well.\"", "Just then, five people walk over the sand. Three of them are from the life-saving station down the beach. They came to help. One of them is Mr. John Daniels."], "choices": [{"label": "Go see what Orville is doing", "prompt": "If you want to go see what Orville is doing, tap 'Go see what Orville is doing'.", "target": "s23", "icon": "camera"}]}, "s22": {"id": "s22", "page": 22, "title": "You Saw the Wind Box!", "place": "Next to the Flyer", "image": "img/s22.jpg", "paragraphs": ["\"It is curved,\" says Evelyn. \"Like the little wings in your wind box!\"", "Wilbur's eyes go wide. \"You know about our wind box?\"", "\"I saw it at the bike shop,\" says Evelyn. \"Charlie showed me. The curved wing tipped up.\"", "Wilbur laughs a big laugh. \"Orville! This girl knows our wind box!\" Orville laughs too.", "\"We tested lots of wings,\" says Wilbur. \"This curve lifted best. So we used it.\"", "Just then, five people walk over the sand. They came to help. One of them is Mr. John Daniels."], "choices": [{"label": "Go see what Orville is doing", "prompt": "If you want to go see what Orville is doing, tap 'Go see what Orville is doing'.", "target": "s23", "icon": "camera"}]}, "s23": {"id": "s23", "page": 23, "title": "The Camera", "place": "Near the end of the rail", "image": "img/s23.jpg", "paragraphs": ["Orville sets up a big wooden camera on three legs. He points it at the end of the rail.", "He shows Mr. Daniels a little rubber ball on a tube. \"When the Flyer goes up, squeeze this,\" he says. Mr. Daniels has never used a camera before. He nods.", "The brothers shake hands. It is Orville's turn to fly.", "They have to wait for the motor to warm up. Evelyn has a little time."], "choices": [{"label": "Ask why it is Orville's turn", "prompt": "If you want to ask why it is Orville's turn, tap 'Ask why it is Orville's turn'.", "target": "s24", "icon": "coin2"}, {"label": "Ask how they keep it level", "prompt": "If you want to ask how they keep it level, tap 'Ask how they keep it level'.", "target": "s26", "icon": "twist"}, {"label": "Squeeze the camera ball myself", "prompt": "If you want to squeeze the camera ball myself, tap 'Squeeze the camera ball myself'.", "target": "e_camera", "icon": "bulb"}, {"label": "Fly my paper glider", "prompt": "If you want to fly my paper glider, tap 'Fly my paper glider'.", "target": "s25", "requires": {"glider": true}, "icon": "glider"}]}, "s24": {"id": "s24", "page": 24, "title": "Wilbur's Turn Was Monday", "place": "Near the shed", "image": "img/s24.jpg", "paragraphs": ["\"Why is it Orville's turn?\" asks Evelyn.", "\"On Monday, we flipped a coin,\" says Wilbur. \"I won. So I went first.\"", "\"Did you fly?\" asks Evelyn.", "\"Only for a hop,\" says Wilbur. \"I tipped the nose up too high. The Flyer slowed down and bumped into the sand. We had to fix it.\"", "\"Going too steep makes you slow,\" he says. \"Slow wings do not lift well. Today, Orville will keep the nose low and steady.\""], "choices": [{"label": "Go back to the Flyer", "prompt": "If you want to go back to the Flyer, tap 'Go back to the Flyer'.", "target": "s27", "icon": "flyer"}]}, "s25": {"id": "s25", "page": 25, "title": "A Twist in the Wing", "place": "On the sand", "image": "img/s25.jpg", "paragraphs": ["Evelyn takes out her paper glider. She throws it into the wind.", "It flies, but it tips to one side. It spins down to the sand.", "Wilbur picks it up. He bends one wing tip up a tiny bit. He bends the other tip down. \"Try now,\" he says.", "Evelyn throws it again. This time it flies level. Then it makes a gentle turn!", "\"We twist our wing tips too,\" says Wilbur. \"Wires pull them. It keeps us level, like a bird. It helps us turn.\""], "choices": [{"label": "Go back to the Flyer", "prompt": "If you want to go back to the Flyer, tap 'Go back to the Flyer'.", "target": "s27", "icon": "flyer"}]}, "s26": {"id": "s26", "page": 26, "title": "The Twisty Box", "place": "Near the shed", "image": "img/s26.jpg", "paragraphs": ["\"How do you keep it level?\" asks Evelyn.", "Wilbur picks up a long, thin box. He holds the two ends. He twists them. One end tips up. The other end tips down.", "\"I was holding a box like this in our shop one day,\" he says. \"I saw the ends twist. I got an idea.\"", "\"We twist our wing tips the same way,\" he says. \"Wires pull them. One tip goes up. One goes down. That keeps us level, like a bird. Like keeping a bike up.\""], "choices": [{"label": "Go back to the Flyer", "prompt": "If you want to go back to the Flyer, tap 'Go back to the Flyer'.", "target": "s27", "icon": "flyer"}]}, "s27": {"id": "s27", "page": 27, "title": "Where to Stand", "place": "Near the end of the rail", "image": "img/s27.jpg", "paragraphs": ["Pop, pop, pop! The motor starts. The propellers spin and whir.", "Orville lies down on his tummy on the bottom wing. Wilbur holds one wing tip, so it will not tip over.", "Mr. Daniels stands by the camera. He holds the rubber ball.", "Evelyn wants to see it all. Where should she stand?"], "choices": [{"label": "Stand next to Mr. Daniels", "prompt": "If you want to stand next to Mr. Daniels, tap 'Stand next to Mr. Daniels'.", "target": "s28", "icon": "camera"}, {"label": "Run out in front to see better", "prompt": "If you want to run out in front to see better, tap 'Run out in front to see better'.", "target": "e_in_photo", "icon": "run"}, {"label": "Climb the big sand hill", "prompt": "If you want to climb the big sand hill, tap 'Climb the big sand hill'.", "target": "e_far", "icon": "hill"}]}, "s28": {"id": "s28", "page": 28, "title": "It Flies!", "place": "Kill Devil Hills, 10:35 in the morning", "image": "img/s28.jpg", "paragraphs": ["Evelyn stands next to Mr. Daniels. She presses record on her band.", "The Flyer rolls down the rail. Wilbur runs next to it. Then the Flyer lifts up into the air!", "Mr. Daniels squeezes the rubber ball. Click!", "The Flyer bobs up and down in the wind. It flies for twelve seconds. Then it lands in the sand.", "\"It flew!\" shouts Evelyn. She jumps up and down. The men cheer and clap.", "That was the first time a plane with a motor flew with a person on it.", "The band blinks. \"Recording saved,\" it says."], "choices": [{"label": "Hop home with the recording", "prompt": "If you want to hop home with the recording, tap 'Hop home with the recording'.", "target": "e_first_flight", "icon": "home"}, {"label": "Ask Mr. Daniels about the photo", "prompt": "If you want to ask Mr. Daniels about the photo, tap 'Ask Mr. Daniels about the photo'.", "target": "e_photo", "icon": "camera"}, {"label": "Stay for more flights", "prompt": "If you want to stay for more flights, tap 'Stay for more flights'.", "target": "s29", "icon": "flyer"}]}, "s29": {"id": "s29", "page": 29, "title": "More Flights", "place": "Kill Devil Hills, late morning", "image": "img/s29.jpg", "paragraphs": ["The men carry the Flyer back to the start of the rail.", "Now it is Wilbur's turn. He flies a little farther. Then it is Orville's turn again. He flies farther still.", "Everyone is so cold. Their noses are red. Their fingers are stiff.", "\"Let us warm up inside,\" says Orville.", "Up on the sand hill, some sea gulls float in the wind."], "choices": [{"label": "Warm up by the stove", "prompt": "If you want to warm up by the stove, tap 'Warm up by the stove'.", "target": "s30", "icon": "stove"}, {"label": "Watch the gulls", "prompt": "If you want to watch the gulls, tap 'Watch the gulls'.", "target": "s31", "icon": "gull"}, {"label": "Ask to ride on the Flyer", "prompt": "If you want to ask to ride on the Flyer, tap 'Ask to ride on the Flyer'.", "target": "e_ask_fly", "icon": "flyer"}]}, "s30": {"id": "s30", "page": 30, "title": "By the Stove", "place": "Inside the shed", "image": "img/s30.jpg", "paragraphs": ["Inside the shed, a little stove glows. Everyone holds out their hands. Ahh, warm!", "Orville writes in a small book. \"Wind is very strong,\" he writes.", "\"Why did you build a plane?\" asks Evelyn.", "\"When we were boys, our dad gave us a toy,\" says Orville. \"It flew up to the ceiling. We never forgot it.\"", "Wilbur stands up. \"Now it is my turn again. I will try to fly far.\""], "choices": [{"label": "Go out to watch Wilbur", "prompt": "If you want to go out to watch Wilbur, tap 'Go out to watch Wilbur'.", "target": "s32", "icon": "flyer"}]}, "s31": {"id": "s31", "page": 31, "title": "The Gulls", "place": "On the sand hill", "image": "img/s31.jpg", "paragraphs": ["Evelyn climbs a bit of the hill. Three gulls float in the wind. They face into the wind. They do not flap at all.", "One gull tips. It twists the very tip of its wing. Now it is level again.", "\"They do it just like the Flyer!\" says Evelyn.", "Wilbur walks up the hill. \"We watched birds for years,\" he says. \"They taught us a lot.\"", "\"Now it is my turn again,\" he says. \"I will try to fly far.\""], "choices": [{"label": "Go down to watch Wilbur", "prompt": "If you want to go down to watch Wilbur, tap 'Go down to watch Wilbur'.", "target": "s32", "icon": "flyer"}, {"label": "Watch from up on the hill", "prompt": "If you want to watch from up on the hill, tap 'Watch from up on the hill'.", "target": "e_hill_view", "icon": "hill"}]}, "s32": {"id": "s32", "page": 32, "title": "The Long Flight", "place": "Kill Devil Hills, noon", "image": "img/s32.jpg", "paragraphs": ["Wilbur lies down on the bottom wing. The Flyer rolls down the rail and lifts up.", "It goes up and down, up and down, like a boat on waves. It goes on and on. Past the first spot. Past the next spot. Far over the sand!", "Wilbur flies for almost a whole minute. That is the longest flight of the day.", "Then the Flyer comes down hard. Bump! A part in the front breaks. But Wilbur is fine. He waves his cap.", "\"Hooray!\" Evelyn cheers. Her band records it all."], "choices": [{"label": "Run to see Wilbur", "prompt": "If you want to run to see Wilbur, tap 'Run to see Wilbur'.", "target": "s33", "icon": "run"}, {"label": "Hop home now", "prompt": "If you want to hop home now, tap 'Hop home now'.", "target": "e_four_flights", "icon": "home"}]}, "s33": {"id": "s33", "page": 33, "title": "The Gust", "place": "Kill Devil Hills, after the last flight", "image": "img/s33.jpg", "paragraphs": ["The men carry the Flyer back. They set it down on the sand. Everyone talks and laughs.", "Then the wind gets very strong. Whoosh! A big gust lifts the Flyer's wing. The Flyer starts to roll over and over across the sand!", "Mr. Daniels grabs it. He tumbles with it.", "What should Evelyn do?"], "choices": [{"label": "Grab the Flyer too", "prompt": "If you want to grab the Flyer too, tap 'Grab the Flyer too'.", "target": "e_gust", "icon": "grab"}, {"label": "Step back and stay safe", "prompt": "If you want to step back and stay safe, tap 'Step back and stay safe'.", "target": {"if": {"quest": true}, "then": "e_best", "else": "e_four_flights"}, "icon": "stepback"}]}}, "endings": {"e_first_flight": {"id": "e_first_flight", "page": 34, "type": "GOOD", "title": "The First Flight", "image": "img/e_first_flight.jpg", "paragraphs": ["The band hums. Evelyn is home. The sunflowers sway.", "Dr. Finch plays the recording. There is the Flyer on its rail. There is Wilbur, running. There it goes, up into the air!", "\"You did it!\" says Dr. Finch. \"The museum will love this.\"", "Mom gives Evelyn a big hug. \"Did it really fly?\" she asks.", "\"Yes,\" says Evelyn. \"Twelve seconds. It flew into the wind.\"", "That night, Evelyn dreams of wings."], "really_there": {"title": "The Real First Flight", "text": "This really happened. Here are real photos of the Wright brothers and their Flyer.", "photos": [{"src": "img/photos/first_flight.jpg", "id": "first_flight", "caption": "This is the real first flight, on December 17, 1903. Orville is flying. Wilbur ran next to the wing. Mr. John Daniels squeezed the ball to take this picture.", "credit": "John T. Daniels. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:First_flight2.jpg"}, {"src": "img/photos/dec14_rail.jpg", "id": "dec14_rail", "caption": "This is the Flyer on its long wooden rail. This was Monday, December 14, the day of Wilbur's short hop.", "credit": "Attributed to Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:1903_Wright_Flyer_on_launch_track_before_unsuccessful_flight_attempt_14_December_1903.jpg"}, {"src": "img/photos/orville.jpg", "id": "orville", "caption": "This is Orville Wright. He flew first.", "credit": "Orville Wright and Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Orville_Wright_1905.jpg"}, {"src": "img/photos/wilbur.jpg", "id": "wilbur", "caption": "This is Wilbur Wright. He made the longest flight of the day.", "credit": "Orville Wright and Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Wilbur_Wright_1905.jpg"}, {"src": "img/photos/glider1902.jpg", "id": "glider1902", "caption": "Before the Flyer, the brothers flew gliders with no motor. This one is from 1902. They learned to twist the wing tips to stay level.", "credit": "Attributed to Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:1902_Wright_glider_in_right_turn.jpg"}, {"src": "img/photos/damaged.jpg", "id": "damaged", "caption": "This is the Flyer after the fourth flight. A part in the front broke when it landed.", "credit": "Attributed to Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:1903_Wright_Flyer_damaged_on_ground_after_final_flight_17_December_1903.jpg"}, {"src": "img/photos/telegram.jpg", "id": "telegram", "caption": "Orville sent this telegram to his dad. It says they made four flights on Thursday morning.", "credit": "Orville Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Telegram_from_Orville_Wright_in_Kitty_Hawk,_North_Carolina,_to_His_Father_Announcing_Four_Successful_Flights,_1903_December_17.png"}, {"src": "img/photos/cycle_shop.jpg", "id": "cycle_shop", "caption": "This is Orville at work in the Wright Cycle Company, the brothers' bike shop in Dayton.", "credit": "National Park Service. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Orville_Wright_in_a_work_apron_standing_behind_equipment_at_the_Wright_Cycle_Company,_c._1890s._(a1895985-1dd8-b71b-0bd7-087631da420f).jpg"}, {"src": "img/photos/tunnel.jpg", "id": "tunnel", "caption": "This is a copy of the brothers' wind box. They tested little wings inside it.", "credit": "MLWatts. CC BY-SA 3.0. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Wright_Brothers_Wind_Tunnel_Replica.jpg"}]}}, "e_four_flights": {"id": "e_four_flights", "page": 35, "type": "GOOD", "title": "Four Flights", "image": "img/e_four_flights.jpg", "paragraphs": ["The band hums. Evelyn is home.", "Dr. Finch plays the recording. It has all four flights! It has Wilbur's long flight, up and down like a wave.", "\"Four flights!\" says Dr. Finch. \"On the last one, Wilbur went eight hundred fifty two feet. That is longer than two soccer fields.\"", "Mom laughs. \"You saw more than anybody else in the whole world!\"", "Evelyn smiles. \"They flew into the wind,\" she says. \"And they kept it light.\""], "really_there": {"title": "The Real First Flight", "text": "This really happened. Here are real photos of the Wright brothers and their Flyer.", "photos": [{"src": "img/photos/first_flight.jpg", "id": "first_flight", "caption": "This is the real first flight, on December 17, 1903. Orville is flying. Wilbur ran next to the wing. Mr. John Daniels squeezed the ball to take this picture.", "credit": "John T. Daniels. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:First_flight2.jpg"}, {"src": "img/photos/dec14_rail.jpg", "id": "dec14_rail", "caption": "This is the Flyer on its long wooden rail. This was Monday, December 14, the day of Wilbur's short hop.", "credit": "Attributed to Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:1903_Wright_Flyer_on_launch_track_before_unsuccessful_flight_attempt_14_December_1903.jpg"}, {"src": "img/photos/orville.jpg", "id": "orville", "caption": "This is Orville Wright. He flew first.", "credit": "Orville nnel.jpg", "id": "tunnel", "caption": "This is a copy of the brothers' wind box. They tested little wings inside it.", "credit": "MLWatts. CC BY-SA 3.0. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Wright_Brothers_Wind_Tunnel_Replica.jpg"}]}}, "e_best": {"id": "e_best", "page": 36, "type": "GOOD", "title": "The Best Day at Kitty Hawk", "image": "img/e_best.jpg", "paragraphs": ["Evelyn steps back. The men hold on. The wind dies down. The Flyer is broken, but everyone is safe.", "Wilbur walks over to Evelyn. \"You knew about our shop,\" he says. \"You knew how we keep it level, and why we picked our wing. You think like an inventor.\"", "The band hums. Evelyn is home.", "Dr. Finch plays the recording. It has all four flights. It has Wilbur talking about wings. It even has the bike shop!", "\"This is the best recording the museum has ever had,\" says Dr. Finch.", "Evelyn grins. Then she runs to the garden. She has a new glider to build."], "really_there": {"title": "The Real First Flight", "text": "This really happened. Here are real photos of the Wright brothers and their Flyer.", "photos": [{"src": "img/photos/first_flight.jpg", "id": "first_flight", "caption": "This is the real first flight, on December 17, 1903. Orville is flying. Wilbur ran next to the wing. Mr. John Daniels squeezed the ball to take this picture.", "credit": "John T. Daniels. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:First_flight2.jpg"}, {"src": "img/photos/dec14_rail.jpg", "id": "dec14_rail", "caption": "This is the Flyer on its long wooden rail. This was Monday, December 14, the day of Wilbur's short hop.", "credit": "Attributed to Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:1903_Wright_Flyer_on_launch_track_before_unsuccessful_flight_attempt_14_December_1903.jpg"}, {"src": "img/photos/orville.jpg", "id": "orville", "caption": "This is Orville Wright. He flew first." ur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Orville_Wright_1905.jpg"}, {"src": "img/photos/wilbur.jpg", "id": "wilbur", "caption": "This is Wilbur Wright. He made the longest flight of the day.", "credit": "Orville Wright and Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Wilbur_Wright_1905.jpg"}, {"src": "img/photos/glider1902.jpg", "id": "glider1902", "caption": "Before the Flyer, the brothers flew gliders with no motor. This one is from 1902. They learned to twist the wing tips to stay level.", "credit": "Attributed to Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:1902_Wright_glider_in_right_turn.jpg"}, {"src": "img/photos/damaged.jpg", "id": "damaged", "caption": "This is the Flyer after the fourth flight. A part in the front broke when it landed.", "credit": "Attributed to Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:1903_Wright_Flyer_damaged_on_ground_after_final_flight_17_December_1903.jpg"}, {"src": "img/photos/telegram.jpg", "id": "telegram", "caption": "Orville sent this telegram to his dad. It says they made four flights on Thursday morning.", "credit": "Orville Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Telegram_from_Orville_Wright_in_Kitty_Hawk,_North_Carolina,_to_His_Father_Announcing_Four_Successful_Flights,_1903_December_17.png"}, {"src": "img/photos/cycle_shop.jpg", "id": "cycle_shop", "caption": "This is Orville at work in the Wright Cycle Company, the brothers' bike shop in Dayton.", "credit": "National Park Service. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Orville_Wright_in_a_work_apron_standing_behind_equipment_at_the_Wright_Cycle_Company,_c._1890s._(a1895985-1dd8-b71b-0bd7-087631da420f).jpg"}, {"src": "img/photos/tunnel.jpg", "id": "tunnel", "caption": "This is a copy of the brothers' wind box. They tested little wings inside it.", "credit": "MLWatts. CC BY-SA 3.0. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Wright_Brothers_Wind_Tunnel_Replica.jpg"}]}}, "e_bike_shop": {"id": "e_bike_shop", "page": 38, "type": "GOOD", "title": "A Day at the Bike Shop", "image": "img/e_bike_shop.jpg", "paragraphs": ["Evelyn stays at the shop. She hands Charlie the tools. She pumps air into a bike tire. She sweeps up the metal bits.", "\"You are a good helper,\" says Charlie. \"The brothers will fly at Kitty Hawk in the winter. I hope it works.\"", "\"It will,\" says Evelyn. \"I know it will.\"", "Charlie gives her a funny look. Evelyn just smiles.", "The band hums. Evelyn is home. She did not see the flight. But she saw where it all began.", "\"The band still has two dots,\" says Dr. Finch. \"Another day, you can go to Kitty Hawk.\""], "really_there": {"title": "The Real First Flight", "text": "This really happened. Here are real photos of the Wright brothers and their Flyer.", "photos": [{"src": "img/photos/first_flight.jpg", "id": "first_flight", "caption": "This is the real first flight, on December 17, 1903. Orville is flying. Wilbur ran next to the wing. Mr. John Daniels squeezed the ball to take this picture.", "credit": "John T. Daniels. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:First_flight2.jpg"}, {"src": "img/photos/dec14_rail.jpg", "id": "dec14_rail", "caption": "This is the Flyer on its long wooden rail. This was Monday, December 14, the day of Wilbur's short hop.", "credit": "Attributed to Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:1903_Wright_Flyer_on_launch_track_before_unsuccessful_flight_attempt_14_December_1903.jpg"}, {"src": "img/photos/orville.jpg", "id": "orville", "caption": "This is Orville Wright. He flew first.", "credit": "Orville Wright and Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Orville_Wright_1905.jpg"}, {"src": "img/photos/wilbur.jpg", "id": "wilbur", "caption": "This is Wilbur Wright. He made the longest flight of the day.", "credit": "Orville Wright and Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Wilbur_Wright_1905.jpg"}, {"src": "img/photos/glider1902.jpg", "id": "glider1902", "caption": "Before the Flyer, the brothers flew gliders with no motor. This one is from 1902. They learned to twist the wing tips to stay level.", "credit": "Attributed to Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:1902_Wright_glider_in_right_turn.jpg"}, {"src": "img/photos/damaged.jpg", "id": "damaged", "caption": "This is the Flyer after the fourth flight. A part in the front broke when it landed.", "credit": "Attributed to Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:1903_Wright_Flyer_damaged_on_ground_after_final_flight_17_December_1903.jpg"}, {"src": "img/photos/telegram.jpg", "id": "telegram", "caption": "Orville sent this telegram to his dad. It says they made four flights on Thursday morning.", "credit": "Orville Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Telegram_from_Orville_Wright_in_Kitty_Hawk,_North_Carolina,_to_His_Father_Announcing_Four_Successful_Flights,_1903_December_17.png"}, {"src": "img/photos/cycle_shop.jpg", "id": "cycle_shop", "caption": "This is Orville at work in the Wright Cycle Company, the brothers' bike shop in Dayton.", "credit": "National Park Service. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Orville_Wright_in_a_work_apron_standing_behind_equipment_at_the_Wright_Cycle_Company,_c._1890s._(a1895985-1dd8-b71b-0bd7-087631da420f).jpg"}, {"src": "img/photos/tunnel.jpg", "id": "tunnel", "caption": "This is a copy of the brothers' wind box. They tested little wings inside it.", "credit": "MLWatts. CC BY-SA 3.0. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Wright_Brothers_Wind_Tunnel_Replica.jpg"}]}}, "e_stove": {"id": "e_stove", "page": 39, "type": "BAD", "title": "Too Warm, Too Sleepy", "image": "img/e_stove.jpg", "paragraphs": ["Evelyn goes into the shed. A little stove glows. Ahh, it is warm.", "She sits down on a box. She warms her hands. Her eyes get heavy. She falls asleep.", "Far away, there is a pop, pop, pop. Then there is a cheer. But Evelyn does not wake up.", "The band hums. Evelyn is home. She missed the first flight!", "\"A warm coat would help,\" says Dr. Finch kindly. \"Then you can stay outside and watch.\"", "What could Evelyn try differently? Tap Try again."]}, "e_touch": {"id": "e_touch", "page": 40, "type": "BAD", "title": "Do Not Touch", "image": "img/e_touch.jpg", "paragraphs": ["Evelyn reaches out. Her finger is just about to touch the propeller.", "Beep! Beep! The band flashes red. \"Do not touch!\" it says. The sand goes white. Then Evelyn is home.", "\"A little bump can crack a propeller,\" says Dr. Finch. \"Then they might not fly that day. That would change what happened.\"", "Evelyn puts her hands in her pockets. \"I will just look next time,\" she says.", "What could Evelyn try differently? Tap Try again."]}, "e_in_photo": {"id": "e_in_photo", "page": 41, "type": "BAD", "title": "In the Picture", "image": "img/e_in_photo.jpg", "paragraphs": ["Evelyn runs out in front of the Flyer. She waves her arms.", "Beep! Beep! The band flashes red. \"You are in the picture!\" it says. The sand goes white. Then Evelyn is home.", "\"Mr. Daniels was about to take a very famous photo,\" says Dr. Finch. \"In the real photo, there is no girl in front. We must not change it.\"", "Evelyn giggles. \"Oops. I will stand next to him next time.\"", "What could Evelyn try differently? Tap Try again."]}, "e_far": {"id": "e_far", "page": 42, "type": "BAD", "title": "Too Far Away", "image": "img/e_far.jpg", "paragraphs": ["Evelyn climbs the big sand hill. Up, up, up. The sand slides under her boots. The wind blows hard.", "At the top, she turns around. The Flyer is way down below. It looks as small as a bug!", "She presses record. Far away, a tiny speck lifts up. Then it is down again.", "The band hums. Evelyn is home. Dr. Finch plays the recording. \"I can not see much,\" she says. \"It is just a little dot.\"", "\"Next time, I will stand close,\" says Evelyn. \"But not in the way.\"", "What could Evelyn try differently? Tap Try again."]}, "e_gust": {"id": "e_gust", "page": 43, "type": "BAD", "title": "Swept Away", "image": "img/e_gust.jpg", "paragraphs": ["Evelyn runs to grab the Flyer. But the wind is too strong. The wing lifts up high over her head.", "Beep! Beep! The band flashes red. \"Not safe!\" it says. The sand goes white. Then Evelyn is home.", "Dr. Finch hugs her. \"That gust was very strong,\" she says. \"Mr. Daniels got bumped and bruised. The Flyer broke. You did the right thing to want to help. But big wind can push a plane like a leaf.\"", "\"Next time, I will step back,\" says Evelyn.", "What could Evelyn try differently? Tap Try again."]}, "e_out_of_charges": {"id": "e_out_of_charges", "page": 44, "type": "BAD", "title": "No Dots Left", "image": "img/e_out_of_charges.jpg", "paragraphs": ["Evelyn presses the band. Nothing happens. All three dots are dark.", "\"Oh no,\" says Evelyn. \"I used up all my trips.\"", "\"The band needs a long rest now,\" says Dr. Finch. \"It will take a whole night to charge up.\"", "Evelyn sighs. Then she smiles. \"Can we try again tomorrow?\"", "\"Of course,\" says Dr. Finch. \"Think about which trips you really need.\"", "What could Evelyn try differently? Tap Try again."]}, "e_monday": {"id": "e_monday", "page": 45, "type": "BAD", "title": "Monday", "image": "img/e_monday.jpg", "paragraphs": ["The band hums. It is Monday, three days before. The sky is gray.", "Evelyn sees Wilbur lie down on the Flyer. It rolls down the rail. It lifts up a little. Then the nose tips up too high. It slows down. Bump! It lands in the sand.", "\"Just a hop,\" says Wilbur. \"Not a real flight. We must fix it.\"", "The band hums. Evelyn is home. \"No flight on Monday,\" says Dr. Finch. \"The real flight was on Thursday.\"", "What could Evelyn try differently? Tap Try again."]}, "e_future": {"id": "e_future", "page": 46, "type": "BAD", "title": "Too Much to Tell", "image": "img/e_future.jpg", "paragraphs": ["\"Guess what?\" says Evelyn. \"One day, there will be giant jets! They will fly over the sea. Lots of people will ride in them!\"", "Orville blinks. Wilbur tips his head.", "Beep! Beep! The band flashes red. \"Do not tell the future!\" it says. The sand goes white. Then Evelyn is home.", "\"The brothers had to find out on their own,\" says Dr. Finch. \"If you tell them what comes next, you could change what they do.\"", "Evelyn covers her mouth and laughs. \"It was so hard to keep it a secret!\"", "What could Evelyn try differently? Tap Try again."]}, "e_camera": {"id": "e_camera", "page": 47, "type": "BAD", "title": "Not My Job", "image": "img/e_camera.jpg", "paragraphs": ["Evelyn reaches for the rubber ball. \"I can do it!\" she says.", "Mr. Daniels pulls it back. \"Orville asked me,\" he says.", "Beep! Beep! The band flashes red. \"Do not change what happened!\" it says. The sand goes white. Then Evelyn is home.", "\"Mr. Daniels took the real photo,\" says Dr. Finch. \"It is famous now. His name goes with it. That was his job, not yours.\"", "Evelyn nods. \"My job is to watch and record,\" she says.", "What could Evelyn try differently? Tap Try again."]}, "e_run_warm": {"id": "e_run_warm", "page": 48, "type": "BAD", "title": "Round and Round", "image": "img/e_run_warm.jpg", "paragraphs": ["Evelyn runs in a circle. Round and round. Her dress flaps in the wind.", "She gets a little warm. Then she stops. The wind is cold again! She runs some more.", "Soon her legs are tired. She is full of sand. She is still cold. She sits down behind a sand hill and shivers.", "The band hums. \"Too cold,\" it says. Then Evelyn is home.", "\"Running helps a little,\" says Dr. Finch. \"But a warm coat keeps the heat in all day.\"", "What could Evelyn try differently? Tap Try again."]}, "e_ask_fly": {"id": "e_ask_fly", "page": 49, "type": "BAD", "title": "Just One Seat", "image": "img/e_ask_fly.jpg", "paragraphs": ["\"Can I ride on the Flyer?\" asks Evelyn.", "Orville shakes his head. \"There is only room for one,\" he says. \"Just the pilot. And it is not safe yet.\"", "\"Please?\" says Evelyn. She climbs up on the rail.", "Beep! Beep! The band flashes red. \"Not safe!\" it says. The sand goes white. Then Evelyn is home.", "\"The Flyer could carry just one person,\" says Dr. Finch. \"Every bit of weight made it harder to lift. Even a small girl is a lot of weight for a plane like that.\"", "What could Evelyn try differently? Tap Try again."]}, "e_photo": {"id": "e_photo", "page": 50, "type": "GOOD", "title": "The Famous Photo", "image": "img/e_photo.jpg", "paragraphs": ["\"Did you get the picture?\" asks Evelyn.", "\"I squeezed the ball,\" says Mr. Daniels. \"But I do not know if it worked.\"", "\"The picture is on a glass plate,\" says Orville. \"We will make it into a photo back home in Ohio.\"", "The band hums. Evelyn is home.", "Dr. Finch opens a big book. \"Look,\" she says. There is the photo! There is the Flyer, just up in the air. There is Wilbur, running next to it.", "\"It worked!\" says Evelyn. \"I was standing right next to him!\""], "really_there": {"title": "The Real First Flight", "text": "This really happened. Here are real photos of the Wright brothers and their Flyer.", "photos": [{"src": "img/photos/first_flight.jpg", "id": "first_flight", "caption": "This is the real first flight, on December 17, 1903. Orville is flying. Wilbur ran next to the wing. Mr. John Daniels squeezed the ball to take this picture.", "credit": "John T. Daniels. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:First_flight2.jpg"}, {"src": "img/photos/dec14_rail.jpg", "id": "dec14_rail", "caption": "This is the Flyer on its long wooden rail. This was Monday, December 14, the day of Wilbur's short hop.", "credit": "Attributed to Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:1903_Wright_Flyer_on_launch_track_before_unsuccessful_flight_attempt_14_December_1903.jpg"}, {"src": "img/photos/orville.jpg", "id": "orville", "caption": "This is Orville Wright. He flew first.", "credit": "Orville Wright and Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Orville_Wright_1905.jpg"}, {"src": "img/photos/wilbur.jpg", "id": "wilbur", "caption": "This is Wilbur Wright. He made the longest flight of the day.", "credit": "Orville Wright and Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Wilbur_Wright_1905.jpg"}, {"src": "img/photos/glider1902.jpg", "id": "glider1902", "caption": "Before the Flyer, the brothers flew gliders with no motor. This one is from 1902. They learned to twist the wing tips to stay level.", "credit": "Attributed to Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:1902_Wright_glider_in_right_turn.jpg"}, {"src": "img/photos/damaged.jpg", "id": "damaged", "caption": "This is the Flyer after the fourth flight. A part in the front broke when it landed.", "credit": "Attributed to Wilbur Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:1903_Wright_Flyer_damaged_on_ground_after_final_flight_17_December_1903.jpg"}, {"src": "img/photos/telegram.jpg", "id": "telegram", "caption": "Orville sent this telegram to his dad. It says they made four flights on Thursday morning.", "credit": "Orville Wright. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Telegram_from_Orville_Wright_in_Kitty_Hawk,_North_Carolina,_to_His_Father_Announcing_Four_Successful_Flights,_1903_December_17.png"}, {"src": "img/photos/cycle_shop.jpg", "id": "cycle_shop", "caption": "This is Orville at work in the Wright Cycle Company, the brothers' bike shop in Dayton.", "credit": "National Park Service. Public domain. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Orville_Wright_in_a_work_apron_standing_behind_equipment_at_the_Wright_Cycle_Company,_c._1890s._(a1895985-1dd8-b71b-0bd7-087631da420f).jpg"}, {"src": "img/photos/tunnel.jpg", "id": "tunnel", "caption": "This is a copy of the brothers' wind box. They tested little wings inside it.", "credit": "MLWatts. CC BY-SA 3.0. Wikimedia Commons.", "source": "https://commons.wikimedia.org/wiki/File:Wright_Brothers_Wind_Tunnel_Replica.jpg"}]}}, "e_hill_view": {"id": "e_hill_view", "page": 51, "type": "GOOD", "title": "From the Hill", "image": "img/e_hill_view.jpg", "paragraphs": ["Evelyn sits on the hill with the gulls. She presses record.", "Down below, Wilbur's Flyer lifts up. From up here, she can see the whole flight. Up and down, like a wave. On and on, far across the sand.", "The gulls float next to her. The Flyer floats too.", "The band hums. Evelyn is home. Dr. Finch plays the recording. \"The whole long flight, from the top of the hill!\" she says. \"And look, gulls in it too!\"", "\"The gulls were showing them how,\" Evelyn says."], "really_there": {"title": "The Real First Flight", "text": "This really happened. Here are real photos of the Wright brothers and their Flyer.", "photos": [{"src": "img/photos/first_flight.jpg", "id": "first_flight", "caption": "This is the real first flight, on December 17, 1903. Orville is flying. Wilbur ran next to the wing. Mr. John Daniels squeezed the ball to take this picture.", "credit": "John T. Daniels. Public do   function showSpeed() { $("speed").value = rd.speed; $("speedVal").textContent = rd.speed.toFixed(2).replace(/0$/, "") + "\u00D7"; }

  $("auto").onchange = function () { autoRead = this.checked; try { localStorage.setItem(KEY + "auto", autoRead ? "1" : "0"); } catch (e) {} };

  }

  // Built-in voice for paragraphs pi..lastPi, then done()

    highlight(pi, wi); synth.speak(u); if (synth.paused) synth.resume();

  }

  // Recorded clip with word timings
  function playAudioSeg(si, local, at) {
    var g = segs[si], W = g.a.words, my = gen, el = new Audio();

  function openMenu() {
